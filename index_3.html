<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ôn tập giới từ tiếng Anh</title>
<style>
  :root{
    --ink:#1c1c1e; --muted:#6b7280; --line:#d8dbe0; --accent:#2563eb;
    --ok:#16a34a; --okbg:#e9f8ee; --bad:#dc2626; --badbg:#fdeceb;
    --box:#f6f7f9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);background:#fff;font-size:17px;line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:820px;margin:0 auto;padding:0 14px 60px;}
  /* sticky progress bar */
  .bar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);
       padding:8px 14px;margin:0 -14px 6px;}
  .bar .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
       max-width:820px;margin:0 auto;}
  .bar .ttl{font-weight:700;font-size:15px;}
  .bar .prog{font-size:14px;color:var(--muted);white-space:nowrap;}
  .track{height:6px;background:#eceef2;border-radius:6px;margin-top:6px;overflow:hidden;
       max-width:820px;}
  .fill{height:100%;width:0;background:var(--accent);transition:width .2s;}
  h1{font-size:20px;margin:14px 0 2px;}
  .intro{color:var(--muted);font-size:14px;margin:0 0 4px;}
  /* score banner */
  .score{display:none;margin:12px 0;padding:14px 16px;border-radius:10px;
       background:var(--box);border:1px solid var(--line);}
  .score.show{display:block;}
  .score .big{font-size:26px;font-weight:800;}
  .score .sub{color:var(--muted);font-size:15px;margin-top:2px;}
  /* exercise */
  .ex{margin-top:26px;padding-top:16px;border-top:2px solid #eceef2;}
  .ex h2{font-size:18px;margin:0 0 6px;display:flex;align-items:center;gap:8px;}
  .ex h2 .num{display:inline-flex;align-items:center;justify-content:center;
       min-width:30px;height:30px;padding:0 6px;border-radius:50%;background:var(--accent);
       color:#fff;font-size:15px;font-weight:700;}
  .instr{font-style:italic;color:#374151;margin:0 0 8px;}
  .note{font-size:14px;color:var(--muted);margin:0 0 8px;}
  .list{background:var(--box);border:1px solid var(--line);border-radius:8px;
       padding:8px 12px;margin:0 0 10px;font-size:15px;}
  .list b{font-style:normal;}
  .pic{display:block;max-width:100%;width:420px;height:auto;border:1px solid var(--line);
       border-radius:8px;margin:0 0 12px;}
  .eg{color:var(--muted);font-size:15px;margin:0 0 10px;}
  .q{margin:12px 0;}
  .passage .q{line-height:2.1;}
  .qn{display:inline-block;min-width:26px;font-weight:700;color:#4b5563;}
  .qt{}
  input.blank{font-family:inherit;font-size:16px;min-width:66px;width:auto;
       padding:6px 8px;border:1.5px solid #b6bcc6;border-radius:7px;margin:2px;
       vertical-align:middle;background:#fff;color:var(--ink);}
  input.blank:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(37,99,235,.15);}
  input.blank.wide{min-width:150px;}
  .lab{font-weight:700;color:#4b5563;font-size:14px;vertical-align:middle;}
  .choice,.mcq{display:inline-flex;flex-wrap:wrap;gap:6px;vertical-align:middle;margin:2px;}
  .mcq{display:flex;margin-top:8px;}
  .opt{font-family:inherit;font-size:16px;padding:9px 13px;min-height:42px;
       border:1.5px solid #b6bcc6;border-radius:8px;background:#fff;color:var(--ink);
       cursor:pointer;}
  .opt:active{transform:scale(.98);}
  .opt.sel{border-color:var(--accent);background:#eaf1fe;font-weight:600;}
  .gap{display:inline-block;min-width:54px;border-bottom:2px solid #9aa1ad;text-align:center;
       color:var(--muted);vertical-align:middle;}
  /* graded */
  input.blank.ok,.opt.ok{border-color:var(--ok);background:var(--okbg);}
  input.blank.bad,.opt.bad{border-color:var(--bad);background:var(--badbg);}
  .opt.correct{border-color:var(--ok);box-shadow:0 0 0 2px rgba(22,163,74,.25);}
  .mark{font-weight:800;margin-left:4px;}
  .mark.ok{color:var(--ok);} .mark.bad{color:var(--bad);}
  .review{margin-top:10px;display:none;}
  .review.show{display:block;}
  .rline{padding:6px 8px;border-radius:7px;margin:5px 0;font-size:15px;background:var(--box);}
  .rline.ok{border-left:4px solid var(--ok);}
  .rline.bad{border-left:4px solid var(--bad);}
  .rline .ic{font-weight:800;margin-right:5px;}
  .rline.ok .ic{color:var(--ok);} .rline.bad .ic{color:var(--bad);}
  .rline .cor{font-weight:700;}
  .rline .exp{color:#4b5563;}
  /* actions */
  .actions{margin:26px 0 10px;display:flex;flex-direction:column;gap:10px;}
  button.act{font-family:inherit;font-size:18px;font-weight:700;padding:15px;border:none;
       border-radius:10px;cursor:pointer;width:100%;}
  #submit{background:var(--accent);color:#fff;}
  #submit:disabled{background:#c3c8d1;cursor:not-allowed;}
  #reset{background:#fff;color:var(--accent);border:2px solid var(--accent);display:none;}
  .hint{font-size:13px;color:var(--muted);text-align:center;margin-top:2px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="row"><span class="ttl">Ôn tập giới từ</span><span class="prog" id="prog">Đã làm 0/149 câu</span></div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>

  <h1>Bài ôn tập giới từ tiếng Anh</h1>
  <p class="intro">Học sinh làm hết tất cả 149 câu rồi bấm “Nộp bài” để chấm điểm.</p>

  <div class="score" id="score">
    <div class="big" id="scoreBig"></div>
    <div class="sub" id="scoreSub"></div>
  </div>

  <div id="quiz"></div>

  <div class="actions">
    <button class="act" id="submit" disabled onclick="submitQuiz()">Nộp bài</button>
    <button class="act" id="reset" onclick="resetQuiz()">Làm lại</button>
    <div class="hint" id="hint">Nút “Nộp bài” sẽ bật khi học sinh đã điền đủ tất cả các câu.</div>
  </div>
</div>

<script>
const DATA = {"exercises": [{"id": 1, "label": "Bài 1", "instr": "Fill in the gaps with in, at or on.", "mode": "list", "example": "1  I have to be at the airport two hours before my flight leaves.", "items": [{"n": "2", "tpl": "Simon called while you were @@ the theatre.", "blanks": [{"k": "t", "ans": "at", "acc": ["at"], "exp": "at + nơi chốn công cộng/sự kiện (at the theatre = ở nhà hát).", "noprep": false}]}, {"n": "3", "tpl": "I went to visit Joanne, but she wasn't @@ home.", "blanks": [{"k": "t", "ans": "at", "acc": ["at"], "exp": "at home = ở nhà (không dùng 'in').", "noprep": false}]}, {"n": "4", "tpl": "I wouldn't like to be @@ sea in weather like this.", "blanks": [{"k": "t", "ans": "at", "acc": ["at"], "exp": "at sea = đang lênh đênh ngoài biển.", "noprep": false}]}, {"n": "5", "tpl": "There were so many dishes @@ the menu, I couldn't decide what to have.", "blanks": [{"k": "t", "ans": "on", "acc": ["on"], "exp": "on the menu = có trong thực đơn.", "noprep": false}]}, {"n": "6", "tpl": "I'd love to stay @@ a beautiful hotel near the sea.", "blanks": [{"k": "t", "ans": "at", "acc": ["at"], "exp": "at a hotel = lưu trú tại khách sạn.", "noprep": false}]}, {"n": "7", "tpl": "I got several autographs @@ the rock concert.", "blanks": [{"k": "t", "ans": "at", "acc": ["at"], "exp": "at + sự kiện (at the concert = tại buổi hòa nhạc).", "noprep": false}]}, {"n": "8", "tpl": "Jason is @@ hospital with a broken leg.", "blanks": [{"k": "t", "ans": "in", "acc": ["in"], "exp": "in hospital = đang nằm viện (Anh-Anh).", "noprep": false}]}, {"n": "9", "tpl": "Mum, can I stay @@ Sarah's house tonight, please?", "blanks": [{"k": "t", "ans": "at", "acc": ["at"], "exp": "at + nhà ai đó (at Sarah's house).", "noprep": false}]}, {"n": "10", "tpl": "The weather @@ Ireland is often cold and wet.", "blanks": [{"k": "t", "ans": "in", "acc": ["in"], "exp": "in + tên nước/vùng (in Ireland).", "noprep": false}]}, {"n": "11", "tpl": "My grandparents live @@ a farm and we often visit them there.", "blanks": [{"k": "t", "ans": "on", "acc": ["on"], "exp": "on a farm = ở nông trại (cụm cố định).", "noprep": false}]}, {"n": "12", "tpl": "She waited @@ the platform to see the train come in.", "blanks": [{"k": "t", "ans": "on", "acc": ["on"], "exp": "on the platform = trên sân ga.", "noprep": false}]}, {"n": "13", "tpl": "I get off the train @@ Baker Street and then walk to work.", "blanks": [{"k": "t", "ans": "at", "acc": ["at", "in"], "exp": "at Baker Street = tại ga Baker Street ('in' cũng được chấp nhận).", "noprep": false}]}, {"n": "14", "tpl": "It must be wonderful to live @@ an island, surrounded by water.", "blanks": [{"k": "t", "ans": "on", "acc": ["on"], "exp": "on an island = trên một hòn đảo.", "noprep": false}]}, {"n": "15", "tpl": "What did you learn @@ school today?", "blanks": [{"k": "t", "ans": "at", "acc": ["at"], "exp": "at school = ở trường (đang học).", "noprep": false}]}, {"n": "16", "tpl": "Suki is the girl sitting @@ my left.", "blanks": [{"k": "t", "ans": "on", "acc": ["on"], "exp": "on my left = ở phía bên trái của tôi.", "noprep": false}]}, {"n": "17", "tpl": "Tony is @@ the dentist's having a tooth taken out.", "blanks": [{"k": "t", "ans": "at", "acc": ["at"], "exp": "at the dentist's = ở phòng khám nha sĩ.", "noprep": false}]}, {"n": "18", "tpl": "After dinner, Grandad fell asleep @@ his armchair.", "blanks": [{"k": "t", "ans": "in", "acc": ["in"], "exp": "in an armchair = trong ghế bành (ghế có tay vịn).", "noprep": false}]}, {"n": "19", "tpl": "I lived @@ India until I was twelve years old.", "blanks": [{"k": "t", "ans": "in", "acc": ["in"], "exp": "in + tên nước (in India).", "noprep": false}]}]}, {"id": 2, "label": "Bài 2", "instr": "Fill in the gaps with at or in and one of the places from the list.", "mode": "list", "list": "the café,  the theatre,  the park,  the police station,  the garage,  the library", "example": "1  My car broke down on the way to work. I've left it at the garage to be repaired.", "items": [{"n": "2", "tpl": "I fell asleep @@ today as I haven't been sleeping so well lately.", "blanks": [{"k": "t", "ans": "in the library", "acc": ["in the library", "in library"], "exp": "in + không gian bên trong (thư viện).", "noprep": false}]}, {"n": "3", "tpl": "Jackie loves watching plays. She is @@ now, watching 'Romeo and Juliet'.", "blanks": [{"k": "t", "ans": "at the theatre", "acc": ["at the theatre", "at theatre", "at the theater"], "exp": "at + địa điểm gắn với hoạt động (đi xem kịch).", "noprep": false}]}, {"n": "4", "tpl": "Tony was buying a coffee when it started to rain. He waited @@ until the rain stopped.", "blanks": [{"k": "t", "ans": "in the café", "acc": ["in the café", "in the cafe", "in café", "in cafe"], "exp": "in + bên trong quán.", "noprep": false}]}, {"n": "5", "tpl": "The man who stole Jane's handbag has been found. He is being questioned @@.", "blanks": [{"k": "t", "ans": "at the police station", "acc": ["at the police station", "at police station"], "exp": "at + trụ sở/địa điểm chức năng.", "noprep": false}]}, {"n": "6", "tpl": "I hate it when people leave their rubbish @@; it looks so ugly.", "blanks": [{"k": "t", "ans": "in the park", "acc": ["in the park", "in park"], "exp": "in the park = trong công viên.", "noprep": false}]}]}, {"id": 3, "label": "Bài 3", "instr": "Look at the picture and fill in the gaps with a suitable preposition from the list.", "mode": "list", "img": "ex3", "list": "behind, among, down, round, between, up, in, under, towards, on", "example": "1  A boy is going down the slide.", "items": [{"n": "2", "tpl": "Two women are sitting @@ the bench. A girl is sitting @@ them.", "blanks": [{"k": "t", "ans": "on", "acc": ["on"], "exp": "on the bench = ngồi trên ghế băng.", "noprep": false}, {"k": "t", "ans": "between", "acc": ["between"], "exp": "between them = ở giữa hai người.", "noprep": false}]}, {"n": "3", "tpl": "Two children are going @@ on the roundabout.", "blanks": [{"k": "t", "ans": "round", "acc": ["round"], "exp": "go round = quay vòng vòng (trên vòng xoay).", "noprep": false}]}, {"n": "4", "tpl": "A cat is climbing @@ the tree.", "blanks": [{"k": "t", "ans": "up", "acc": ["up"], "exp": "climb up = trèo lên.", "noprep": false}]}, {"n": "5", "tpl": "There is a dog @@ the bench.", "blanks": [{"k": "t", "ans": "under", "acc": ["under"], "exp": "under the bench = dưới gầm ghế.", "noprep": false}]}, {"n": "6", "tpl": "There is a pond @@ the park.", "blanks": [{"k": "t", "ans": "in", "acc": ["in"], "exp": "in the park = trong công viên.", "noprep": false}]}, {"n": "7", "tpl": "There is a swan @@ the ducks.", "blanks": [{"k": "t", "ans": "among", "acc": ["among"], "exp": "among = ở giữa nhiều con (đàn vịt).", "noprep": false}]}, {"n": "8", "tpl": "A man and a woman are walking @@ the pond.", "blanks": [{"k": "t", "ans": "towards", "acc": ["towards"], "exp": "towards = hướng về phía cái ao.", "noprep": false}]}, {"n": "9", "tpl": "There is a man standing @@ the bench.", "blanks": [{"k": "t", "ans": "behind", "acc": ["behind"], "exp": "behind = phía sau ghế.", "noprep": false}]}, {"n": "10", "tpl": "There are some ducks @@ the pond.", "blanks": [{"k": "t", "ans": "on", "acc": ["on"], "exp": "on the pond = trên mặt ao.", "noprep": false}]}]}, {"id": 4, "label": "Bài 4", "instr": "Underline the correct preposition.", "mode": "list", "example": "1  The children climbed over the wall to escape from the angry gardener.", "items": [{"n": "2", "tpl": "She walked quickly @@ the shops without looking in the windows.", "blanks": [{"k": "c", "opts": ["past", "along"], "ans": "past", "exp": "walk past = đi ngang qua."}]}, {"n": "3", "tpl": "The current is very strong. It would be dangerous to swim @@ this river.", "blanks": [{"k": "c", "opts": ["through", "across"], "ans": "across", "exp": "swim across = bơi ngang qua (bờ này sang bờ kia)."}]}, {"n": "4", "tpl": "She got dressed quickly and ran @@ the stairs to the kitchen.", "blanks": [{"k": "c", "opts": ["up", "down"], "ans": "down", "exp": "run down the stairs = chạy xuống cầu thang."}]}, {"n": "5", "tpl": "Fiona is going to come to the party @@ her car.", "blanks": [{"k": "c", "opts": ["by", "in"], "ans": "in", "exp": "in her car = đi bằng xe của cô ấy."}]}, {"n": "6", "tpl": "I saw a man walking @@ me smiling, but I didn't recognise him.", "blanks": [{"k": "c", "opts": ["from", "towards"], "ans": "towards", "exp": "walk towards me = đi về phía tôi."}]}, {"n": "7", "tpl": "We tried to push our way @@ the crowds to see our favourite singer.", "blanks": [{"k": "c", "opts": ["through", "towards"], "ans": "through", "exp": "push through the crowd = chen qua đám đông."}]}, {"n": "8", "tpl": "There was no way to cross the lake, so we had to walk @@ it.", "blanks": [{"k": "c", "opts": ["through", "round"], "ans": "round", "exp": "walk round the lake = đi vòng quanh hồ."}]}, {"n": "9", "tpl": "The boy got @@ bed and went to the window.", "blanks": [{"k": "c", "opts": ["over", "out of"], "ans": "out of", "exp": "get out of bed = ra khỏi giường."}]}, {"n": "10", "tpl": "I put the bags @@ the table, then I put the shopping away.", "blanks": [{"k": "c", "opts": ["onto", "into"], "ans": "onto", "exp": "put onto the table = đặt lên trên mặt bàn."}]}, {"n": "11", "tpl": "You will see the post office on your right when you go @@ the corner.", "blanks": [{"k": "c", "opts": ["through", "round"], "ans": "round", "exp": "go round the corner = đi vòng qua góc phố."}]}, {"n": "12", "tpl": "She looked @@ her crystal ball and told the girl her fortune.", "blanks": [{"k": "c", "opts": ["along", "into"], "ans": "into", "exp": "look into = nhìn vào bên trong (quả cầu)."}]}]}, {"id": 5, "label": "Bài 5", "instr": "Fill in the gaps with the correct preposition.", "mode": "list", "example": "1  There is a man standing at the entrance to the museum.", "items": [{"n": "2", "tpl": "There was a note @@ the top of the page I was reading which I couldn't understand.", "blanks": [{"k": "t", "ans": "at", "acc": ["at"], "exp": "at the top of const TOTAL = DATA.total;

function norm(s){
  return (s==null?'':String(s)).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[\u2018\u2019'`\u00b4]/g,'')
    .replace(/[^a-z0-9 ]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

let BLANKS = {};   // gid -> {spec, exId, label}
let SEL = {};      // gid -> value (choice/mcq)
let submitted = false;
let gc = 0;
function newGid(){return 'b'+(++gc);}

function textInputHtml(gid, wide, ph){
  return '<input class="blank'+(wide?' wide':'')+'" data-gid="'+gid+'" type="text" '+
    'autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"'+
    (ph?(' placeholder="'+esc(ph)+'"'):'')+' oninput="onChange()">';
}
function choiceHtml(gid, opts){
  return '<span class="choice" data-gid="'+gid+'">'+opts.map(function(o){
    return '<button type="button" class="opt" data-val="'+esc(o)+'" onclick="pick(\''+gid+'\',this)">'+esc(o)+'</button>';
  }).join('')+'</span>';
}
function mcqBlockHtml(gid, opts){
  return '<div class="mcq" data-gid="'+gid+'">'+opts.map(function(p){
    return '<button type="button" class="opt" data-val="'+esc(p[0])+'" onclick="pick(\''+gid+'\',this)"><b>'+esc(p[0])+'</b> '+esc(p[1])+'</button>';
  }).join('')+'</div>';
}

// render one blank spec -> {inline, after}. Registers gid.
function renderBlank(spec, exId, label, phForNoprep){
  const gid = newGid();
  BLANKS[gid] = {spec:spec, exId:exId, label:label};
  if(spec.k==='t'){
    const wide = spec.ans && spec.ans.length>7;
    const ph = (spec.noprep && phForNoprep)? '–' : '';
    return {inline:textInputHtml(gid, wide, ph), after:''};
  }else if(spec.k==='c'){
    return {inline:choiceHtml(gid, spec.opts), after:''};
  }else{ // m
    return {inline:'<span class="gap" data-gid="'+gid+'">_____</span>', after:mcqBlockHtml(gid, spec.opts)};
  }
}

function buildExercise(ex){
  let h = '<div class="ex'+(ex.mode==='passage'?' passage':'')+'" id="ex'+ex.id+'">';
  h += '<h2><span class="num">'+ex.id+'</span>'+esc(ex.label)+'</h2>';
  h += '<p class="instr">'+esc(ex.instr)+'</p>';
  if(ex.note) h += '<p class="note">'+esc(ex.note)+'</p>';
  if(ex.list) h += '<div class="list"><b>Từ gợi ý:</b> '+esc(ex.list)+'</div>';
  if(ex.img && IMG[ex.img]) h += '<img class="pic" alt="Tranh bài '+ex.id+'" src="data:image/jpeg;base64,'+IMG[ex.img]+'">';
  if(ex.example) h += '<p class="eg">Ví dụ — '+esc(ex.example)+'</p>';

  const phNo = (ex.id===12);
  if(ex.mode==='list'){
    ex.items.forEach(function(it){
      const parts = it.tpl.split('@@');
      let line = '<span class="qn">'+esc(it.n)+'.</span> <span class="qt">';
      let after = '';
      for(let i=0;i<parts.length;i++){
        line += parts[i];
        if(i < it.blanks.length){
          const spec = it.blanks[i];
          const lab = it.blanks.length>1 ? (it.n+['a','b','c'][i]) : it.n;
          const r = renderBlank(spec, ex.id, lab, phNo);
          line += r.inline; after += r.after;
        }
      }
      line += '</span>';
      h += '<div class="q">'+line+after+'</div>';
    });
  }else{
    ex.parts.forEach(function(pt){
      let after='';
      let body = pt.tpl.replace(/@([A-Za-z]?\d+)@/g, function(mm, tok){
        const spec = ex.blanks[tok];
        const r = renderBlank(spec, ex.id, tok, phNo);
        after += r.after;
        return r.inline;
      });
      let lbl = pt.label? ('<span class="qn">'+esc(pt.label)+'</span> '):'';
      h += '<div class="q">'+lbl+'<span class="qt">'+body+'</span>'+after+'</div>';
    });
  }
  h += '<div class="review" id="rev'+ex.id+'"></div>';
  h += '</div>';
  return h;
}

function render(){
  let h='';
  DATA.exercises.forEach(function(ex){ h += buildExercise(ex); });
  document.getElementById('quiz').innerHTML = h;
  updateProgress();
}

function pick(gid, btn){
  if(submitted) return;
  SEL[gid] = btn.dataset.val;
  const grp = btn.parentNode;
  grp.querySelectorAll('.opt').forEach(function(b){b.classList.remove('sel');});
  btn.classList.add('sel');
  updateProgress();
}
function onChange(){ updateProgress(); }

function isAnswered(gid){
  const b = BLANKS[gid]; const spec=b.spec;
  if(spec.k==='t'){
    const el = document.querySelector('input[data-gid="'+gid+'"]');
    return el && el.value.trim()!=='';
  }else{
    return SEL[gid]!==undefined;
  }
}
function updateProgress(){
  let done=0;
  Object.keys(BLANKS).forEach(function(gid){ if(isAnswered(gid)) done++; });
  document.getElementById('prog').textContent = 'Đã làm '+done+'/'+TOTAL+' câu';
  document.getElementById('fill').style.width = (TOTAL? (done/TOTAL*100):0)+'%';
  const btn = document.getElementById('submit');
  if(!submitted){
    btn.disabled = (done<TOTAL);
    document.getElementById('hint').textContent = (done<TOTAL)
      ? ('Còn '+(TOTAL-done)+' câu chưa làm. Nút “Nộp bài” sẽ bật khi làm đủ.')
      : 'Đã đủ! Học sinh có thể bấm “Nộp bài”.';
  }
}

function gradeText(spec, val){
  const n = norm(val);
  if(spec.noprep){
    if(n===''|| ['no','none','nothing','x','khong','ko','nil','nope','k'].indexOf(n)>=0) return true;
  }
  return spec.acc.some(function(a){return norm(a)===n;});
}
function correctDisplay(spec){
  if(spec.k==='m'){
    let w=''; spec.opts.forEach(function(p){ if(p[0]===spec.ans) w=p[1]; });
    return spec.ans+' ('+w+')';
  }
  return spec.ans;
}
function studentDisplay(gid, spec){
  if(spec.k==='t'){
    const el=document.querySelector('input[data-gid="'+gid+'"]');
    const v=el?el.value.trim():'';
    return v===''? '(bỏ trống)' : v;
  }else if(spec.k==='c'){
    return SEL[gid]!==undefined? SEL[gid] : '(chưa chọn)';
  }else{
    const L=SEL[gid];
    if(L===undefined) return '(chưa chọn)';
    let w=''; spec.opts.forEach(function(p){ if(p[0]===L) w=p[1]; });
    return L+' ('+w+')';
  }
}

function submitQuiz(){
  if(submitted) return;
  let done=0; Object.keys(BLANKS).forEach(function(g){if(isAnswered(g))done++;});
  if(done<TOTAL) return;
  submitted=true;
  let correct=0;
  const rev={}; DATA.exercises.forEach(function(e){rev[e.id]=[];});

  Object.keys(BLANKS).forEach(function(gid){
    const b=BLANKS[gid], spec=b.spec;
    let ok=false;
    if(spec.k==='t'){
      const el=document.querySelector('input[data-gid="'+gid+'"]');
      ok=gradeText(spec, el?el.value:'');
      if(el){ el.disabled=true; el.classList.add(ok?'ok':'bad'); }
    }else{
      const chosen = SEL[gid];
      ok = norm(chosen)===norm(spec.ans);
      const grp=document.querySelector('[data-gid="'+gid+'"]');
      if(grp){
        grp.querySelectorAll('.opt').forEach(function(bt){
          const val=bt.dataset.val;
          if(norm(val)===norm(spec.ans)) bt.classList.add('correct');
          if(val===chosen) bt.classList.add(ok?'ok':'bad');
          bt.disabled=true;
        });
      }
    }
    if(ok) correct++;
    rev[b.exId].push({label:b.label, ok:ok, stu:studentDisplay(gid,spec), cor:correctDisplay(spec), exp:spec.exp});
  });

  DATA.exercises.forEach(function(e){
    const box=document.getElementById('rev'+e.id);
    let h='';
    rev[e.id].forEach(function(r){
      h+='<div class="rline '+(r.ok?'ok':'bad')+'"><span class="ic">'+(r.ok?'✓':'✗')+'</span>'+
         '<b>Câu '+esc(r.label)+':</b> '+esc(r.stu)+' → Đáp án: <span class="cor">'+esc(r.cor)+'</span>'+
         (r.exp? ' <span class="exp">— '+esc(r.exp)+'</span>':'')+'</div>';
    });
    box.innerHTML=h; box.classList.add('show');
  });

  const score = Math.round(correct/TOTAL*10*10)/10;
  document.getElementById('scoreBig').textContent = 'Điểm: '+score.toFixed(1)+'/10';
  document.getElementById('scoreSub').textContent = 'Đúng '+correct+'/'+TOTAL+' câu.';
  document.getElementById('score').classList.add('show');
  document.getElementById('submit').style.display='none';
  document.getElementById('reset').style.display='block';
  document.getElementById('hint').style.display='none';
  document.getElementById('prog').textContent='Đã nộp bài';
  window.scrollTo({top:0,behavior:'smooth'});
}

function resetQuiz(){
  submitted=false; SEL={};
  document.querySelectorAll('input.blank').forEach(function(el){
    el.value=''; el.disabled=false; el.classList.remove('ok','bad');
  });
  document.querySelectorAll('.opt').forEach(function(b){
    b.disabled=false; b.classList.remove('sel','ok','bad','correct');
  });
  document.querySelectorAll('.review').forEach(function(r){r.classList.remove('show'); r.innerHTML='';});
  document.getElementById('score').classList.remove('show');
  document.getElementById('submit').style.display='block';
  document.getElementById('reset').style.display='none';
  document.getElementById('hint').style.display='block';
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
}

render();
</script>
</body>
</html>
