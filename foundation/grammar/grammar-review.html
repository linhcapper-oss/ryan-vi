 remembered"]}]},{"key":"P2","section":"CHƯƠNG II — 2. Bài tập chia động từ trong ngoặc","title":"2. Bài tập chia động từ trong ngoặc (Verb Conjugation)","intro":"","kind":"items","lines":["Câu 1: She decided [[1]] abroad after she graduated from high school.","Câu 2: The ancient temple [[2]] by a powerful earthquake in 1995.","Câu 3: If we [[3]] your phone number yesterday, we would have invited you.","Câu 4: I need to go to the salon to have my hair [[4]] this afternoon.","Câu 5: We are really looking forward to [[5]] the new manager next Monday.","Câu 6: If I [[6]] you, I would apply for that job immediately.","Câu 7: All final assignments must [[7]] and submitted before midnight.","Câu 8: My brother said that he [[8]] London the following week. (Direct sentence: 'I will visit...')","Câu 9: On the way home, he stopped [[9]] some milk because they had run out of it.","Câu 10: [[10]] a new language requires a lot of patience and daily practice.","Câu 11: Unless she [[11]], she will miss the final train of the day.","Câu 12: A lot of new trees [[12]] in the central park since last month.","Câu 13: I don't have a smartphone. I wish I [[13]] one right now.","Câu 14: You should avoid [[14]] loud noises while people are working.","Câu 15: If he [[15]] his driving test yesterday, he would be very happy today."],"qs":[{"n":1,"type":"fill","cue":"study","ans":"to study","exp":"Động từ decide (quyết định) bắt buộc đi với động từ nguyên mẫu có \"to\" (decide + to V) [sb].","acc":["to study"]},{"n":2,"type":"fill","cue":"destroy","ans":"was destroyed","exp":"Câu bị động ở thì Quá khứ đơn (was/were + V3) do có mốc thời gian xác định trong quá khứ là \"in 1995\". Chủ ngữ \"The ancient temple\" là danh từ số ít.","acc":["was destroyed"]},{"n":3,"type":"fill","cue":"know","ans":"had known","exp":"Mệnh đề điều kiện If của Câu điều kiện loại 3 (giả định trái ngược với quá khứ \"yesterday\") chia ở thì Quá khứ hoàn thành (had + V3).","acc":["had known"]},{"n":4,"type":"fill","cue":"cut","ans":"cut","exp":"Cấu trúc truyền khiến bị động: have + Object (my hair) + V3 (cut). (Động từ cut có 3 cột giống nhau: cut - cut - cut).","acc":["cut"]},{"n":5,"type":"fill","cue":"meet","ans":"meeting","exp":"Cụm từ look forward to có \"to\" đóng vai trò là giới từ, do đó động từ theo sau bắt buộc phải ở dạng V-ing [sb].","acc":["meeting"]},{"n":6,"type":"fill","cue":"be","ans":"were","exp":"Câu điều kiện loại 2 (giả định không có thật ở hiện tại). Động từ to be trong vế If luôn được chia là were cho tất cả các ngôi [sb].","acc":["were"]},{"n":7,"type":"fill","cue":"finish","ans":"be finished","exp":"Cấu trúc bị động với động từ khuyết thiếu (must + be + V3).","acc":["be finished"]},{"n":8,"type":"fill","cue":"visit","ans":"would visit","exp":"Tường thuật lời nói gián tiếp ở quá khứ [sb]. Ta lùi trợ động từ tương lai \"will\" thành would [sb].","acc":["would visit"]},{"n":9,"type":"fill","cue":"buy","ans":"to buy","exp":"Sử dụng stop + to V để chỉ mục đích: dừng việc đang làm lại (dừng đi bộ/đi xe) để thực hiện một hành động khác (mua sữa).","acc":["to buy"]},{"n":10,"type":"fill","cue":"Learn","ans":"Learning","exp":"Danh động từ (Gerund) đứng đầu câu làm chủ ngữ chỉ một hoạt động, động từ chính theo sau chia số ít (requires) [sb].","acc":["Learning"]},{"n":11,"type":"fill","cue":"hurry","ans":"hurries","exp":"Câu điều kiện loại 1 chỉ một khả năng ở tương lai. Mệnh đề sau unless chia ở hiện tại đơn khẳng định, chủ ngữ \"she\" số ít nên hurry chuyển thành hurries.","acc":["hurries"]},{"n":12,"type":"fill","cue":"plant","ans":"have been planted","exp":"Câu bị động ở thì Hiện tại hoàn thành (have/has been + V3) do có dấu hiệu nhận biết \"since last month\". Chủ ngữ \"A lot of new trees\" là số nhiều.","acc":["have been planted"]},{"n":13,"type":"fill","cue":"have","ans":"had","exp":"Cấu trúc ước Wish trái ngược với thực tế ở hiện tại (thực tế hiện tại không có điện thoại) => lùi về thì Quá khứ đơn.","acc":["had"]},{"n":14,"type":"fill","cue":"make","ans":"making","exp":"Động từ avoid (tránh) bắt buộc đi kèm danh động từ (avoid + V-ing) [sb].","acc":["making"]},{"n":15,"type":"fill","cue":"not fail","ans":"had not failed","exp":"Câu điều kiện hỗn hợp (Mixed Conditional 3 - 2). Giả thuyết trái ngược quá khứ (\"yesterday\") chia ở Quá khứ hoàn thành (had not failed), kết quả trái ngược hiện tại (\"today\") dùng would be.","acc":["had not failed","hadn't failed"]}]},{"key":"P3","section":"CHƯƠNG II — 3. Bài tập viết lại câu","title":"3. Bài tập viết lại câu (Sentence Transformation)","intro":"","kind":"write","lines":[],"qs":[{"n":1,"type":"write","src":"They are building a new bridge over the river.","hint":"A new bridge...","note":"","prefix":"A new bridge","ans":"A new bridge is being built over the river (by them).","exp":"Chuyển câu chủ động ở thì Hiện tại tiếp diễn sang bị động: S + am/is/are + being + V3. Tân ngữ \"by them\" có thể lược bỏ.","acc":["A new bridge is being built over the river","A new bridge is being built over the river by them"]},{"n":2,"type":"write","src":"'I wrote a letter to my pen pal yesterday,' said Linda.","hint":"Linda said that...","note":"","prefix":"Linda said that","ans":"Linda said that she had written a letter to her pen pal the day before / the previous day.","exp":"Lùi thì Quá khứ đơn (wrote) thành Quá khứ hoàn thành (had written) [sb]. Đổi đại từ và tính từ sở hữu (I -> she, my -> her) [sb]. Đổi trạng từ chỉ thời gian (yesterday -> the day before/the previous day).","acc":["Linda said she had written a letter to her pen pal the day before","Linda said she had written a letter to her pen pal the previous day","Linda said that she had written a letter to her pen pal the day before","Linda said that she had written a letter to her pen pal the previous day"]},{"n":3,"type":"write","src":"'Where does your uncle live?' asked Peter.","hint":"Peter asked me...","note":"","prefix":"Peter asked me","ans":"Peter asked me where my uncle lived.","exp":"Tường thuật câu hỏi Wh-. Bỏ trợ động từ đảo ngữ \"does\", đưa về trật tự câu trần thuật (Chủ ngữ đứng trước động từ) và lùi thì hiện tại đơn (live) thành quá khứ đơn (lived) [sb].","acc":["Peter asked me where my uncle lived"]},{"n":4,"type":"write","src":"'Don't open the window,' the teacher said to the students.","hint":"The teacher told...","note":"","prefix":"The teacher told","ans":"The teacher told the students not to open the window.","exp":"Cấu trúc tường thuật câu mệnh lệnh phủ định: tell + Object + not + to V [sb].","acc":["The teacher told the students not to open the window"]},{"n":5,"type":"write","src":"My laptop is more expensive than yours.","hint":"Your laptop...","note":"Sử dụng cấu trúc so sánh bằng với 'not as... as'","prefix":"Your laptop","ans":"Your laptop is not as expensive as mine / my laptop.","exp":"Chuyển đổi từ so sánh hơn sang so sánh không bằng: \"Máy của tôi đắt hơn máy của bạn\" => \"Máy của bạn không đắt bằng máy của tôi\".","acc":["Your laptop is not as expensive as mine","Your laptop is not as expensive as my laptop"]},{"n":6,"type":"write","src":"No one in my class is as tall as Mike.","hint":"Mike is...","note":"Viết lại bằng so sánh nhất","prefix":"Mike is","ans":"Mike is the tallest student in my class.","exp":"Chuyển đổi từ so sánh bằng phủ định/không bằng sang so sánh nhất của tính từ ngắn \"tall\" (the tallest).","acc":["Mike is the tallest student in my class","Mike is the tallest in my class","Mike is the tallest student in the class"]},{"n":7,"type":"write","src":"If you don't study hard, you will fail the final exam.","hint":"Unless...","note":"","prefix":"Unless","ans":"Unless you study hard, you will fail the final exam.","exp":"Thay thế cụm \"If... not\" bằng Unless. Động từ sau Unless đổi về thể khẳng định (study).","acc":["Unless you study hard, you will fail the final exam"]},{"n":8,"type":"write","src":"I met a woman. She can speak five different languages.","hint":"I met...","note":"Sử dụng Mệnh đề quan hệ xác định với 'Who'","prefix":"I met","ans":"I met a woman who / that can speak five different languages.","exp":"Sử dụng đại từ quan hệ who hoặc that làm chủ ngữ thay thế cho \"She\" để nối thành mệnh đề quan hệ xác định (không dùng dấu phẩy) [sb].","acc":["I met a woman who can speak five different languages","I met a woman that can speak five different languages"]},{"n":9,"type":"write","src":"Paris is the capital of France. It is famous for the Eiffel Tower.","hint":"Paris, ...","note":"Sử dụng Mệnh đề quan hệ không xác định với 'Which'","prefix":"Paris,","ans":"Paris, which is the capital of France, is famous for the Eiffel Tower.","exp":"Vì \"Paris\" là danh từ riêng đã xác định, ta bắt buộc phải dùng mệnh đề quan hệ không xác định (nằm giữa hai dấu phẩy) và sử dụng which, tuyệt đối không dùng that [sb].","acc":["Paris, which is the capital of France, is famous for the Eiffel Tower"]},{"n":10,"type":"write","src":"That is the boy. His father is a famous neurosurgeon.","hint":"That is the boy...","note":"Sử dụng 'Whose'","prefix":"That is the boy","ans":"That is the boy whose father is a famous neurosurgeon.","exp":"Sử dụng đại từ chỉ sở hữu whose thay thế cho tính từ sở hữu \"His\" đứng trước danh từ \"father\" [sb].","acc":["That is the boy whose father is a famous neurosurgeon"]},{"n":11,"type":"write","src":"A professional mechanic repaired my car yesterday.","hint":"I had...","note":"Sử dụng Thể truyền khiến bị động 'Have'","prefix":"I had","ans":"I had my car repaired by a professional mechanic yesterday.","exp":"Cấu trúc truyền khiến bị động: S + had + Object (vật) + V3 (repaired) + by + agent.","acc":["I had my car repaired by a professional mechanic yesterday","I had my car repaired yesterday by a professional mechanic","I had my car repaired yesterday"]},{"n":12,"type":"write","src":"It rained heavily, so we cancelled the football match.","hint":"Because...","note":"Sử dụng 'Because' chỉ nguyên nhân","prefix":"Because","ans":"Because it rained heavily, we cancelled the football match. (Hoặc: We cancelled the football match because it rained heavily.)","exp":"Chuyển từ câu ghép dùng liên từ kết hợp \"so\" sang câu phức dùng liên từ phụ thuộc chỉ nguyên nhân Because [sb]. Lưu ý dấu phẩy nếu đặt mệnh đề Because ở đầu câu [sb].","acc":["Because it rained heavily, we cancelled the football match","Because it rained heavily, we canceled the football match","We cancelled the football match because it rained heavily","We canceled the football match because it rained heavily"]},{"n":13,"type":"write","src":"She didn't run fast, so she missed the school bus yesterday.","hint":"If she...","note":"","prefix":"If she","ans":"If she had run fast, she wouldn't have missed the school bus yesterday.","exp":"Sự việc đã xảy ra và kết thúc trong quá khứ (không chạy nhanh -> lỡ xe bus). Ta dùng câu điều kiện loại 3 để giả định điều ngược lại: If + S + had + V3, S + would + have + V3.","acc":["If she had run fast, she wouldn't have missed the school bus","If she had run fast, she wouldn't have missed the school bus yesterday"]},{"n":14,"type":"write","src":"I don't have enough money to buy this beautiful apartment.","hint":"I wish...","note":"","prefix":"I wish","ans":"I wish I had enough money to buy this beautiful apartment.","exp":"Câu ước trái với thực tế hiện tại (hiện tại không đủ tiền) => lùi về thì Quá khứ đơn (had).","acc":["I wish I had enough money to buy this beautiful apartment"]},{"n":15,"type":"write","src":"Our school has about 500 students.","hint":"There are...","note":"","prefix":"There are","ans":"There are about 500 students in our school.","exp":"Chuyển đổi linh hoạt giữa cấu trúc sở hữu \"has\" sang cấu trúc chỉ sự tồn tại There are đi với danh từ số nhiều \"500 students\".","acc":["There are about 500 students in our school","There are about 500 students in my school"]}]},{"key":"P4","section":"CHƯƠNG II — 4. Bài tập tìm và sửa lỗi sai","title":"4. Bài tập tìm và sửa lỗi sai (Error Correction)","intro":"","kind":"correct","lines":[],"qs":[{"n":1,"type":"correct","src":"There's many students waiting outside the classroom right now.","ans":"There’s => There are / There’re","exp":"Không dùng dạng viết tắt There’s (There is) với danh từ đếm được số nhiều là \"many students\".","acc":["There are","There’s => There are","There are many students waiting outside the classroom right now.","There’re","There’s => There’re","There're many students waiting outside the classroom right now."]},{"n":2,"type":"correct","src":"These is the most beautiful painting I have ever seen in my life.","ans":"These => This","exp":"Danh từ phía sau là \"the most beautiful painting\" (số ít) và động từ là \"is\", nên phải dùng đại từ chỉ định số ít là This.","acc":["This","These => This","This is the most beautiful painting I have ever seen in my life."]},{"n":3,"type":"correct","src":"The teacher gave us many useful advices for our upcoming exam.","ans":"many advices => some advice / a lot of advice","exp":"\"Advice\" (lời khuyên) là danh từ không đếm được. Nó không thể đi với lượng từ many và không có dạng số nhiều thêm -s.","acc":["some advice","many advices => some advice","a lot of advice","many advices => a lot of advice","much advice","many advices => much advice","useful advice","many advices => useful advice","advice","many advices => advice"]},{"n":4,"type":"correct","src":"She wants to study at an European university after she graduates.","ans":"an => a","exp":"Từ \"European\" bắt đầu bằng một phụ âm âm vị là /j/ (phiên âm là /ˌjʊə.rəˈpiː.ən/), không phải là một nguyên âm. Do đó ta phải dùng mạo từ a.","acc":["a","an => a","She wants to study at a European university after she graduates."]},{"n":5,"type":"correct","src":"My younger sister really enjoys to play computer games in her free time.","ans":"to play => playing","exp":"Động từ enjoy bắt buộc đi kèm danh động từ (enjoy + V-ing).","acc":["playing","to play => playing","My younger sister really enjoys playing computer games in her free time."]},{"n":6,"type":"correct","src":"You had better to lock all the doors before you go to bed.","ans":"to lock => lock","exp":"Cấu trúc had better (tốt nhất nên) đi trực tiếp với động từ nguyên mẫu không \"to\" (had better + V-bare).","acc":["lock","to lock => lock","You had better lock all the doors before you go to bed."]},{"n":7,"type":"correct","src":"The old bridge was break by the strong storm last night.","ans":"break => broken","exp":"Động từ trong câu bị động quá khứ đơn phải ở dạng quá khứ phân từ V3 (was/were + V3). Phân từ của break là broken (break - broke - broken).","acc":["broken","break => broken","The old bridge was broken by the strong storm last night."]},{"n":8,"type":"correct","src":"This is the talented chef which won the international cooking competition.","ans":"which => who / that","exp":"Đại từ quan hệ which chỉ dùng cho vật. Vì danh từ đứng trước là \"chef\" (đầu bếp - chỉ người) nên ta phải dùng who hoặc that.","acc":["who","which => who","This is the talented chef who won the international cooking competition.","that","which => that","This is the talented chef that won the international cooking competition."]},{"n":9,"type":"correct","src":"She looks much more happier than she did yesterday.","ans":"more happier => happier","exp":"Lỗi so sánh kép (double comparison). Vì \"happy\" là tính từ ngắn dạng đặc biệt (kết thúc bằng -y chuyển thành -ier), ta không dùng thêm từ more ở trước.","acc":["happier","more happier => happier","She looks much happier than she did yesterday."]},{"n":10,"type":"correct","src":"If I will see him at the meeting tomorrow, I will give him your letter.","ans":"will see => see","exp":"Trong câu điều kiện loại 1, mệnh đề điều kiện If luôn chia ở thì hiện tại đơn, không dùng trợ động từ tương lai will.","acc":["see","will see => see","If I see him at the meeting tomorrow, I will give him your letter."]},{"n":11,"type":"correct","src":"He said me that he was going to buy a new car the following week.","ans":"said me => told me / said to me","exp":"Động từ say không đi kèm trực tiếp với tân ngữ chỉ người nhận tin (said me là sai). Ta phải dùng told me hoặc said to me.","acc":["told me","said me => told me","He told me that he was going to buy a new car the following week.","said to me","said me => said to me","He said to me that he was going to buy a new car the following week."]},{"n":12,"type":"correct","src":"I went to the service center to have my phone repair yesterday afternoon.","ans":"repair => repaired","exp":"Cấu trúc truyền khiến bị động: have + Object (my phone) + V3 (repaired).","acc":["repaired","repair => repaired","I went to the service center to have my phone repaired yesterday afternoon."]},{"n":13,"type":"correct","src":"London that is the capital of the UK is very famous for its historical buildings.","ans":"that => which","exp":"Vì \"London\" là danh từ riêng đã xác định, mệnh đề quan hệ này là mệnh đề không xác định (có dấu phẩy). Quy tắc bắt buộc là không dùng \"that\" sau dấu phẩy.","acc":["which","that => which","London which is the capital of the UK is very famous for its historical buildings."]},{"n":14,"type":"correct","src":"She asked me where did I live because she wanted to send me a postcard.","ans":"did I live => I lived","exp":"Khi chuyển câu hỏi trực tiếp sang gián tiếp (Indirect Question), ta phải bỏ trợ động từ hỏi did, đưa về trật tự câu trần thuật (S + V) và lùi thì về quá khứ đơn (lived).","acc":["I lived","did I live => I lived","She asked me where I lived because she wanted to send me a postcard."]},{"n":15,"type":"correct","src":"Because he was very tired, so he decided to go to bed early last night.","ans":"so => Ø (bỏ \"so\")","exp":"Lỗi lặp liên từ. Trong một câu phức tiếng Anh, nếu đã dùng liên từ phụ thuộc chỉ nguyên nhân Because ở đầu, ta không dùng liên từ kết hợp so ở vế sau nữa.","acc":["Ø","so => Ø","bỏ so","so => bỏ so","bỏ từ so","so => bỏ từ so","xóa so","so => xóa so","bỏ","so => bỏ","bỏ chữ so","so => bỏ chữ so","Because he was very tired, he decided to go to bed early last night.","He decided to go to bed early last night."]}]},{"key":"P5","section":"CHƯƠNG II — 5. Bài tập dịch câu Việt - Anh","title":"5. Bài tập dịch câu Việt - Anh (Translation)","intro":"","kind":"write","lines":[],"qs":[{"n":1,"type":"write","src":"Có một ít sữa trong tủ lạnh, nhưng không có quả trứng nào cả.","hint":"","note":"","prefix":"","ans":"There is a little milk in the fridge, but there aren't any eggs.","exp":"Dùng There is + a little cho danh từ không đếm được \"milk\". Dùng there aren't + any cho câu phủ định đi với danh từ số nhiều \"eggs\".","acc":["There is a little milk in the fridge, but there aren't any eggs","There is a little milk in the fridge, but there are no eggs"]},{"n":2,"type":"write","src":"Những bông hoa này thì đẹp hơn những bông hoa ở đằng kia.","hint":"","note":"","prefix":"","ans":"These flowers are more beautiful than those flowers over there.","exp":"Dùng từ chỉ định số nhiều ở gần (these flowers) và ở xa (those flowers over there), kết hợp cấu trúc so sánh hơn của tính từ dài \"beautiful\".","acc":["These flowers are more beautiful than those flowers over there","These flowers are more beautiful than those over there","These flowers are more beautiful than the flowers over there","These flowers are more beautiful than those ones over there","These flowers are more beautiful than those flowers there"]},{"n":3,"type":"write","src":"Học tiếng Anh mỗi ngày là cách tốt nhất để cải thiện kỹ năng giao tiếp của bạn.","hint":"","note":"","prefix":"","ans":"Learning English every day is the best way to improve your communication skills.","exp":"Dùng danh động từ đứng đầu làm chủ ngữ (Learning), so sánh nhất của tính từ bất quy tắc good (the best) và động từ nguyên mẫu chỉ mục đích/bổ nghĩa danh từ (to improve).","acc":["Learning English every day is the best way to improve your communication skills"]},{"n":4,"type":"write","src":"Bạn tốt nhất là nên hoàn thành báo cáo này trước khi giám đốc đến.","hint":"","note":"","prefix":"","ans":"You had better finish this report before the director arrives.","exp":"Dùng cấu trúc lời khuyên mạnh mẽ had better + V-bare và mệnh đề thời gian chia ở hiện tại đơn (before the director arrives).","acc":["You had better finish this report before the director arrives","You'd better finish this report before the director arrives"]},{"n":5,"type":"write","src":"Ngôi trường cổ kính này đã được xây dựng bởi người Pháp vào năm 1920.","hint":"","note":"","prefix":"","ans":"This ancient school was built by the French in 1920.","exp":"Thì quá khứ đơn bị động chỉ hành động đã xảy ra và kết thúc rõ ràng trong quá khứ (was built). Dùng by + Agent chỉ tác nhân \"by the French\".","acc":["This ancient school was built by the French in 1920"]},{"n":6,"type":"write","src":"Hôm qua, tôi đã đi cắt tóc và rửa xe.","hint":"","note":"Sử dụng cấu trúc truyền khiến bị động 'Have/Get'","prefix":"","ans":"Yesterday, I had my hair cut and get/got my car washed.","exp":"Sử dụng thể truyền khiến bị động: have/get + Object + V3. Phân từ V3 của cut là cut, của wash là washed.","acc":["Yesterday, I had my hair cut and got my car washed","Yesterday, I had my hair cut and had my car washed","Yesterday, I had my hair cut and get my car washed","Yesterday, I got my hair cut and got my car washed","Yesterday, I had my hair cut and I got my car washed","I had my hair cut and got my car washed yesterday"]},{"n":7,"type":"write","src":"Nếu tôi là bạn, tôi sẽ không mua chiếc máy tính xách tay đắt đỏ đó.","hint":"","note":"","prefix":"","ans":"If I were you, I wouldn't buy that expensive laptop.","exp":"Câu điều kiện loại 2 (giả định trái với hiện thực và đưa ra lời khuyên). Dùng động từ to be là were cho ngôi I và vế sau dùng wouldn't + V-bare.","acc":["If I were you, I wouldn't buy that expensive laptop"]},{"n":8,"type":"write","src":"Nếu hôm qua thời tiết đẹp hơn, chúng tôi đã đi dã ngoại ở công viên rồi.","hint":"","note":"","prefix":"","ans":"If the weather had been better yesterday, we would h ty last night is my boss","The man you met at the party last night is my boss"]},{"n":12,"type":"write","src":"Thành phố Hồ Chí Minh, nơi có hơn 9 triệu dân, là một thành phố rất năng động.","hint":"","note":"","prefix":"","ans":"Ho Chi Minh City, which has over 9 million people, is a very dynamic city.","exp":"Mệnh đề quan hệ không xác định (bổ sung thông tin cho danh từ riêng). Bắt buộc dùng dấu phẩy và đại từ which (không dùng that).","acc":["Ho Chi Minh City, which has over 9 million people, is a very dynamic city"]},{"n":13,"type":"write","src":"Đây là cuốn sách thú vị nhất mà tôi từng đọc.","hint":"","note":"","prefix":"","ans":"This is the most interesting book that I have ever read.","exp":"Cấu trúc so sánh nhất với tính từ dài (the most interesting) đi kèm mệnh đề quan hệ bổ nghĩa ở thì hiện tại hoàn thành (that I have ever read).","acc":["This is the most interesting book that I have ever read","This is the most interesting book which I have ever read","This is the most interesting book I have ever read"]},{"n":14,"type":"write","src":"Mặc dù trời mưa rất to, họ vẫn quyết định đi bộ đường dài trong rừng.","hint":"","note":"","prefix":"","ans":"Although it rained heavily, they decided to go hiking in the forest.","exp":"Câu phức chỉ sự nhượng bộ với liên từ Although đứng đầu câu (có dấu phẩy ngăn cách). Động từ decide đi với to go, cấu trúc giải trí go hiking.","acc":["Although it rained heavily, they decided to go hiking in the forest","Even though it rained heavily, they decided to go hiking in the forest","Though it rained heavily, they decided to go hiking in the forest"]},{"n":15,"type":"write","src":"Bạn không cần phải trả tiền cho bữa ăn này, nhưng bạn không được phép mang đồ ăn bên ngoài vào đây.","hint":"","note":"","prefix":"","ans":"You don't have to pay for this meal, but you mustn't smoke here.","exp":"Phân biệt động từ khuyết thiếu: don't have to (không cần thiết) và mustn't (bị cấm đoán).","acc":["You don't have to pay for this meal, but you mustn't smoke here","You don't have to pay for this meal, but you mustn't bring outside food here","You don't have to pay for this meal, but you mustn't bring outside food in here","You don't have to pay for this meal, but you mustn't bring food from outside here","You don't have to pay for this meal, but you mustn't bring your own food here","You don't have to pay for this meal, but you can't bring outside food here"]}]}];

/* ---------- chuẩn hoá để chấm bài ---------- */
var CONTR = [
 ["i'm","i am"],["i've","i have"],["i'll","i will"],["i'd","i would"],
 ["you're","you are"],["you've","you have"],["you'll","you will"],
 ["we're","we are"],["we've","we have"],["we'll","we will"],["we'd","we would"],
 ["they're","they are"],["they've","they have"],["they'll","they will"],["they'd","they would"],
 ["he's","he is"],["she's","she is"],["it's","it is"],["that's","that is"],
 ["there's","there is"],["there're","there are"],["here's","here is"],
 ["what's","what is"],["who's","who is"],["let's","let us"],
 ["he'll","he will"],["she'll","she will"],["it'll","it will"],
 ["isn't","is not"],["aren't","are not"],["wasn't","was not"],["weren't","were not"],
 ["don't","do not"],["doesn't","does not"],["didn't","did not"],
 ["can't","can not"],["cannot","can not"],["couldn't","could not"],
 ["won't","will not"],["wouldn't","would not"],["shouldn't","should not"],
 ["mustn't","must not"],["mightn't","might not"],
 ["haven't","have not"],["hasn't","has not"],["hadn't","had not"]
];
function norm(s){
  s = (s==null?'':String(s)).toLowerCase();
  s = s.replace(/[‘’ʼ′]/g,"'").replace(/[“”]/g,'"');
  s = s.replace(/\s*(=>|->|→)\s*/g,' ');
  for(var i=0;i<CONTR.length;i++){
    s = s.replace(new RegExp('\\b'+CONTR[i][0].replace("'","'")+'(?![a-z])','g'), CONTR[i][1]);
  }
  s = s.replace(/[.,!?;:"'()\[\]\/\\–—\-_*]/g,' ');
  s = s.replace(/\s+/g,' ').trim();
  return s;
}
function noDia(s){
  return s.normalize('NFD').replace(/[̀-̛̣́̃̉̂̆]/g,'')
          .replace(/đ/g,'d');
}
function same(a,b){ return a===b || noDia(a)===noDia(b); }

/* ---------- dựng trang ---------- */
var QS = {};     // id -> {q, ex}
var STATE = {};  // id -> giá trị học sinh
var TOTAL = 0;
var LOCKED = false;

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function el(tag, cls, txt){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt!=null) e.textContent = txt;
  return e;
}
function speakerHTML(text){
  var m = text.match(/^([^:]{1,28}):\s/);
  if(m) return '<span class="sp">'+esc(m[1])+':</span> ' + esc(text.slice(m[0].length));
  return esc(text);
}

function makeControl(id, q){
  var span = document.createElement('span');
  if(q.type === 'mc'){
    span.className = 'opts';
    span.setAttribute('role','group');
    q.opts.forEach(function(o){
      var b = el('button','opt',o);
      b.type = 'button';
      b.setAttribute('aria-pressed','false');
      b.dataset.qid = id; b.dataset.val = o;
      b.addEventListener('click', function(){
        if(LOCKED) return;
        STATE[id] = o;
        span.querySelectorAll('.opt').forEach(function(x){
          x.setAttribute('aria-pressed', x.dataset.val===o ? 'true':'false');
        });
        updateProgress();
      });
      span.appendChild(b);
    });
  } else {
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'txt txt-in';
    inp.autocomplete = 'off'; inp.autocapitalize = 'off';
    inp.setAttribute('autocorrect','off'); inp.spellcheck = false;
    inp.dataset.qid = id;
    inp.setAttribute('aria-label','Câu '+q.n);
    inp.addEventListener('input', function(){ STATE[id] = inp.value; updateProgress(); });
    span.appendChild(inp);
  }
  return span;
}

function renderTemplate(text, exKey, host){
  var parts = text.split(/\[\[(\d+)\]\]/);
  var nums = [];
  for(var i=0;i<parts.length;i++){
    if(i % 2 === 0){
      if(parts[i]){
        var frag = document.createElement('span');
        frag.innerHTML = (i===0) ? speakerHTML(parts[i]) : esc(parts[i]);
        host.appendChild(frag);
      }
    } else {
      var n = parseInt(parts[i],10);
      var id = exKey+'-'+n;
      var rec = QS[id];
      host.appendChild(makeControl(id, rec.q));
      if(rec.q.cue){
        host.appendChild(el('span','cue',' ('+rec.q.cue+')'));
      }
      nums.push(n);
    }
  }
  return nums;
}

function build(){
  var app = document.getElementById('app');
  app.innerHTML = '';
  QS = {}; STATE = {}; TOTAL = 0; LOCKED = false;

  DATA.forEach(function(ex){
    ex.qs.forEach(function(q){
      QS[ex.key+'-'+q.n] = {q:q, ex:ex};
      TOTAL++;
    });
  });
  document.getElementById('tot').textContent = TOTAL;

  DATA.forEach(function(ex){
    var sec = el('section','ex');
    sec.id = 'ex-'+ex.key;
    if(ex.section){
      var h2 = el('h2','sec',ex.section);
      app.appendChild(h2);
    }
    var h3 = el('h3',null,ex.title);
    var sp = el('span','exscore'); sp.id = 'score-'+ex.key;
    h3.appendChild(sp);
    sec.appendChild(h3);
    if(ex.intro) sec.appendChild(el('p','intro',ex.intro));

    if(ex.kind === 'dialogue' || ex.kind === 'items'){
      ex.lines.forEach(function(ln){
        var d = el('div','line');
        var nums = renderTemplate(ln, ex.key, d);
        sec.appendChild(d);
        nums.forEach(function(n){
          var f = el('div','fb'); f.id = 'fb-'+ex.key+'-'+n;
          sec.appendChild(f);
        });
      });
    } else {
      ex.qs.forEach(function(q){
        var id = ex.key+'-'+q.n;
        var it = el('div','item');
        var d = el('div','line');
        d.innerHTML = '<span class="sp">Câu '+q.n+':</span> '+esc(q.src);
        it.appendChild(d);
        if(q.hint){
          it.appendChild(el('div','hint','→ Gợi ý viết lại: '+q.hint+(q.note?' ('+q.note+')':'')));
        } else if(q.note){
          it.appendChild(el('div','hint','('+q.note+')'));
        }
        if(ex.kind === 'correct'){
          it.appendChild(el('div','hint','Học sinh viết lại phần sai đã sửa đúng (hoặc viết lại cả câu):'));
        }
        var wrapC = makeControl(id, q);
        var inp = wrapC.querySelector('input');
        if(inp){ inp.className = 'txt txt-bl'; }
        it.appendChild(wrapC);
        var f = el('div','fb'); f.id = 'fb-'+id;
        it.appendChild(f);
        sec.appendChild(it);
      });
    }
    app.appendChild(sec);
  });

  document.getElementById('result').innerHTML = '';
  document.getElementById('noteBot').textContent = '';
  updateProgress();
}

function answered(id){
  var v = STATE[id];
  return v != null && String(v).trim() !== '';
}
function updateProgress(){
  var n = 0;
  for(var id in QS){ if(answered(id)) n++; }
  document.getElementById('done').textContent = n;
  var full = (n === TOTAL) && !LOCKED;
  document.getElementById('submitTop').disabled = !full;
  document.getElementById('submitBot').disabled = !full;
}

function isCorrect(q, val){
  var v = norm(val);
  for(var i=0;i<q.acc.length;i++){
    if(same(v, norm(q.acc[i]))) return true;
  }
  if(q.type === 'write' && q.prefix){
    var v2 = norm(q.prefix + ' ' + val);
    for(var j=0;j<q.acc.length;j++){
      if(same(v2, norm(q.acc[j]))) return true;
    }
  }
  return false;
}

function submit(){
  if(LOCKED) return;
  var correct = 0;
  LOCKED = true;

  DATA.forEach(function(ex){
    var exOK = 0;
    ex.qs.forEach(function(q){
      var id = ex.key+'-'+q.n;
      var val = STATE[id] || '';
      var ok = isCorrect(q, val);
      if(ok){ correct++; exOK++; }

      document.querySelectorAll('[data-qid="'+id+'"]').forEach(function(node){
        if(node.tagName === 'INPUT'){
          node.readOnly = true;
          node.classList.add(ok ? 'ok' : 'no');
        } else {
          node.disabled = true;
          var isAns = q.acc.some(function(a){ return same(norm(a), norm(node.dataset.val)); });
          if(isAns) node.classList.add('ok');
          else if(node.dataset.val === val) node.classList.add('no');
        }
      });

      var f = document.getElementById('fb-'+id);
      if(f){
        var box = el('div','fb-item ' + (ok?'ok':'no'));
        box.appendChild(el('div','fb-tag','Câu '+q.n+' · '+(ok?'Đúng':'Sai')));
        if(!ok){
          var r0 = el('div','fb-row');
          r0.innerHTML = '<span class="lb">Học sinh đã trả lời:</span> ' + esc(val);
          box.appendChild(r0);
        }
        var r1 = el('div','fb-row');
        r1.innerHTML = '<span class="lb">Đáp án:</span> <b>' + esc(q.ans) + '</b>';
        box.appendChild(r1);
        var r2 = el('div','fb-row');
        r2.innerHTML = '<span class="lb">Giải thích:</span> ' + esc(q.exp);
        box.appendChild(r2);
        f.appendChild(box);
      }
    });
    var s = document.getElementById('score-'+ex.key);
    if(s) s.textContent = '(đúng '+exOK+'/'+ex.qs.length+')';
  });

  var diem = Math.round(correct / TOTAL * 10 * 100) / 100;
  var res = document.getElementById('result');
  res.innerHTML = '';
  var box = el('div','result');
  box.appendChild(el('div','score','Điểm: ' + diem.toFixed(2) + '/10'));
  box.appendChild(el('div','detail','Đúng ' + correct + '/' + TOTAL + ' câu. '
      + 'Đáp án và giải thích của từng câu đã hiện ngay bên dưới câu đó.'));
  res.appendChild(box);

  document.getElementById('submitTop').disabled = true;
  document.getElementById('submitBot').disabled = true;
  document.getElementById('noteBot').textContent =
      'Bài đã nộp. Bấm "Làm lại" để làm lại từ đầu.';
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('submitTop').addEventListener('click', submit);
document.getElementById('submitBot').addEventListener('click', submit);
document.getElementById('reset').addEventListener('click', function(){
  build();
  window.scrollTo({top:0, behavior:'smooth'});
});

build();
</script>
