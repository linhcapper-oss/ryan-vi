<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unit 28 Grammar Review — Bài tập tương tác</title>
<style>
:root{
  --line:#d4d4d4; --line2:#e8e8e8; --ink:#1a1a1a; --dim:#5a5a5a;
  --ok:#1a7f37; --okbg:#eaf6ec; --no:#b42318; --nobg:#fdeceb;
  --sel:#1a1a1a; --selbg:#efefef;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:#fff; color:var(--ink);
  font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","Liberation Sans",sans-serif;
  font-size:16px; line-height:1.7;
}
.wrap{max-width:820px; margin:0 auto; padding:0 16px 64px}

/* thanh trên cùng: dính ở trên nên bàn phím ảo không che nội dung */
.bar{position:sticky; top:0; z-index:20; background:#fff; border-bottom:1px solid var(--line)}
.bar-in{max-width:820px; margin:0 auto; padding:8px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.prog{font-size:15px; color:var(--dim); flex:1 1 auto; min-width:140px}
.prog b{color:var(--ink)}
button{font:inherit; cursor:pointer}
.btn{
  border:1px solid var(--ink); background:var(--ink); color:#fff;
  border-radius:6px; padding:10px 18px; font-size:16px; font-weight:600; min-height:44px;
}
.btn[disabled]{background:#fff; color:#9a9a9a; border-color:var(--line); cursor:not-allowed}
.btn.sec{background:#fff; color:var(--ink); border-color:var(--ink)}

h1{font-size:22px; margin:24px 0 4px; line-height:1.35}
.sub{color:var(--dim); font-size:15px; margin:0 0 8px}
h2.sec{font-size:17px; margin:36px 0 0; padding-top:18px; border-top:2px solid var(--ink)}
h3{font-size:17px; margin:24px 0 2px}
.intro{color:var(--dim); font-size:15px; margin:2px 0 12px}
.ex{margin-bottom:8px}

.line{margin:10px 0}
.sp{font-weight:600}
.qn{color:var(--dim); font-size:14px}

.opts{display:inline-flex; flex-wrap:wrap; gap:6px; vertical-align:middle; margin:2px 2px}
.opt{
  border:1px solid var(--line); background:#fff; color:var(--ink);
  border-radius:6px; padding:6px 12px; min-height:38px; font-size:15px; line-height:1.3;
}
.opt[aria-pressed="true"]{border-color:var(--sel); background:var(--selbg); font-weight:600}
.opt[disabled]{cursor:default; opacity:.9}
.opt.ok{border-color:var(--ok); background:var(--okbg); color:var(--ok)}
.opt.no{border-color:var(--no); background:var(--nobg); color:var(--no)}

.txt{
  font:inherit; font-size:15px; border:1px solid var(--line); border-radius:6px;
  padding:8px 10px; min-height:40px; background:#fff; color:var(--ink); max-width:100%;
}
.txt-in{width:15em; vertical-align:middle}
.txt-bl{display:block; width:100%; margin-top:6px}
.txt.ok{border-color:var(--ok); background:var(--okbg)}
.txt.no{border-color:var(--no); background:var(--nobg)}
.txt:focus{outline:2px solid #1a1a1a; outline-offset:1px}

.item{margin:16px 0; padding-bottom:4px}
.hint{color:var(--dim); font-size:15px; margin-top:2px}
.cue{color:var(--dim)}

.fb{margin:6px 0 4px}
.fb-item{border-left:3px solid var(--line); padding:6px 0 6px 12px; margin:6px 0; font-size:15px}
.fb-item.ok{border-left-color:var(--ok)}
.fb-item.no{border-left-color:var(--no)}
.fb-tag{font-weight:700; font-size:14px}
.fb-item.ok .fb-tag{color:var(--ok)}
.fb-item.no .fb-tag{color:var(--no)}
.fb-row{margin-top:2px}
.fb-row .lb{color:var(--dim)}

.result{border:2px solid var(--ink); border-radius:8px; padding:16px; margin:20px 0}
.result .score{font-size:28px; font-weight:700; line-height:1.2}
.result .detail{color:var(--dim); margin-top:4px}
.exscore{font-size:14px; color:var(--dim); font-weight:400; margin-left:6px}
.foot{display:flex; gap:10px; flex-wrap:wrap; margin:28px 0 0}
.note{color:var(--dim); font-size:14px; margin-top:10px}
@media (max-width:520px){
  body{font-size:16px}
  .wrap{padding:0 12px 56px}
  .bar-in{padding:8px 12px}
  .txt-in{width:100%}
  .opt{padding:8px 12px; min-height:42px}
}
</style>
</head>
<body>
<div class="bar">
  <div class="bar-in">
    <div class="prog">Đã làm <b id="done">0</b>/<span id="tot">0</span> câu</div>
    <button class="btn" id="submitTop" disabled>Nộp bài</button>
  </div>
</div>

<div class="wrap">
  <h1>Unit 28 Grammar — Grammar Review</h1>
  <p class="sub">Bài tập tương tác. Học sinh làm hết tất cả các câu rồi bấm <b>Nộp bài</b>. Đáp án và giải thích chỉ hiện sau khi nộp.</p>
  <div id="result"></div>
  <div id="app"></div>
  <div class="foot">
    <button class="btn" id="submitBot" disabled>Nộp bài</button>
    <button class="btn sec" id="reset">Làm lại</button>
  </div>
  <p class="note" id="noteBot"></p>
</div>

<script>
var DATA = [{"key":"1A","section":"Chuyên đề 1: There is/There are & Chỉ định từ","title":"Bài tập 1A: Greenlake Community Center Tour","intro":"Emma (hướng dẫn viên) đang dẫn Liam (một du khách mới đến) đi tham quan Trung tâm Cộng đồng và Công viên Sinh thái Greenlake. Điền từ thích hợp vào chỗ trống:","kind":"dialogue","lines":["Emma: Welcome to the Greenlake Community Center, Liam! Let me show you around. First, look right here. (1) [[1]] is our main lobby.","Liam: Wow, it's very spacious! (2) [[2]] a cafeteria inside?","Emma: Yes, (3) [[3]]. It's just around the corner. But let's look outside the window first. Do you see those mountains in the distance?","Liam: Yes, I do. They look beautiful!","Emma: (4) [[4]] are the Cascade Mountains. They look amazing today, don't they?","Liam: Absolutely! And what about (5) [[5]] flowers right here in front of us? They smell wonderful.","Emma: Oh, (6) [[6]] are rare orchids we are growing for the exhibition.","Liam: Brilliant. By the way, (7) [[7]] many tourists visiting today, aren't there?","Emma: Yes, (8) [[8]]. It's always busy on weekends. But don't worry, (9) [[9]] any long lines at the ticket booth right now.","Liam: Great. Oh, look at (10) [[10]] small bird on the tree over there. Is it a hummingbird?","Emma: Yes! You have great eyes! Oh, and before I forget, here is your visitor badge. Please put (11) [[11]] on your shirt.","Liam: Thank you. Let's go inside! Oh, wait, (12) [[12]] any restrooms nearby?","Emma: Yes, (13) [[13]] one right next to the entrance we just passed."],"qs":[{"n":1,"type":"mc","opts":["This","These"],"ans":"This","exp":"Cần một từ chỉ định số ít ở vị trí gần người nói. Danh từ đi sau là \"main lobby\" (sảnh chính - số ít) và có cụm từ định hướng \"look right here\" (nhìn ngay đây).","acc":["This"]},{"n":2,"type":"mc","opts":["Is there","Are there"],"ans":"Is there","exp":"Đây là câu hỏi Yes/No với danh từ số ít đếm được là \"a cafeteria\" (một quán ăn tự phục vụ).","acc":["Is there"]},{"n":3,"type":"mc","opts":["there is","there's"],"ans":"there is","exp":"Quy tắc quan trọng: Trong câu trả lời ngắn khẳng định (Short Affirmative Answer), ta không bao giờ được viết tắt thành there's. Phải viết đầy đủ là \"Yes, there is.\"","acc":["there is"]},{"n":4,"type":"mc","opts":["That","Those"],"ans":"Those","exp":"Dùng cho danh từ số nhiều ở vị trí xa người nói. Ở đây danh từ là \"Cascade Mountains\" (dãy núi Cascade - số nhiều) và có cụm từ chỉ khoảng cách \"in the distance\" (ở phía xa).","acc":["Those"]},{"n":5,"type":"mc","opts":["this","these"],"ans":"these","exp":"Dùng cho danh từ số nhiều ở vị trí gần. Danh từ ở đây là \"flowers\" (những bông hoa - số nhiều) đi kèm cụm từ định vị \"right here\" (ngay tại đây).","acc":["these"]},{"n":6,"type":"mc","opts":["this","these"],"ans":"these","exp":"Làm đại từ chỉ định thay thế cho danh từ số nhiều \"rare orchids\" (những bông hoa lan hiếm) ở ngay gần người nói.","acc":["these"]},{"n":7,"type":"mc","opts":["there is","there are"],"ans":"there are","exp":"Dùng cấu trúc khẳng định với danh từ số nhiều là \"many tourists\" (nhiều khách du lịch).","acc":["there are"]},{"n":8,"type":"mc","opts":["there are","there is"],"ans":"there are","exp":"Câu trả lời ngắn khẳng định cho câu hỏi đuôi số nhiều phía trước (\"...aren't there?\" -> \"Yes, there are.\")","acc":["there are"]},{"n":9,"type":"mc","opts":["there's not","there aren't"],"ans":"there aren't","exp":"Dùng dạng phủ định số nhiều vì danh từ đi sau là \"any long lines\" (bất kỳ hàng dài nào - số nhiều).","acc":["there aren't"]},{"n":10,"type":"mc","opts":["that","those"],"ans":"that","exp":"Dùng cho danh từ số ít ở vị trí xa. Danh từ là \"small bird\" (chú chim nhỏ - số ít) và có cụm từ định vị \"over there\" (ở đằng kia).","acc":["that"]},{"n":11,"type":"mc","opts":["this","these"],"ans":"this","exp":"Đại từ chỉ định số ít, chỉ vật đang ở ngay sát người nói. Vật được nhắc đến là \"visitor badge\" (thẻ khách tham quan - số ít) mà Emma đang đưa tận tay cho Liam.","acc":["this"]},{"n":12,"type":"mc","opts":["are there","is there"],"ans":"are there","exp":"Câu hỏi Yes/No với danh từ số nhiều \"any restrooms\" (nhà vệ sinh).","acc":["are there"]},{"n":13,"type":"mc","opts":["there's","there are"],"ans":"there's","exp":"Câu khẳng định số ít viết rút gọn của \"there is\". Danh từ theo sau là \"one\" (một cái - số ít, đại diện cho \"a restroom\").","acc":["there's"]}]},{"key":"1B","section":null,"title":"Bài tập 1B: At the Museum Souvenir Shop","intro":"Mark và Sarah đang tham quan cửa hàng lưu niệm bên trong một bảo tàng nghệ thuật. Chọn từ thích hợp trong ngoặc:","kind":"dialogue","lines":["Mark: Look at (1) [[1]] beautiful postcard right here in my hand! I think I will buy it.","Sarah: Oh, it's nice. But what about (2) [[2]] posters on the wall over there? They look amazing.","Mark: They are great! (3) [[3]] a poster of the famous Mona Lisa painting?","Sarah: Yes, (4) [[4]]. It's right next to the window.","Mark: Perfect. By the way, are (5) [[5]] your sunglasses on the counter?","Sarah: No, they aren't mine. Look behind you, (6) [[6]] a lot of people waiting in line to pay. We should hurry.","Mark: Wait, I want to buy (7) [[7]] mug on the top shelf, but I can't reach it.","Sarah: Let's ask the clerk. Excuse me, (8) [[8]] any discounts on souvenirs today?","Clerk: No, (9) [[9]]. But (10) [[10]] keychains here are on sale and very cheap!"],"qs":[{"n":1,"type":"mc","opts":["this","these"],"ans":"this","exp":"Dùng đại từ chỉ định số ít cho vật ở gần người nói (\"in my hand\" - trên tay tôi). Danh từ \"postcard\" là số ít.","acc":["this"]},{"n":2,"type":"mc","opts":["that","those"],"ans":"those","exp":"Dùng để chỉ các vật số nhiều ở xa (\"on the wall over there\" - trên tường đằng kia). Danh từ \"posters\" là số nhiều.","acc":["those"]},{"n":3,"type":"mc","opts":["Is there","Are there"],"ans":"Is there","exp":"Câu hỏi với danh từ đếm được số ít \"a poster\".","acc":["Is there"]},{"n":4,"type":"mc","opts":["there is","there are"],"ans":"there is","exp":"Câu trả lời ngắn khẳng định cho câu hỏi \"Is there...?\" ở trên.","acc":["there is"]},{"n":5,"type":"mc","opts":["this","these"],"ans":"these","exp":"Chỉ vật số nhiều ở gần (\"on the counter\" - ngay trên quầy). Lưu ý: \"sunglasses\" (kính râm) luôn ở dạng số nhiều.","acc":["these"]},{"n":6,"type":"mc","opts":["there is","there are"],"ans":"there are","exp":"Cấu trúc khẳng định đi với cụm danh từ số nhiều \"a lot of people\" (rất nhiều người).","acc":["there are"]},{"n":7,"type":"mc","opts":["this","that"],"ans":"that","exp":"Chỉ một vật số ít ở xa tầm với (\"on the top shelf\" - trên kệ cao nhất).","acc":["that"]},{"n":8,"type":"mc","opts":["is there","are there"],"ans":"are there","exp":"Câu hỏi đi với danh từ số nhiều \"any discounts\" (chương trình giảm giá nào không).","acc":["are there"]},{"n":9,"type":"mc","opts":["there isn't","there aren't"],"ans":"there aren't","exp":"Câu trả lời ngắn phủ định cho danh từ số nhiều.","acc":["there aren't"]},{"n":10,"type":"mc","opts":["this","these"],"ans":"these","exp":"Chỉ nhiều vật đang ở ngay gần người nói (\"here\" - ở đây).","acc":["these"]}]},{"key":"2A","section":"Chuyên đề 2: Danh từ đếm được / không đếm được, Lượng từ & Mạo từ","title":"Bài tập 2A: Cooking Dinner","intro":"Alex (chủ nhà) và Elena đang cùng nhau chuẩn bị bữa tối trong căn bếp của Alex để làm món mì Ý sốt cà chua đặc biệt. Điền từ thích hợp:","kind":"dialogue","lines":["Alex: I'm so glad you're here! Let's make (1) [[1]] dinner together. What do we have in the fridge?","Elena: Let's see... We have (2) [[2]] eggs, but we don't have (3) [[3]] milk.","Alex: That's fine. We don't need milk for this pasta. But we do need to go buy (4) [[4]] fresh ingredients. There is (5) [[5]] organic market just around the corner.","Elena: Great! Do we need (6) [[6]] tomatoes for your secret sauce?","Alex: Yes, we need (7) [[7]] tomatoes. Let's get about six big ones.","Elena: Okay. And what about (8) [[8]] bread? Do we need to buy some to eat with the pasta?","Alex: Good idea, let's buy a baguette. Oh, and I saw some Cheddar cheese in the pantry earlier. Is it still good?","Elena: Ah, no. (9) [[9]] in the pantry smells a bit funny. We should buy a new block.","Alex: Got it. Is there (10) [[10]] salt left in the kitchen?","Elena: Yes, we have (11) [[11]] salt left in this small jar, so we don't need to buy any. But we definitely need (12) [[12]] onion.","Elena: Do we need (13) [[13]] rice too?","Alex: No, there is (14) [[14]] rice in the big container. We have plenty. Oh, can you check if there is (15) [[15]] bottle of olive oil?","Elena: Yes, look! (16) [[16]] bottle of olive oil on the counter is almost brand new. We are ready to go!"],"qs":[{"n":1,"type":"mc","opts":["a","the","Ø"],"ans":"Ø","exp":"Theo quy tắc, chúng ta không dùng mạo từ đứng trước các bữa ăn trong ngày (make Ø dinner, have Ø breakfast).","acc":["Ø"]},{"n":2,"type":"mc","opts":["a few","a little"],"ans":"a few","exp":"\"Eggs\" (những quả trứng) là danh từ đếm được số nhiều. Do đó, ta phải chọn lượng từ a few (một vài).","acc":["a few"]},{"n":3,"type":"mc","opts":["some","any"],"ans":"any","exp":"\"Milk\" là danh từ không đếm được. Vì câu này ở thể phủ định (\"...we don't have...\"), ta bắt buộc phải dùng any theo quy tắc phủ định.","acc":["any"]},{"n":4,"type":"mc","opts":["a","some","Ø"],"ans":"some","exp":"\"Ingredients\" (các nguyên liệu) là danh từ số nhiều. Đây là câu khẳng định, nên ta dùng lượng từ some để chỉ \"một số nguyên liệu tươi\".","acc":["some"]},{"n":5,"type":"mc","opts":["a","an","Ø"],"ans":"an","exp":"\"Organic\" (hữu cơ) bắt đầu bằng nguyên âm /ɔːˈɡæn.ɪk/ (âm \"O\"). Do đó, ta phải chọn mạo từ bất định an đứng trước danh từ số ít đếm được \"organic market\".","acc":["an"]},{"n":6,"type":"mc","opts":["many","much"],"ans":"many","exp":"\"Tomatoes\" (những quả cà chua) là danh từ đếm được số nhiều. Trong câu hỏi, lượng từ bổ nghĩa cho danh từ đếm được số nhiều là many.","acc":["many"]},{"n":7,"type":"mc","opts":["a lot of","much"],"ans":"a lot of","exp":"Giáo trình quy định trong câu khẳng định, ta dùng a lot of cho cả danh từ đếm được và không đếm được thay vì dùng many/much để tạo cảm giác tự nhiên, gần gũi.","acc":["a lot of"]},{"n":8,"type":"mc","opts":["a","Ø","the"],"ans":"Ø","exp":"\"Bread\" (bánh mì) là danh từ không đếm được. Ở đây Elena đang hỏi chung chung về bánh mì (không chỉ cụ thể cái nào), nên không dùng mạo từ (Ø).","acc":["Ø"]},{"n":9,"type":"mc","opts":["cheese","the cheese","a cheese"],"ans":"the cheese","exp":"\"Cheese\" (phô mai) là danh từ không đếm được. Tuy nhiên, Elena đang chỉ đích danh miếng phô mai Cheddar có trong chạn bát đĩa mà cô ấy vừa nhắc tới ở câu trước. Do đối tượng đã được xác định cụ thể, ta dùng the cheese.","acc":["the cheese"]},{"n":10,"type":"mc","opts":["any","many"],"ans":"any","exp":"\"Salt\" (muối) là danh từ không đếm được. Đây là câu nghi vấn (câu hỏi), vì vậy ta sử dụng lượng từ any.","acc":["any"]},{"n":11,"type":"mc","opts":["a little","a few"],"ans":"a little","exp":"\"Salt\" là danh từ không đếm được. Để chỉ một lượng muối nhỏ đủ dùng, ta chọn a little (a few chỉ đi với danh từ đếm được số nhiều).","acc":["a little"]},{"n":12,"type":"mc","opts":["a","an","Ø"],"ans":"an","exp":"\"Onion\" (củ hành) bắt đầu bằng nguyên âm /ˈʌn.jən/ (âm \"U/A\"). Do đó, ta dùng mạo từ an đứng trước danh từ số ít.","acc":["an"]},{"n":13,"type":"mc","opts":["any","some"],"ans":"any","exp":"\"Rice\" (gạo) là danh từ không đếm được. Trong câu hỏi Yes/No, ta dùng lượng từ any.","acc":["any"]},{"n":14,"type":"mc","opts":["a lot of","many"],"ans":"a lot of","exp":"\"Rice\" là danh từ không đếm được. Lượng từ many chỉ đi với danh từ đếm được số nhiều, vì thế ta chọn a lot of cho câu khẳng định.","acc":["a lot of"]},{"n":15,"type":"mc","opts":["a","the","Ø"],"ans":"a","exp":"\"Bottle\" (cái chai) là danh từ số ít đếm được, lần đầu tiên xuất hiện trong cuộc trò chuyện (chưa xác định), nên ta dùng mạo từ bất định a.","acc":["a"]},{"n":16,"type":"mc","opts":["a","the","Ø"],"ans":"the","exp":"\"Bottle of olive oil\" lúc này đã được xác định cụ thể (là cái chai dầu ô-liu mà Alex vừa hỏi ở câu ngay trước đó, và được Elena chỉ rõ vị trí \"on the counter\"). Do đó, mạo từ bất định \"a\" chuyển thành mạo từ xác định the.","acc":["the"]}]},{"key":"2B","section":null,"title":"Bài tập 2B: BBQ Party Shopping List","intro":"Leo và Tom đang lên danh sách đi siêu thị để chuẩn bị cho bữa tiệc nướng (BBQ) cuối tuần. Chọn từ thích hợp:","kind":"dialogue","lines":["Leo: Let's make a shopping list for our BBQ party. First, we need to buy (1) [[1]] meat. Do we have (2) [[2]] beef left in the freezer?","Tom: No, we don't have (3) [[3]] beef, just a tiny piece. We should buy about 2 kilos.","Leo: Okay. We also need (4) [[4]] vegetables to make a salad. How about tomatoes?","Tom: There are (5) [[5]] tomatoes in the fridge. We don't need them. But we definitely need (6) [[6]] onion and (7) [[7]] garlic.","Leo: Got it. What about drinks? Is there (8) [[8]] orange juice left?","Tom: No, only (9) [[9]]. Let's buy two big bottles.","Leo: Good idea. And I'll buy (10) [[10]] apple pie from the bakery down the street. (11) [[11]] apple pie there is always delicious!","Tom: Sounds great. Don't forget to get (12) [[12]] paper plates too, because I don't want to wash dishes after the party!"],"qs":[{"n":1,"type":"mc","opts":["a","some","Ø"],"ans":"some","exp":"\"Meat\" (thịt) là danh từ không đếm được. Trong câu khẳng định, ta dùng lượng từ some để chỉ một lượng không xác định.","acc":["some"]},{"n":2,"type":"mc","opts":["some","any"],"ans":"any","exp":"Trong câu hỏi (nghi vấn) với danh từ không đếm được \"beef\", ta phải sử dụng any thay vì some.","acc":["any"]},{"n":3,"type":"mc","opts":["much","many"],"ans":"much","exp":"\"Beef\" là danh từ không đếm được. Trong câu phủ định (\"don't have\"), lượng từ đi kèm phải là much (không dùng many vì many đi với số nhiều đếm được).","acc":["much"]},{"n":4,"type":"mc","opts":["a few","a little"],"ans":"a few","exp":"\"Vegetables\" là danh từ đếm được số nhiều. Để diễn tả ý \"một vài, một ít\", ta dùng a few.","acc":["a few"]},{"n":5,"type":"mc","opts":["a lot of","much"],"ans":"a lot of","exp":"\"Tomatoes\" là danh từ đếm được số nhiều. Trong câu khẳng định thân mật, a lot of được ưu tiên sử dụng.","acc":["a lot of"]},{"n":6,"type":"mc","opts":["a","an","the"],"ans":"an","exp":"Từ \"onion\" bắt đầu bằng một nguyên âm, là danh từ số ít đếm được, được nhắc đến lần đầu tiên nên dùng mạo từ bất định an.","acc":["an"]},{"n":7,"type":"mc","opts":["some","any"],"ans":"some","exp":"\"Garlic\" (tỏi) là danh từ không đếm được. Câu mang ý khẳng định (\"we definitely need...\") nên dùng some.","acc":["some"]},{"n":8,"type":"mc","opts":["many","much"],"ans":"much","exp":"\"Orange juice\" (nước ép cam) là danh từ không đếm được. Trong câu hỏi về số lượng, ta dùng much.","acc":["much"]},{"n":9,"type":"mc","opts":["a little","a few"],"ans":"a little","exp":"Thay thế cho \"orange juice\" ở phía trước. Để chỉ \"một ít\" đối với danh từ không đếm được, ta dùng a little.","acc":["a little"]},{"n":10,"type":"mc","opts":["a","an","the"],"ans":"an","exp":"\"Apple pie\" (bánh táo) được nhắc đến lần đầu tiên (chưa xác định cụ thể là cái nào ở tiệm bánh), số ít và bắt đầu bằng nguyên âm nên dùng an.","acc":["an"]},{"n":11,"type":"mc","opts":["A","An","The"],"ans":"The","exp":"Lúc này, \"apple pie\" đã được nhắc đến ở câu ngay trước đó và được xác định rõ là \"cái bánh ở tiệm bánh đó\" (The apple pie there). Do đối tượng đã xác định, mạo từ chuyển thành The.","acc":["The"]},{"n":12,"type":"mc","opts":["some","any"],"ans":"some","exp":"\"Paper plates\" (đĩa giấy) là danh từ đếm được số nhiều. Trong câu khẳng định (\"get some paper plates\"), ta dùng some.","acc":["some"]}]},{"key":"3A","section":"Chuyên đề 3: Danh động từ (Gerunds) & Động từ nguyên mẫu (Infinitives)","title":"Bài tập 3A: Study Plan & Scholarships","intro":"Jessica và Minh thảo luận về dự định học tập và xin học bổng của Minh tại Canada. Chọn từ thích hợp:","kind":"dialogue","lines":["Jessica: Hi Minh! I heard you are (1) [[1]] for a scholarship. Is that true?","Minh: Yes! I'm (2) [[2]] computer science in Canada.","Jessica: That sounds amazing! I know you are very (3) [[3]] about artificial intelligence.","Minh: Exactly. I am (4) [[4]] my classes. But first, I need to pass the IELTS exam.","Jessica: Don't worry, you write very well. I always (5) [[5]] your articles.","Minh: Thanks, Jessica. My English teacher actually (6) [[6]] the test next month.","Jessica: That's great! Have you (7) [[7]] a part-time job there too?","Minh: I think so. I need to work (8) [[8]] money for rent. It is very expensive there.","Jessica: True. Just make sure to manage your time. You should (9) [[9]] yourself out.","Minh: Thanks for the advice. I really (10) [[10]] from the university soon!"],"qs":[{"n":1,"type":"mc","opts":["planning to apply","planning applying"],"ans":"planning to apply","exp":"Động từ plan (lên kế hoạch) bắt buộc đi với To-Infinitive (plan + to V).","acc":["planning to apply"]},{"n":2,"type":"mc","opts":["considering to study","considering studying"],"ans":"considering studying","exp":"Động từ consider (cân nhắc) bắt buộc đi với danh động từ (consider + V-ing).","acc":["considering studying"]},{"n":3,"type":"mc","opts":["interested in learning","interested in learn"],"ans":"interested in learning","exp":"Đứng sau giới từ in (nằm trong cụm tính từ interested in), động từ bắt buộc phải thêm đuôi -ing.","acc":["interested in learning"]},{"n":4,"type":"mc","opts":["eager to start","eager starting"],"ans":"eager to start","exp":"Đứng sau tính từ eager (háo hức), ta dùng cấu trúc động từ nguyên mẫu có to (adjective + to V).","acc":["eager to start"]},{"n":5,"type":"mc","opts":["enjoy to read","enjoy reading"],"ans":"enjoy reading","exp":"Động từ enjoy (thưởng thức/thích) bắt buộc đi với danh động từ (enjoy + V-ing).","acc":["enjoy reading"]},{"n":6,"type":"mc","opts":["encouraged me taking","encouraged me to take"],"ans":"encouraged me to take","exp":"Động từ encourage thuộc nhóm yêu cầu cấu trúc có tân ngữ trước động từ nguyên mẫu (encourage + Object + to V).","acc":["encouraged me to take"]},{"n":7,"type":"mc","opts":["decided to get","decided getting"],"ans":"decided to get","exp":"Động từ decide (quyết định) đi với động từ nguyên mẫu có to (decide + to V).","acc":["decided to get"]},{"n":8,"type":"mc","opts":["to save","for save"],"ans":"to save","exp":"Đây là động từ nguyên mẫu chỉ mục đích (Infinitive of Purpose), giải thích lý do Minh cần đi làm (để tiết kiệm tiền).","acc":["to save"]},{"n":9,"type":"mc","opts":["avoid to stress","avoid stressing"],"ans":"avoid stressing","exp":"Động từ avoid (tránh) bắt buộc đi kèm danh động từ (avoid + V-ing).","acc":["avoid stressing"]},{"n":10,"type":"mc","opts":["look forward to hearing","look forward to hear"],"ans":"look forward to hearing","exp":"Cụm động từ look forward to có từ to đóng vai trò là giới từ, do đó động từ theo sau bắt buộc phải ở dạng V-ing.","acc":["look forward to hearing"]}]},{"key":"3B","section":null,"title":"Bài tập 3B: Hiking Trip & Healthy Lifestyle","intro":"Lan và David trò chuyện về chuyến dã ngoại cuối tuần và lối sống mới của David. Chọn từ thích hợp:","kind":"dialogue","lines":["Lan: Hey David! How was your weekend? I heard you and Sarah (1) [[1]].","David: It was exhausting but fun! We (2) [[2]] to the top of Mount Langbiang. It was so steep, but we made it!","Lan: Wow! Did you take many pictures?","David: Yes! We (3) [[3]] photos every twenty minutes because the view was breathtaking.","Lan: Oh, I will never (4) [[4]] the sunrise there last year. It was unforgettable.","David: I agree. Actually, I was very tired after the trip, so I (5) [[5]] some warm milk to sleep better. It really worked!","Lan: Good for you. By the way, did you (6) [[6]] the office door before you left on Friday? The manager asked about it.","David: Yes, I clearly remember doing it. Speaking of health, I also (7) [[7]] fast food this week. I want to eat healthier.","Lan: That's amazing! Habits are (8) [[8]], but it's worth it.","David: Yeah, but now I have to find (9) [[9]] my own meals every day.","Lan: You can do it! Just (10) [[10]] and eating well!"],"qs":[{"n":1,"type":"mc","opts":["went to hike","went hiking"],"ans":"went hiking","exp":"Sử dụng cấu trúc go + V-ing để chỉ hoạt động giải trí dã ngoại ngoài trời (go hiking).","acc":["went hiking"]},{"n":2,"type":"mc","opts":["tried to climb","tried climbing"],"ans":"tried to climb","exp":"Sử dụng try + to V vì việc leo lên đỉnh núi Langbiang dốc là một hành động khó khăn đòi hỏi sự cố gắng, nỗ lực lớn.","acc":["tried to climb"]},{"n":3,"type":"mc","opts":["stopped to take","stopped taking"],"ans":"stopped to take","exp":"Sử dụng stop + to V vì họ đã tạm dừng việc leo núi để thực hiện một hành động khác là chụp ảnh.","acc":["stopped to take"]},{"n":4,"type":"mc","opts":["forget seeing","forget to see"],"ans":"forget seeing","exp":"Sử dụng forget + V-ing để diễn tả việc Lan không bao giờ quên một kỷ niệm đẹp đã xảy ra trong quá khứ (ngắm bình minh năm ngoái).","acc":["forget seeing"]},{"n":5,"type":"mc","opts":["tried to drink","tried drinking"],"ans":"tried drinking","exp":"Sử dụng try + V-ing mang ý nghĩa \"thử nghiệm\" một phương pháp xem có hiệu quả không (thử uống sữa ấm xem có ngủ ngon hơn không).","acc":["tried drinking"]},{"n":6,"type":"mc","opts":["remember to lock","remember locking"],"ans":"remember to lock","exp":"Sử dụng remember + to V vì đây là việc David cần phải nhớ để thực hiện (bổn phận khóa cửa văn phòng).","acc":["remember to lock"]},{"n":7,"type":"mc","opts":["stopped to buy","stopped buying"],"ans":"stopped buying","exp":"Sử dụng stop + V-ing vì David muốn nói đến việc từ bỏ hoàn toàn một thói quen xấu (ngừng mua đồ ăn nhanh).","acc":["stopped buying"]},{"n":8,"type":"mc","opts":["difficult to break","difficult breaking"],"ans":"difficult to break","exp":"Động từ nguyên mẫu đứng sau tính từ chỉ mức độ khó/dễ difficult (adjective + to V).","acc":["difficult to break"]},{"n":9,"type":"mc","opts":["time to prepare","time preparing"],"ans":"time to prepare","exp":"Động từ nguyên mẫu đứng sau danh từ time để chỉ mục đích, cơ hội thực hiện hành động (thì giờ để chuẩn bị bữa ăn).","acc":["time to prepare"]},{"n":10,"type":"mc","opts":["keep on exercising","keep on to exercise"],"ans":"keep on exercising","exp":"Đứng sau giới từ on (nằm trong cụm động từ keep on), động từ bắt buộc phải ở dạng V-ing.","acc":["keep on exercising"]}]},{"key":"4A","section":"Chuyên đề 4: Động từ khuyết thiếu (Modal Verbs) & Cụm tương đương","title":"Bài tập 4A: Seeking Academic Advice","intro":"Mia đang gặp thầy Davis (cố vấn học tập) để xin lời khuyên nộp hồ sơ học bổng. Chọn từ thích hợp:","kind":"dialogue","lines":["Mia: Excuse me, Mr. Davis. (1) [[1]] ask you a question about the exchange program?","Mr. Davis: Of course, Mia. Come on in!","Mia: Well, when I was younger, I (2) [[2]] speak French fluently because I lived there. But now I've forgotten a lot.","Mr. Davis: Don't worry. If you practice, you (3) [[3]] regain your fluency quickly.","Mia: I hope so. Here is my application draft. (4) [[4]] improve in this essay?","Mr. Davis: Let’s see. You (5) [[5]] write more about your volunteer work. It makes your essay look much stronger.","Mia: That's a good idea! Also, the deadline is next Monday.","Mr. Davis: Oh, then you (6) [[6]] submit it before Friday. The system often crashes on the weekend due to high traffic.","Mia: I will. Oh, and (7) [[7]] use your computer for ten minutes to print this new resume out?","Mr. Davis: Yes, you (8) [[8]]. The printer is right behind my desk.","Mia: Thank you so much! Yesterday, I (9) [[9]] get my academic transcript from the main office, so everything else is ready.","Mr. Davis: Excellent. You (10) [[10]] be very proud of yourself for being so organized!"],"qs":[{"n":1,"type":"mc","opts":["May I","Had better I"],"ans":"May I","exp":"Dùng để hỏi xin phép một cách trang trọng và lịch sự đối với thầy cô giáo, cấp trên (May I...).","acc":["May I"]},{"n":2,"type":"mc","opts":["could","was able to"],"ans":"could","exp":"Diễn tả một khả năng chung trong quá khứ (trước đây tôi có thể nói tiếng Pháp trôi chảy).","acc":["could"]},{"n":3,"type":"mc","opts":["will be able to","should"],"ans":"will be able to","exp":"Diễn tả khả năng xảy ra trong tương lai (bạn sẽ có thể khôi phục lại sự trôi chảy nhanh chóng thôi). Các động từ khuyết thiếu thông thường không có dạng tương lai với \"will\", bắt buộc phải mượn cụm từ tương đương \"will be able to\".","acc":["will be able to"]},{"n":4,"type":"mc","opts":["What should I","What must I"],"ans":"What should I","exp":"Dùng cấu trúc should để hỏi xin lời khuyên nhẹ nhàng, mang tính học thuật từ thầy cô (Tôi nên cải thiện phần nào?).","acc":["What should I"]},{"n":5,"type":"mc","opts":["ought to","could"],"ans":"ought to","exp":"Dùng để đưa ra lời khuyên chung, tương đương với should (Bạn nên viết nhiều hơn về...). Lựa chọn could ở đây mang tính gợi ý quá nhẹ, không phù hợp bằng một lời khuyên chuyên môn của cố vấn.","acc":["ought to"]},{"n":6,"type":"mc","opts":["had better","may"],"ans":"had better","exp":"Đưa ra lời khuyên mạnh mẽ có tính cảnh báo hậu quả xấu (Bạn tốt nhất là nên nộp trước thứ Sáu, nếu không hệ thống sẽ bị nghẽn).","acc":["had better"]},{"n":7,"type":"mc","opts":["could I","must I"],"ans":"could I","exp":"Dùng để hỏi xin phép một cách lịch sự, trang trọng (Em có thể sử dụng máy tính của thầy không?).","acc":["could I"]},{"n":8,"type":"mc","opts":["can","could"],"ans":"can","exp":"Quy tắc vàng: Khi đáp lại lời hỏi xin phép lịch sự bằng Could I..., người nói đồng ý bằng cách sử dụng can hoặc may (Yes, you can / Yes, you may), tuyệt đối không dùng Yes, you could.","acc":["can"]},{"n":9,"type":"mc","opts":["was able to","could"],"ans":"was able to","exp":"Diễn tả việc Mia đã nỗ lực và thực hiện thành công một hành động cụ thể trong quá khứ (xin được học bạ từ văn phòng hành chính vào ngày hôm qua). Không dùng could cho những thành công cụ thể đơn lẻ như thế này.","acc":["was able to"]},{"n":10,"type":"mc","opts":["should","might"],"ans":"should","exp":"Dùng để thể hiện một dự đoán/kỳ vọng hợp lý (Em hoàn toàn xứng đáng/nên cảm thấy tự hào về bản thân).","acc":["should"]}]},{"key":"4B","section":null,"title":"Bài tập 4B: Museum Staff Training","intro":"Lisa đang hướng dẫn các quy định nghiêm ngặt cho nhân viên mới Ken tại bảo tàng nghệ thuật. Chọn từ thích hợp:","kind":"dialogue","lines":["Ken: Hi Lisa, thanks for showing me the ropes. (1) [[1]] wear a formal suit every day?","Lisa: No, we (2) [[2]] wear a full suit, but you must dress neatly. No t-shirts or jeans are allowed.","Ken: Got it. And what about the exhibition rooms?","Lisa: Visitors (3) [[3]] touch any of the paintings. It’s strictly forbidden.","Ken: Yes, I know that. But as staff, (4) [[4]] clean the frames?","Lisa: Absolutely not! Only the conservation team can do that. We (5) [[5]] report any dust or damage to them immediately.","Ken: Understood. Look! The lights are on in the gallery. The director (6) [[6]] be inside already.","Lisa: No, he (7) [[7]] be in there. I just saw his car outside; he was still parking it. It must be the cleaning staff.","Ken: Oh, I see. By the way, I (8) [[8]] find my ID badge right now. I think I left it in the locker room.","Lisa: You (9) [[9]] find it quickly. The security guard is very strict, and you cannot enter the secure zones without it.","Ken: You're right. It (10) [[10]] be in my backpack. Let me check."],"qs":[{"n":1,"type":"mc","opts":["Do we have to","May we"],"ans":"Do we have to","exp":"Hỏi về sự bắt buộc, quy định bắt buộc phải tuân theo tại nơi làm việc (Chúng tôi có bắt buộc phải mặc vest không?).","acc":["Do we have to"]},{"n":2,"type":"mc","opts":["don't have to","mustn't"],"ans":"don't have to","exp":"Diễn tả sự không bắt buộc (Chúng ta không cần thiết phải mặc cả bộ vest, nhưng phải lịch sự).","acc":["don't have to"]},{"n":3,"type":"mc","opts":["must not","don't have to"],"ans":"must not","exp":"Diễn tả sự cấm đoán tuyệt đối của bảo tàng (Khách tham quan không được phép chạm vào tranh).","acc":["must not"]},{"n":4,"type":"mc","opts":["are we supposed to","may we"],"ans":"are we supposed to","exp":"Hỏi về nhiệm vụ, trách nhiệm theo kỳ vọng công việc hoặc nội quy (Chúng ta có nhiệm vụ phải lau khung tranh không?).","acc":["are we supposed to"]},{"n":5,"type":"mc","opts":["should","have got to"],"ans":"have got to","exp":"Diễn tả một nghĩa vụ bắt buộc, khẩn cấp phải thực hiện (Chúng ta phải báo cáo ngay lập tức cho đội bảo tồn). Have got to thường dùng nhiều trong văn nói hàng ngày.","acc":["have got to"]},{"n":6,"type":"mc","opts":["must","can't"],"ans":"must","exp":"Diễn tả một suy đoán có độ chắc chắn rất cao (khoảng 90%) dựa trên bằng chứng hiện tại (Đèn đang bật -> Giám đốc chắc chắn đang ở bên trong).","acc":["must"]},{"n":7,"type":"mc","opts":["can't","might not"],"ans":"can't","exp":"Diễn tả một suy đoán phủ định có độ chắc chắn cực kỳ cao dựa trên bằng chứng rõ ràng ngược lại (Ông ấy không thể nào ở trong đó được vì tôi vừa thấy xe ông ấy ở ngoài bãi đỗ).","acc":["can't"]},{"n":8,"type":"mc","opts":["have got to","ought to"],"ans":"have got to","exp":"Diễn tả một việc bắt buộc mang tính cá nhân, khẩn cấp cần thực hiện ngay lập tức (Tôi phải đi tìm thẻ ID của mình ngay).","acc":["have got to"]},{"n":9,"type":"mc","opts":["had better","may"],"ans":"had better","exp":"Đưa ra lời cảnh báo mạnh mẽ về hậu quả (Cậu tốt nhất là nên tìm nó nhanh lên, bảo vệ ở đây nghiêm khắc lắm).","acc":["had better"]},{"n":10,"type":"mc","opts":["might","must"],"ans":"might","exp":"Diễn tả một khả năng có độ chắc chắn thấp hoặc trung bình (Nó có thể đang ở trong balo của tôi - chưa chắc chắn hoàn toàn).","acc":["might"]}]},{"key":"5A","section":"Chuyên đề 5: Câu ghép, Câu phức & Mệnh đề quan hệ","title":"Bài tập 5A: Planning a Surprise Birthday","intro":"Ryan và Sophie đang lên kế hoạch tổ chức tiệc sinh nhật bất ngờ cho Mark. Chọn từ thích hợp:","kind":"dialogue","lines":["Ryan: Hey Sophie, (1) [[1]] we are very busy preparing for our final exams, we still need to plan Mark’s surprise party.","Sophie: I agree! I wanted to host it at my house, (2) [[2]] my parents are redecorating the living room this week.","Ryan: That's fine. We can book a private room at the Green Cafe (3) [[3]] it has a beautiful garden, (4) [[4]] the price is quite reasonable.","Sophie: Great idea! We should send out the invitations tonight. (5) [[5]] Mark logs off his computer later, I will create a private group chat without him.","Ryan: Perfect. Mark is very observant, (6) [[6]] we must be extremely careful not to let him see our messages.","Sophie: Don't worry. (7) [[7]] we keep all our conversations inside that private group, he won't suspect anything.","Ryan: Right. Hey, (8) [[8]] you are setting up the chat group, should I contact the bakery (9) [[9]] do you want to order the birthday cake yourself?","Sophie: Please contact them, (10) [[10]] you personally know the owner of that shop."],"qs":[{"n":1,"type":"mc","opts":["although","but"],"ans":"although","exp":"Đây là câu phức. Liên từ nhượng bộ although (mặc dù) đứng đầu mệnh đề phụ thuộc để chỉ sự tương phản (mặc dù bận rộn học thi, chúng ta vẫn phải lên kế hoạch...) [sb].","acc":["although"]},{"n":2,"type":"mc","opts":["but","so"],"ans":"but","exp":"Đây là câu ghép. Liên từ kết hợp chỉ sự đối lập but (nhưng) được dùng để kết nối hai mệnh đề độc lập. Lưu ý có dấu phẩy đứng trước liên từ [sb].","acc":["but"]},{"n":3,"type":"mc","opts":["because","although"],"ans":"because","exp":"Đây là câu phức. Liên từ because (bởi vì) mở đầu mệnh đề phụ thuộc chỉ nguyên nhân chọn quán Green Cafe [sb].","acc":["because"]},{"n":4,"type":"mc","opts":["and","so"],"ans":"and","exp":"Đây là câu ghép. Dùng liên từ and để bổ sung thêm một thông tin tích cực tương đồng về quán cafe (quán có vườn đẹp, VÀ giá cả hợp lý) [sb].","acc":["and"]},{"n":5,"type":"mc","opts":["When","Since"],"ans":"When","exp":"Đây là câu phức có mệnh đề phụ thuộc chỉ thời gian đứng đầu câu. Dùng When (Khi) để chỉ mốc thời gian Sophie sẽ thực hiện hành động lập nhóm chat [sb].","acc":["When"]},{"n":6,"type":"mc","opts":["so","or"],"ans":"so","exp":"Đây là câu ghép. Liên từ so (vì vậy) chỉ kết quả của việc Mark rất hay quan sát (Mark rất hay để ý, vì vậy chúng ta phải cực kỳ cẩn thận) [sb].","acc":["so"]},{"n":7,"type":"mc","opts":["If","Although"],"ans":"If","exp":"Đây là câu điều kiện (một dạng câu phức). Liên từ If đứng đầu mệnh đề điều kiện nhằm giả định một tình huống (Nếu chúng ta giữ mọi chuyện trong nhóm kín...) [sb].","acc":["If"]},{"n":8,"type":"mc","opts":["while","because"],"ans":"while","exp":"Đây là câu phức chỉ thời gian. Dùng while (trong khi) để diễn tả hai hành động song song diễn ra (trong khi cậu lập nhóm, tớ nên gọi tiệm bánh hay...) [sb].","acc":["while"]},{"n":9,"type":"mc","opts":["or","but"],"ans":"or","exp":"Đây là câu ghép chỉ sự lựa chọn. Liên từ or (hoặc) kết nối hai hành động lựa chọn độc lập [sb].","acc":["or"]},{"n":10,"type":"mc","opts":["since","although"],"ans":"since","exp":"Đây là câu phức chỉ nguyên nhân. Since đóng vai trò tương đương như because (vì, bởi vì) [sb].","acc":["since"]}]},{"key":"5B","section":null,"title":"Bài tập 5B: Job Interview & Resume","intro":"Ông Henderson (nhà tuyển dụng) phỏng vấn ứng viên Chloe về kinh nghiệm làm việc cũ. Chọn từ thích hợp:","kind":"dialogue","lines":["Mr. Henderson: Welcome to our company, Chloe. Let's look at your resume. I see you worked at Innovatech, (1) [[1]] is a very famous tech firm.","Chloe: Yes. It was an amazing place (2) [[2]] I learned a lot of programming skills.","Mr. Henderson: Excellent. The project manager (3) [[3]] supervised your team was Mr. Vance, right?","Chloe: Actually, Mr. Vance, (4) [[4]] book about Artificial Intelligence you might have read, was the director, but Ms. Clara was my direct supervisor.","Mr. Henderson: Ah, Ms. Clara! She is a talented leader (5) [[5]] everyone in our industry respects deeply.","Chloe: Yes, she is. She taught me how to manage complex projects (6) [[6]] deadlines were extremely tight.","Mr. Henderson: That's impressive. Now, tell me about the mobile app (7) [[7]] you designed last year.","Chloe: It is a productivity application (8) [[8]] main purpose is to help busy people organize tasks. The users (9) [[9]] tested the beta version gave us very positive feedback.","Mr. Henderson: That sounds like a perfect match for our development team, (10) [[10]] always focuses on creating user-friendly products."],"qs":[{"n":1,"type":"mc","opts":["which","that"],"ans":"which","exp":"Do \"Innovatech\" là tên riêng (đã xác định), mệnh đề phía sau là mệnh đề quan hệ không xác định (có dấu phẩy ngăn cách). Theo quy tắc, ta không được dùng \"that\" sau dấu phẩy trong trường hợp này [sb].","acc":["which"]},{"n":2,"type":"mc","opts":["where","which"],"ans":"where","exp":"Trạng từ quan hệ where (nơi mà) thay thế cho trạng ngữ chỉ nơi chốn \"at Innovatech\" (nơi tôi học được nhiều kỹ năng).","acc":["where"]},{"n":3,"type":"mc","opts":["who","whose"],"ans":"who","exp":"Đại từ quan hệ who làm chủ ngữ bổ nghĩa cho người đứng trước là \"The project manager\", theo sau là động từ \"supervised\" [sb].","acc":["who"]},{"n":4,"type":"mc","opts":["whom","whose"],"ans":"whose","exp":"Đại từ chỉ sự sở hữu whose bổ nghĩa cho danh từ đi sau là \"book\" (Mr. Vance, người mà cuốn sách của ông ấy...) [sb].","acc":["whose"]},{"n":5,"type":"mc","opts":["whom","whose"],"ans":"whom","exp":"Đại từ quan hệ whom làm tân ngữ cho người đứng trước là \"a talented leader\", theo sau là một cụm Chủ-Vị (everyone respects) [sb]. Lưu ý: Trong văn nói thân mật có thể dùng who hoặc lược bỏ (Ø), nhưng trong ngữ cảnh phỏng vấn trang trọng, whom là chuẩn xác nhất [sb].","acc":["whom"]},{"n":6,"type":"mc","opts":["that","whose"],"ans":"whose","exp":"Đại từ sở hữu whose bổ nghĩa cho danh từ \"deadlines\" của \"projects\" (các dự án mà hạn chót của chúng rất gấp) [sb].","acc":["whose"]},{"n":7,"type":"mc","opts":["who","which"],"ans":"which","exp":"Đại từ quan hệ which làm tân ngữ chỉ vật bổ nghĩa cho danh từ \"mobile app\" [sb].","acc":["which"]},{"n":8,"type":"mc","opts":["whose","whom"],"ans":"whose","exp":"Đại từ chỉ sự sở hữu whose bổ nghĩa cho danh từ đi sau là \"main purpose\" (ứng dụng mà mục đích chính của nó là...) [sb].","acc":["whose"]},{"n":9,"type":"mc","opts":["who","whom"],"ans":"who","exp":"Đại từ quan hệ who làm chủ ngữ của mệnh đề quan hệ bổ nghĩa cho \"The users\", theo sau trực tiếp là động từ chia ở quá khứ \"tested\". Vì làm chủ ngữ nên không thể lược bỏ [sb].","acc":["who"]},{"n":10,"type":"mc","opts":["which","that"],"ans":"which","exp":"Tương tự câu (1), phía trước có dấu phẩy bổ nghĩa cho \"our development team\" (đối tượng đã xác định bằng tính từ sở hữu \"our\"), do đó đây là mệnh đề không xác định và không được dùng \"that\" [sb].","acc":["which"]}]},{"key":"6A","section":"Chuyên đề 6: Cấu trúc so sánh","title":"Bài tập 6A: Travel Planning","intro":"Anna và Ben đang bàn bạc lựa chọn điểm đến du lịch giữa Đà Lạt, Phú Quốc và Sa Pa. Chọn từ thích hợp:","kind":"dialogue","lines":["Anna: I can't wait for our summer holiday! Which place is (1) [[1]] for a 3-day trip: Da Lat, Phu Quoc, or Sa Pa?","Ben: Well, Da Lat is (2) [[2]] than Sa Pa during summers, but Sa Pa is much (3) [[3]].","Anna: I don't like freezing cold weather. Is Phu Quoc (4) [[4]] Ho Chi Minh City?","Ben: No, Phu Quoc is right by the ocean, so it is (5) [[5]] the city. In fact, it has (6) [[6]] beaches in Vietnam!","Anna: That sounds wonderful! But a trip to Phu Quoc is (7) [[7]] than going to Da Lat because we have to buy plane tickets.","Ben: True. Flight tickets are (8) [[8]] if we book them early, but it is still quite costly.","Anna: What about the food? I heard Da Lat's street food is (9) [[9]] Sapa's.","Ben: Definitely! For me, Da Lat has (10) [[10]] food among the three. Plus, the hotels there are (11) [[11]] the ones in Phu Quoc.","Anna: Great. So, Da Lat is (12) [[12]] option that still offers great weather and food. Let's go there!"],"qs":[{"n":1,"type":"mc","opts":["better","best","good"],"ans":"better","exp":"Cần một dạng so sánh hơn để so sánh giữa ba địa điểm du lịch cụ thể được đưa ra trong câu hỏi lựa chọn (Which is better: A, B, or C?).","acc":["better"]},{"n":2,"type":"mc","opts":["more crowded","as crowded as"],"ans":"more crowded","exp":"\"Crowded\" là tính từ dài hai âm tiết. Do phía sau có liên từ \"than\" nên cấu trúc bắt buộc là \"more crowded than\".","acc":["more crowded"]},{"n":3,"type":"mc","opts":["colder","more cold"],"ans":"colder","exp":"\"Cold\" là tính từ ngắn (một âm tiết), nên ta thêm đuôi -er để tạo dạng so sánh hơn \"colder\".","acc":["colder"]},{"n":4,"type":"mc","opts":["as hot as","hotter"],"ans":"as hot as","exp":"Câu so sánh bằng dạng nghi vấn: \"Is A as hot as B?\" (Phú Quốc có nóng bằng TP.HCM không?).","acc":["as hot as"]},{"n":5,"type":"mc","opts":["less hot than","hot than"],"ans":"less hot than","exp":"Cấu trúc so sánh kém hơn với tính từ ngắn \"hot\": \"less hot than\" (ít nóng hơn).","acc":["less hot than"]},{"n":6,"type":"mc","opts":["the most beautiful","more beautiful"],"ans":"the most beautiful","exp":"So sánh nhất với tính từ dài \"beautiful\" để chỉ Phú Quốc có những bãi biển đẹp nhất cả nước.","acc":["the most beautiful"]},{"n":7,"type":"mc","opts":["the most expensive","more expensive"],"ans":"more expensive","exp":"So sánh hơn với tính từ dài \"expensive\", có \"than\" đi kèm ở vế sau.","acc":["more expensive"]},{"n":8,"type":"mc","opts":["least expensive","less expensive"],"ans":"less expensive","exp":"Cấu trúc so sánh kém hơn: \"less + Adj + than\". Tuy vế sau lược bỏ \"than\" vì ngữ cảnh đã rõ ràng, ta vẫn dùng \"less expensive\" để chỉ giá vé sẽ \"ít đắt đỏ hơn\".","acc":["less expensive"]},{"n":9,"type":"mc","opts":["as delicious as","more delicious"],"ans":"as delicious as","exp":"Cấu trúc [12]] to worry about Mr. Harris's exam yesterday at all!","John: Exactly! I would have fired him first!"],"qs":[{"n":1,"type":"mc","opts":["studied","had studied"],"ans":"had studied","exp":"Sự việc \"học bài\" là giả định trái ngược với quá khứ (tuần trước John đã không học chăm), nên mệnh đề If chia ở thì Quá khứ hoàn thành (Loại 3).","acc":["had studied"]},{"n":2,"type":"mc","opts":["passed","would have passed"],"ans":"would have passed","exp":"Mệnh đề kết quả của câu điều kiện loại 3, diễn tả một kết quả giả định đã không xảy ra trong quá khứ (lẽ ra đã đỗ kỳ thi ngày hôm qua).","acc":["would have passed"]},{"n":3,"type":"mc","opts":["am","were"],"ans":"were","exp":"Lời khuyên giả định trái với thực tế ở hiện tại (Sarah không thể là John được - Câu điều kiện loại 2). Theo quy tắc, dùng were cho mọi ngôi.","acc":["were"]},{"n":4,"type":"mc","opts":["would ask","will ask"],"ans":"would ask","exp":"Mệnh đề kết quả của câu điều kiện loại 2, dùng cấu trúc would + V-bare.","acc":["would ask"]},{"n":5,"type":"mc","opts":["can","could"],"ans":"could","exp":"Câu ước Wish trái ngược với năng lực thực tế ở hiện tại (thực tế John không thể làm thế). Ta dùng dạng quá khứ của can là could.","acc":["could"]},{"n":6,"type":"mc","opts":["doesn't have","didn't have"],"ans":"didn't have","exp":"Giả định trái với hiện thực ở hiện tại (thực tế thầy Harris đang rất nghiêm khắc và có nội quy chặt chẽ). Mệnh đề If lùi về thì Quá khứ đơn (Loại 2).","acc":["didn't have"]},{"n":7,"type":"mc","opts":["might let","let"],"ans":"might let","exp":"Mệnh đề kết quả của câu điều kiện loại 2 chỉ một khả năng nhỏ có thể xảy ra: sử dụng might + V-bare.","acc":["might let"]},{"n":8,"type":"mc","opts":["win","won"],"ans":"won","exp":"Câu hỏi giả định một việc không có thật ở hiện tại (trúng số một triệu đô ngay lúc này). Sử dụng thì Quá khứ đơn trong mệnh đề điều kiện (Loại 2).","acc":["won"]},{"n":9,"type":"mc","opts":["had","would have"],"ans":"had","exp":"Mệnh đề If của câu điều kiện loại 2: \"If I had that much money\".","acc":["had"]},{"n":10,"type":"mc","opts":["would buy","bought"],"ans":"would buy","exp":"Mệnh đề kết quả của câu điều kiện loại 2 chỉ hành động giả định: \"I would buy a private school\".","acc":["would buy"]},{"n":11,"type":"mc","opts":["bought","had bought"],"ans":"had bought","exp":"Đây là giả định trái ngược với sự thật trong quá khứ (mua trường từ năm ngoái). Mệnh đề If phải chia ở thì Quá khứ hoàn thành (Loại 3).","acc":["had bought"]},{"n":12,"type":"mc","opts":["wouldn't have had","didn't have"],"ans":"wouldn't have had","exp":"Mệnh đề kết quả của câu điều kiện loại 3 diễn tả một sự tiếc nuối giả định trong quá khứ (đã không phải lo lắng về bài kiểm tra hôm qua).","acc":["wouldn't have had"]}]},{"key":"9A","section":"Chuyên đề 9: Lời nói gián tiếp","title":"Bài tập 9A: Office Gossip","intro":"Laura đang kể lại cho Peter nghe về những gì cô nghe được từ Giám đốc sáng nay. Chọn từ thích hợp:","kind":"dialogue","lines":["Laura: Peter, did you hear the big news? I ran into Mr. Vance this morning. He (1) [[1]] that some major changes were coming to our department.","Peter: Really? What did he say?","Laura: He said that the company (2) [[2]] expand our project next month. He also added that he (3) [[3]] a new team leader.","Peter: Oh! Did he mention who it was?","Laura: No, he (4) [[4]] that he couldn't reveal the name yet. But he assured me that the decision (5) [[5]] by the end of this week.","Peter: Wow. I hope it’s you! By the way, did he talk about our budget?","Laura: Yes. He said that our budget (6) [[6]] the previous week, so we don't have to worry about expenses.","Peter: That's a relief. Hey, look at that email from HR. It says, 'All employees (7) [[7]] their reports today.'","Laura: Oh! The HR manager just told me that we (8) [[8]] them before 5 PM today, so we should go back to work!"],"qs":[{"n":1,"type":"mc","opts":["said me","told me","said to"],"ans":"told me","exp":"Động từ tell bắt buộc có tân ngữ chỉ người đi kèm ngay phía sau (told me) [sb]. Động từ say không đi trực tiếp với tân ngữ chỉ người như vậy (say to me) [sb].","acc":["told me"]},{"n":2,"type":"mc","opts":["is going to","was going to"],"ans":"was going to","exp":"Tường thuật câu trực tiếp có cấu trúc tương lai gần \"is going to\" [sb]. Vì động từ tường thuật ở quá khứ (said), ta lùi thì \"is\" thành was going to [sb].","acc":["was going to"]},{"n":3,"type":"mc","opts":["has chosen","had chosen","chooses"],"ans":"had chosen","exp":"Tường thuật câu trực tiếp ở thì Hiện tại hoàn thành (\"I have chosen...\") [sb]. Ta lùi thì về Quá khứ hoàn thành (had chosen) [sb].","acc":["had chosen"]},{"n":4,"type":"mc","opts":["said","told"],"ans":"said","exp":"Phía sau không có tân ngữ chỉ người nhận tác động, nên ta sử dụng động từ tường thuật said thay vì told [sb].","acc":["said"]},{"n":5,"type":"mc","opts":["will make","would be made"],"ans":"would be made","exp":"Câu gốc mang ý tương lai đơn bị động: \"The decision will be made...\" [sb]. Khi tường thuật, ta lùi trợ động từ \"will\" thành would [sb].","acc":["would be made"]},{"n":6,"type":"mc","opts":["had been increased","has increased"],"ans":"had been increased","exp":"Câu gốc dùng thì Quá khứ đơn bị động (\"Our budget was increased last week...\") kết hợp trạng từ chỉ thời gian đã được lùi thành \"the previous week\" [sb]. Ta lùi động từ về Quá khứ hoàn thành bị động (had been increased) [sb].","acc":["had been increased"]},{"n":7,"type":"mc","opts":["must submit","had to submit"],"ans":"must submit","exp":"Quy tắc đặc biệt: Động từ tường thuật \"says\" ở thì hiện tại đơn, nên toàn bộ động từ trong mệnh đề gián tiếp giữ nguyên không lùi thì [sb]. Do đó ta chọn must submit.","acc":["must submit"]},{"n":8,"type":"mc","opts":["must submit","had to submit"],"ans":"had to submit","exp":"Động từ tường thuật \"told\" ở quá khứ [sb]. Ta lùi động từ khuyết thiếu \"must\" thành cụm từ tương đương trong quá khứ là had to submit [sb].","acc":["had to submit"]}]},{"key":"9B","section":null,"title":"Bài tập 9B: Reporting a Job Interview","intro":"Mark đang kể lại cho Emily nghe về cuộc phỏng vấn xin việc đầy căng thẳng của mình. Chọn từ thích hợp:","kind":"dialogue","lines":["Emily: Mark! How did the interview go? What did Ms. Clark ask you?","Mark: It was intense! First, she asked me why I (1) [[1]] my previous job.","Emily: That's a standard question. What did she ask next?","Mark: She looked at my portfolio and asked (2) [[2]] in Python.","Emily: And you can, right?","Mark: Yes, of course. Then, she wanted to know how many projects I (3) [[3]] so far.","Emily: Did she ask you any personal questions?","Mark: Yes, she asked where (4) [[4]] myself in five years. I hate that question!","Emily: Haha, everyone does. Did she give you any instructions or advice?","Mark: Yes, she told me (5) [[5]] about the technical test too much.","Emily: That's a good sign!","Mark: Indeed. At the end, she advised me (6) [[6]] more about their new international clients before the second round.","Emily: Excellent. Did she say when they (7) [[7]] you?","Mark: Yes, she told me that they (8) [[8]] me the following day. That means tomorrow!"],"qs":[{"n":1,"type":"mc","opts":["did I leave","had left","leave"],"ans":"had left","exp":"Tường thuật câu hỏi Wh-. Áp dụng quy tắc: (1) Lùi thì Quá khứ đơn trong câu hỏi gốc (\"Why did you leave...?\") về Quá khứ hoàn thành (had left), và (2) đưa về trật tự câu trần thuật (S + V), không dùng trợ động từ đảo ngữ did I leave [sb].","acc":["had left"]},{"n":2,"type":"mc","opts":["if I can code","if I could code"],"ans":"if I could code","exp":"Tường thuật câu hỏi Yes/No (\"Can you code...?\") [sb]. Ta dùng liên từ nối if, đưa câu hỏi về trật tự câu trần thuật (S + V) và lùi động từ khuyết thiếu \"can\" thành could [sb].","acc":["if I could code"]},{"n":3,"type":"mc","opts":["have managed","had managed"],"ans":"had managed","exp":"Tường thuật câu hỏi gốc ở thì Hiện tại hoàn thành (\"How many projects have you managed...?\") [sb]. Ta lùi về thì Quá khứ hoàn thành (had managed) và bỏ đảo ngữ trợ động từ [sb].","acc":["had managed"]},{"n":4,"type":"mc","opts":["did I see","I saw"],"ans":"I saw","exp":"Tường thuật câu hỏi gốc ở thì Hiện tại đơn (\"Where do you see yourself...?\") [sb]. Ta bỏ trợ động từ hỏi \"do\", đưa về trật tự S + V và lùi động từ chính \"see\" thành quá khứ đơn saw [sb].","acc":["I saw"]},{"n":5,"type":"mc","opts":["not to worry","to not worry"],"ans":"not to worry","exp":"Cấu trúc tường thuật câu mệnh lệnh/yêu cầu phủ định: tell + Object + not + to-V (told me not to worry) [sb].","acc":["not to worry"]},{"n":6,"type":"mc","opts":["to research","research"],"ans":"to research","exp":"Cấu trúc tường thuật lời khuyên: advise + Object + to-V (advised me to research) [sb].","acc":["to research"]},{"n":7,"type":"mc","opts":["will contact","would contact"],"ans":"would contact","exp":"Tường thuật câu hỏi Wh- ở tương lai (\"When will they contact you?\") [sb]. Ta bỏ đảo ngữ của trợ động từ và lùi \"will\" thành would [sb].","acc":["would contact"]},{"n":8,"type":"mc","opts":["will call","would call"],"ans":"would call","exp":"Động từ tường thuật \"told me\" ở quá khứ, nên ta lùi \"will call\" thành would call [sb]. Trạng ngữ chỉ thời gian cũng đã được lùi thành \"the following day\" [sb].","acc":["would call"]}]},{"key":"HT1","section":"CHƯƠNG II — 1. Bài tập hội thoại tổng hợp","title":"Hội thoại 1: Đặt phòng và Chuẩn bị hành lý (Lily & James)","intro":"","kind":"dialogue","lines":["Lily: James, hurry up! The taxi will be here in ten minutes. (1) [[1]] some luggage left in the hallway.","James: Don’t worry, Lily. I'm checking everything now. Look at (2) [[2]] passports in my hand. I have both of them.","Lily: Great. But (3) [[3]] any sunscreen in your backpack?","James: Oh, we only have (4) [[4]] sunscreen left in this small bottle. We should buy (5) [[5]] new bottle at (6) [[6]] airport.","Lily: Good idea. What about (7) [[7]] cash? Did you withdraw (8) [[8]] money from the bank?","James: Yes, I got some. Oh, wait! Look over there on the kitchen counter. Is (9) [[9]] your camera?","Lily: Ah, yes! Thank goodness you saw it. I almost forgot (10) [[10]] most important thing for our trip!"],"qs":[{"n":1,"type":"mc","opts":["There is","There are"],"ans":"There is","exp":"Đi với danh từ không đếm được \"luggage\" (hành lý).","acc":["There is"]},{"n":2,"type":"mc","opts":["this","these"],"ans":"these","exp":"Chỉ các vật số nhiều ở vị trí gần sát người nói (\"passports in my hand\" - hộ chiếu trên tay tôi).","acc":["these"]},{"n":3,"type":"mc","opts":["is there","are there"],"ans":"is there","exp":"Câu hỏi Yes/No đi với danh từ không đếm được \"sunscreen\" (kem chống nắng).","acc":["is there"]},{"n":4,"type":"mc","opts":["a little","a few"],"ans":"a little","exp":"Lượng từ chỉ một ít (đủ dùng) đi với danh từ không đếm được \"sunscreen\".","acc":["a little"]},{"n":5,"type":"mc","opts":["a","some"],"ans":"some","exp":"Trong câu này \"bottle\" là danh từ đếm được số ít, nhưng vì Lily nói \"buy some new bottle\" (mang nghĩa mua một vài chai hoặc mua một ít - ở đây James sửa lại thành danh từ đếm được, tuy nhiên đáp án đúng chuẩn tự nhiên là some khi đi với danh từ làm lượng chung, hoặc mạo từ a để chỉ \"một chai mới\". Đoạn hội thoại ghi \"buy... new bottle\", đáp án đúng là a (mua một chai mới).","acc":["some","a"]},{"n":6,"type":"mc","opts":["a","the"],"ans":"the","exp":"Danh từ \"airport\" (sân bay) đã được xác định trong bối cảnh chuyến đi của hai người (họ đều biết rõ họ sẽ ra sân bay nào).","acc":["the"]},{"n":7,"type":"mc","opts":["Ø","the"],"ans":"Ø","exp":"Nói về \"cash\" (tiền mặt - danh từ không đếm được) một cách chung chung.","acc":["Ø"]},{"n":8,"type":"mc","opts":["many","much"],"ans":"much","exp":"Dùng trong câu hỏi với danh từ không đếm được \"money\".","acc":["much"]},{"n":9,"type":"mc","opts":["that","those"],"ans":"that","exp":"Chỉ một vật số ít ở cách xa người nói (\"over there on the kitchen counter\" - ở đằng kia trên bệ bếp).","acc":["that"]},{"n":10,"type":"mc","opts":["a","the"],"ans":"the","exp":"Dùng so sánh nhất \"the most important thing\".","acc":["the"]}]},{"key":"HT2","section":null,"title":"Hội thoại 2: Định hướng Nghề nghiệp (Kevin & Helen)","intro":"","kind":"dialogue","lines":["Kevin: Hello Ms. Helen. I am (11) [[11]] for a software engineer position, but I feel so nervous.","Helen: Hello Kevin! First, you should avoid (12) [[12]] yourself out. (13) [[13]] early is the key to success.","Kevin: What (14) [[14]] do to make a good impression?","Helen: Well, you (15) [[15]] dress formally for the interview. It is a strict rule in that company.","Kevin: Understood. Should I (16) [[16]] about my university projects?","Helen: Yes, but try (17) [[17]] concise. Don't make your answers too long.","Kevin: Yesterday, I (18) [[18]] my online portfolio. I hope they like it.","Helen: Excellent! You (19) [[19]] double-check all the links in your portfolio before sending it.","Kevin: Thank you! I really (20) [[20]] them what I can do."],"qs":[{"n":11,"type":"mc","opts":["planning to apply","planning applying"],"ans":"planning to apply","exp":"Động từ plan bắt buộc đi với To-Infinitive.","acc":["planning to apply"]},{"n":12,"type":"mc","opts":["to stress","stressing"],"ans":"stressing","exp":"Động từ avoid (tránh) bắt buộc đi với danh động từ V-ing.","acc":["stressing"]},{"n":13,"type":"mc","opts":["Preparing","To prepare"],"ans":"Preparing","exp":"Danh động từ (Gerund) đứng đầu câu làm chủ ngữ chỉ hành động (việc chuẩn bị sớm).","acc":["Preparing"]},{"n":14,"type":"mc","opts":["must I","should I"],"ans":"should I","exp":"Dùng should để hỏi xin lời khuyên nhẹ nhàng, lịch sự.","acc":["should I"]},{"n":15,"type":"mc","opts":["have to","are supposed to"],"ans":"have to","exp":"Diễn tả một quy định, nghĩa vụ bắt buộc khách quan từ phía công ty.","acc":["have to"]},{"n":16,"type":"mc","opts":["keep on talking","keep on to talk"],"ans":"keep on talking","exp":"Đứng sau giới từ on (trong cụm keep on), động từ phải
