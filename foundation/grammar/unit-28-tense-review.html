<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 28 Grammar – Bài tập tương tác về các thì</title>
<style>
  :root{
    --line:#d6d6d6; --ink:#1a1a1a; --muted:#5b5b5b;
    --ok:#1a7f37; --okbg:#eaf6ec; --no:#b3261e; --nobg:#fdeceb;
    --accent:#1f4e79; --bg:#fff;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
    font-size:17px; line-height:1.65;
  }
  .wrap{max-width:860px;margin:0 auto;padding:0 16px}
  header{
    position:sticky; top:0; z-index:50; background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
  #progress{font-weight:700;flex:1 1 auto;min-width:150px;font-size:15px}
  #progress .warn{color:var(--no);font-weight:400;display:block;font-size:13px}
  button{
    font:inherit;font-size:16px;font-weight:600;cursor:pointer;
    border:1px solid var(--accent); background:var(--accent); color:#fff;
    border-radius:6px; padding:11px 18px; min-height:46px;
  }
  button.ghost{background:#fff;color:var(--accent)}
  button[disabled]{opacity:.45;cursor:not-allowed}
  h1{font-size:22px;margin:22px 0 4px}
  .sub{color:var(--muted);margin:0 0 18px;font-size:15px}
  h2{font-size:19px;margin:34px 0 0;padding-top:18px;border-top:2px solid var(--ink)}
  h3{font-size:17px;margin:22px 0 6px}
  .ctx{color:var(--muted);font-style:italic;margin:2px 0}
  .req{margin:6px 0 14px}
  .ex{border:1px solid var(--line);border-radius:8px;padding:14px 14px 6px;margin:12px 0 26px}
  .line{margin:0 0 12px}
  .sp{font-weight:700}
  .qitem{margin:0 0 16px}
  .qnum{font-weight:700;margin-right:6px}
  input.blank{
    font:inherit;font-size:16px;padding:7px 9px;border:1px solid #9a9a9a;border-radius:5px;
    min-width:150px;width:170px;max-width:100%;background:#fff;color:var(--ink);
  }
  input.wide{width:100%;display:block;margin-top:7px}
  input.blank:focus{outline:2px solid var(--accent);outline-offset:1px}
  input.blank:disabled{background:#f4f4f4;color:var(--ink);-webkit-text-fill-color:var(--ink);opacity:1}
  input.blank.right{border-color:var(--ok);background:var(--okbg)}
  input.blank.wrong{border-color:var(--no);background:var(--nobg)}
  .opts{list-style:none;margin:6px 0 0;padding:0}
  .opts li{margin:0 0 2px}
  .opts label{display:block;padding:9px 8px;border-radius:5px;cursor:pointer;min-height:44px}
  .opts label:hover{background:#f2f5f8}
  .opts input{margin-right:9px;transform:scale(1.25)}
  .opts label.right{background:var(--okbg)}
  .opts label.wrong{background:var(--nobg)}
  .fb{border-top:1px dashed var(--line);margin-top:14px;padding-top:10px}
  .fb h4{margin:0 0 8px;font-size:16px}
  .fbi{padding:9px 0;border-bottom:1px solid #eee;font-size:16px}
  .fbi:last-child{border-bottom:0}
  .tag{display:inline-block;font-weight:700;font-size:13px;padding:2px 8px;border-radius:4px;margin-right:8px}
  .tag.y{background:var(--okbg);color:var(--ok)}
  .tag.n{background:var(--nobg);color:var(--no)}
  .fbi .k{color:var(--muted)}
  .score{border:2px solid var(--accent);border-radius:8px;padding:14px 16px;margin:18px 0}
  .score .big{font-size:26px;font-weight:700;color:var(--accent)}
  .foot{margin:26px 0 60px;display:flex;gap:10px;flex-wrap:wrap}
  .hidden{display:none}
  @media (max-width:600px){
    body{font-size:16px}
    .wrap{padding:0 12px}
    input.blank{width:100%;display:block;margin:6px 0}
    button{width:100%}
    .bar{gap:8px}
    .bar .btns{display:flex;gap:8px;width:100%}
  }
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div id="progress">Đã làm 0/157 câu</div>
    <div class="btns">
      <button id="submitTop" disabled>Nộp bài</button>
      <button id="resetTop" class="ghost">Làm lại</button>
    </div>
  </div>
</header>

<main class="wrap">
  <h1>Unit 28 Grammar — Comprehensive Tense Review</h1>
  <p class="sub">Bài tập tương tác. Tổng số câu: <strong>157</strong>. Học sinh làm hết tất cả các câu thì nút <strong>Nộp bài</strong> mới bấm được. Đáp án và giải thích chỉ hiện ra sau khi nộp bài.</p>
  <div id="scoreBox"></div>
  <div id="content"></div>
  <div class="foot">
    <button id="submitBottom" disabled>Nộp bài</button>
    <button id="resetBottom" class="ghost">Làm lại</button>
  </div>
</main>

/* ---------- tiện ích ---------- */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function md(s){
  return esc(s).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
               .replace(/\*([^*]+)\*/g,"<em>$1</em>");
}

/* ---------- chuẩn hoá & chấm bài ---------- */
function prep(s){
  s = String(s).toLowerCase();
  s = s.replace(/[\u2018\u2019\u02BC\u00B4`]/g,"'").replace(/[\u201C\u201D]/g,'"');
  s = s.replace(/\bwhether\b/g,"if");
  /* viết tắt thiếu dấu nháy đơn */
  s = s.replace(/\bwont\b/g,"will not").replace(/\bcannot\b/g,"can not").replace(/\bcant\b/g,"can not");
  s = s.replace(/\b(did|does|do|is|are|was|were|has|have|had|would|could|should|must)nt\b/g,"$1 not");
  s = s.replace(/\bim\b/g,"i am").replace(/\bive\b/g,"i have")
       .replace(/\byoure\b/g,"you are").replace(/\byouve\b/g,"you have")
       .replace(/\btheyre\b/g,"they are").replace(/\btheyve\b/g,"they have")
       .replace(/\bweve\b/g,"we have");
  s = s.replace(/\b(it|he|she|that|there|who|what)s\b/g,"$1's");
  /* viết tắt có dấu nháy đơn */
  s = s.replace(/won't/g,"will not").replace(/n't/g," not");
  s = s.replace(/'ll/g," will").replace(/'ve/g," have").replace(/'re/g," are").replace(/'m/g," am");
  return s;
}
function clean(v){
  return v.replace(/[^a-z0-9\u00C0-\u024F\u1E00-\u1EFF ]/g," ").replace(/\s+/g," ").trim();
}
function forms(s){
  var b = prep(s), out = [];
  var sRep = [" is ", " has ", "s"], dRep = [" had ", " would "];
  for (var i=0;i<sRep.length;i++){
    for (var j=0;j<dRep.length;j++){
      var v = b.split("'s").join(sRep[i]).split("'d").join(dRep[j]);
      var c = clean(v);
      if (out.indexOf(c)<0) out.push(c);
      var c2 = clean(v.replace(/\bthat\b/g," "));
      if (out.indexOf(c2)<0) out.push(c2);
    }
  }
  return out;
}
function accepted(q){
  var list = [];
  (q.answers||[]).forEach(function(a){
    list.push(a);
    if (q.subj) list.push(q.subj + " " + a);
  });
  var set = [];
  list.forEach(function(a){
    forms(a).forEach(function(f){ if(f && set.indexOf(f)<0) set.push(f); });
  });
  return set;
}
function isCorrect(q, val){
  if (!val || !val.trim()) return false;
  var acc = accepted(q), mine = forms(val);
  for (var i=0;i<mine.length;i++) if (mine[i] && acc.indexOf(mine[i])>=0) return true;
  return false;
}

/* ---------- dựng đề ---------- */
var Q = [];   // danh sách phẳng mọi câu hỏi
function blankHTML(id, wide){
  return '<input class="blank'+(wide?' wide':'')+'" type="text" id="'+id+'" '+
         'autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" '+
         'placeholder="Điền câu trả lời">';
}
function render(){
  var root = document.getElementById("content"), html = "";
  DATA.forEach(function(g, gi){
    html += '<h2>'+esc(g.group)+'</h2>';
    g.exercises.forEach(function(ex){
      html += '<h3>'+esc(ex.title)+'</h3>';
      if (ex.context) html += '<p class="ctx">'+esc(ex.context)+'</p>';
      if (ex.req) html += '<p class="req">'+md(ex.req)+'</p>';
      html += '<div class="ex" id="ex-'+ex.id+'">';

      if (ex.type === "dialogue"){
        ex.lines.forEach(function(l){
          var t = md(l.t).replace(/\[\[(\d+)\]\]/g, function(m, n){
            return blankHTML("i-"+ex.id+"-"+n, false);
          });
          html += '<p class="line">'+(l.sp?'<span class="sp">'+esc(l.sp)+':</span> ':'')+t+'</p>';
        });
      } else if (ex.type === "items"){
        ex.questions.forEach(function(q){
          var t = md(q.t).replace(/\[\[(\d+)\]\]/g, function(m, n){
            return blankHTML("i-"+ex.id+"-"+n, false);
          });
          html += '<p class="qitem"><span class="qnum">'+q.n+'.</span>'+t+'</p>';
        });
      } else if (ex.type === "mc"){
        ex.questions.forEach(function(q){
          html += '<div class="qitem"><div><span class="qnum">'+q.n+'.</span>'+md(q.t)+'</div><ul class="opts">';
          q.opts.forEach(function(o, k){
            var id = "i-"+ex.id+"-"+q.n+"-"+k;
            html += '<li><label id="lb-'+id+'"><input type="radio" name="r-'+ex.id+'-'+q.n+'" id="'+id+'" value="'+k+'">'+
                    esc("ABCD"[k]+". "+o)+'</label></li>';
          });
          html += '</ul></div>';
        });
      } else if (ex.type === "fix"){
        ex.questions.forEach(function(q){
          html += '<div class="qitem"><div><span class="qnum">'+q.n+'.</span>'+md(q.t)+'</div>'+
                  blankHTML("i-"+ex.id+"-"+q.n, true)+'</div>';
        });
      } else if (ex.type === "rewrite"){
        ex.questions.forEach(function(q){
          html += '<div class="qitem"><div><span class="qnum">'+q.n+'.</span>'+md(q.t)+' '+md(q.hint||"")+'</div>'+
                  blankHTML("i-"+ex.id+"-"+q.n, true)+'</div>';
        });
      }

      html += '<div class="fb hidden" id="fb-'+ex.id+'"></div></div>';
      ex.questions.forEach(function(q){
        Q.push({ex:ex, q:q, type:ex.type, key:"i-"+ex.id+"-"+q.n});
      });
    });
  });
  root.innerHTML = html;
}

/* ---------- tiến độ ---------- */
function answeredCount(){
  var c = 0;
  Q.forEach(function(item){
    if (item.type === "mc"){
      var sel = document.querySelector('input[name="r-'+item.ex.id+'-'+item.q.n+'"]:checked');
      if (sel) c++;
    } else {
      var el = document.getElementById(item.key);
      if (el && el.value.trim()) c++;
    }
  });
  return c;
}
var submitted = false;
function updateProgress(){
  var c = answeredCount(), done = (c === TOTAL);
  var p = document.getElementById("progress");
  p.innerHTML = "Đã làm " + c + "/" + TOTAL + " câu" +
    (done || submitted ? "" : '<span class="warn">Còn ' + (TOTAL - c) + ' câu chưa làm — làm hết mới nộp bài được.</span>');
  ["submitTop","submitBottom"].forEach(function(id){
    document.getElementById(id).disabled = submitted || !done;
  });
}

/* ---------- nộp bài ---------- */
function submitAll(){
  if (submitted || answeredCount() !== TOTAL) return;
  submitted = true;
  var correct = 0;
  var fbs = {};

  Q.forEach(function(item){
    var ex = item.ex, q = item.q, ok = false, mine = "";
    if (item.type === "mc"){
      var sel = document.querySelector('input[name="r-'+ex.id+'-'+q.n+'"]:checked');
      var pick = sel ? parseInt(sel.value,10) : -1;
      ok = (pick === q.correct);
      mine = pick >= 0 ? "ABCD"[pick] + ". " + q.opts[pick] : "";
      q.opts.forEach(function(o,k){
        var lb = document.getElementById("lb-i-"+ex.id+"-"+q.n+"-"+k);
        var rd = document.getElementById("i-"+ex.id+"-"+q.n+"-"+k);
        if (rd) rd.disabled = true;
        if (k === q.correct) lb.className = "right";
        else if (k === pick) lb.className = "wrong";
      });
    } else {
      var el = document.getElementById(item.key);
      mine = el.value.trim();
      ok = isCorrect(q, mine);
      el.disabled = true;
      el.className = "blank" + (item.type==="fix"||item.type==="rewrite" ? " wide" : "") + (ok ? " right" : " wrong");
    }
    if (ok) correct++;

    var ans = item.type === "mc"
      ? "ABCD"[q.correct] + ". " + q.opts[q.correct]
      : (q.answers || []).join("  /  ");
    var row = '<div class="fbi"><span class="tag '+(ok?"y":"n")+'">'+(ok?"Đúng":"Sai")+'</span>'+
              '<strong>Câu '+q.n+'.</strong> ' +
              (item.type === "mc" ? "" : '<span class="k">Học sinh đã viết:</span> '+(mine?esc(mine):"(bỏ trống)")+'<br>') +
              '<span class="k">Đáp án:</span> <strong>'+esc(ans)+'</strong><br>' +
              '<span class="k">Giải thích:</span> '+md(q.explain)+'</div>';
    (fbs[ex.id] = fbs[ex.id] || []).push(row);
  });

  DATA.forEach(function(g){
    g.exercises.forEach(function(ex){
      var box = document.getElementById("fb-"+ex.id);
      box.className = "fb";
      box.innerHTML = '<h4>Đáp án &amp; giải thích</h4>' + (fbs[ex.id]||[]).join("");
    });
  });

  var score = (correct / TOTAL * 10);
  document.getElementById("scoreBox").innerHTML =
    '<div class="score"><div class="big">Điểm: ' + score.toFixed(2) + '/10</div>' +
    '<div>Số câu đúng: <strong>' + correct + '/' + TOTAL + '</strong>. ' +
    'Đáp án và giải thích đã hiện ở cuối từng bài tập.</div></div>';

  updateProgress();
  window.scrollTo(0, 0);
}

/* ---------- làm lại ---------- */
function resetAll(){
  submitted = false;
  document.getElementById("scoreBox").innerHTML = "";
  var ins = document.querySelectorAll("input.blank");
  for (var i=0;i<ins.length;i++){
    ins[i].disabled = false;
    ins[i].value = "";
    ins[i].className = ins[i].classList.contains("wide") ? "blank wide" : "blank";
  }
  var rds = document.querySelectorAll('input[type="radio"]');
  for (var j=0;j<rds.length;j++){ rds[j].disabled = false; rds[j].checked = false; }
  var lbs = document.querySelectorAll(".opts label");
  for (var k=0;k<lbs.length;k++) lbs[k].className = "";
  var fb = document.querySelectorAll(".fb");
  for (var m=0;m<fb.length;m++){ fb[m].className = "fb hidden"; fb[m].innerHTML = ""; }
  updateProgress();
  window.scrollTo(0, 0);
}

/* ---------- khởi động ---------- */
render();
document.getElementById("content").addEventListener("input", updateProgress);
document.getElementById("content").addEventListener("change", updateProgress);
document.getElementById("submitTop").addEventListener("click", submitAll);
document.getElementById("submitBottom").addEventListener("click", submitAll);
document.getElementById("resetTop").addEventListener("click", resetAll);
document.getElementById("resetBottom").addEventListener("click", resetAll);
updateProgress();
</script>
</body>
</html>
