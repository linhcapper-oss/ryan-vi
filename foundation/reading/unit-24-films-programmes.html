<title>Unit 24 - Vocabulary &amp; Reading Practice</title>
<style>
  :root{
    --line:#d5d5d5;
    --ink:#1a1a1a;

    --okbg:#eef7f0;
    --nobg:#fdf0ef;
    --bg:#ffffff;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans",Arial,sans-serif;
    font-size:17px;
    line-height:1.6;
  }
  .wrap{max-width:820px;margin:0 auto;padding:0 16px 64px;}

  /* Thanh trạng thái đặt ở TRÊN cùng: bàn phím ảo không bao giờ che */
  .bar{
    position:sticky;top:0;z-index:20;
    background:#fff;border-bottom:1px solid var(--line);
    padding:8px 16px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .bar .prog{font-weight:600;font-size:15px;flex:1 1 auto;}
  .bar .prog small{display:block;font-weight:400;color:var(--muted);font-size:13px;}

  h1{font-size:22px;margin:20px 0 4px;}
  .sub{color:var(--muted);font-size:15px;margin:0 0 20px;}
  h2{font-size:20px;margin:34px 0 8px;padding-top:14px;border-top:2px solid var(--ink);}
  h3{font-size:17px;margin:26px 0 6px;}
  .rubric{color:var(--muted);font-size:15px;margin:0 0 14px;}

  details.passage{border:1px solid var(--line);padding:10px 14px;margin:12px 0 18px;}
  details.passage summary{cursor:pointer;font-weight:600;}
  details.passage p{margin:12px 0;}
  .ptitle{font-weight:600;margin:14px 0 6px;}

  table.bank{border-collapse:collapse;width:100%;margin:10px 0 16px;font-size:15px;}
  table.bank td,table.bank th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;}
  .wordbank{border:1px solid var(--line);padding:10px 12px;margin:10px 0 16px;font-size:15px;}
  table.vocab td.ipa{white-space:nowrap;color:var(--muted);}
  table.vocab td:nth-child(3){white-space:nowrap;}
  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  @media (max-width:520px){
    table.vocab{font-size:14px;}
    table.vocab td,table.vocab th{padding:5px 6px;}
    table.vocab td.ipa{white-space:normal;}
  }

  .q{border-top:1px solid var(--line);padding:14px 0;}
  .q:first-of-type{border-top:none;}
  .qtext{margin:0 0 10px;}
  .qnum{font-weight:700;margin-right:6px;}
  .blank{font-weight:700;letter-spacing:1px;}

  .opts{display:flex;flex-direction:column;gap:8px;}
  .opts.row{flex-direction:row;flex-wrap:wrap;}
  .opt{display:flex;align-items:flex-start;gap:8px;
    border:1px solid var(--line);padding:11px 12px;min-height:46px;cursor:pointer;background:#fff;}
  .opt input{margin:4px 0 0;width:18px;height:18px;flex:0 0 auto;}
  .opts.row .opt{flex:1 1 auto;min-width:120px;justify-content:center;align-items:center;}
  .opt.sel{border-color:var(--ink);border-width:2px;padding:10px 11px;}

  input[type=text],select{
    width:100%;max-width:420px;font-size:16px;font-family:inherit;
    padding:11px 10px;min-height:46px;border:1px solid var(--line);background:#fff;color:var(--ink);
  }
  select{max-width:100%;}

  button{
    font-family:inherit;font-size:16px;font-weight:600;
    padding:11px 18px;min-height:46px;
    border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;
  }
  button.ghost{background:#fff;color:var(--ink);}
  button:disabled{background:#e4e4e4;border-color:#c9c9c9;color:#8a8a8a;cursor:not-allowed;}
  .bar button{padding:8px 14px;min-height:40px;font-size:15px;}

  .actions{margin:34px 0 0;padding-top:18px;border-top:2px solid var(--ink);
    display:flex;gap:12px;flex-wrap:wrap;}
  .actions button{flex:1 1 220px;}

  .fb{margin-top:10px;padding:10px 12px;font-size:15px;border-left:4px solid;}
  .fb.ok{border-color:var(--ok);background:var(--okbg);}
  .fb.no{border-color:var(--no);background:var(--nobg);}
  .fb .verdict{font-weight:700;}
  .fb.ok .verdict{color:var(--ok);}
  .fb.no .verdict{color:var(--no);}
  .fb div{margin-top:4px;}

  #result{display:none;border:2px solid var(--ink);padding:16px;margin:24px 0 0;}
  #result h2{border:none;margin:0 0 8px;padding:0;font-size:20px;}
  #result .score{font-size:34px;font-weight:700;line-height:1.2;}
  #result .detail{color:var(--muted);}
  .hint{color:var(--muted);font-size:14px;margin-top:6px;}

  @media (max-width:520px){
    body{font-size:16px;}
    .wrap{padding:0 12px 72px;}
    .actions button{flex:1 1 100%;}
    .opts.row{flex-direction:column;}
  }
</style>
</head>

    "<b>A.</b> It is seven o'clock on a Friday evening, and the queue outside a cinema on the fourth floor of a Ho Chi Minh City shopping centre reaches all the way past the coffee shops. Fifteen years ago, a scene like this was unusual. Vietnam had fewer than one hundred modern screens, and most of the tickets sold were for foreign films. Today the country has well over a thousand, and the national box office has grown in almost every year since. During the Tet holiday, a successful Vietnamese comedy can now take more money in two weeks than a Hollywood blockbuster released on the same day.",

    "<b>A.</b> For most of television's history, the medium imposed its own rhythm on the audience. A programme was broadcast at a fixed hour, viewers arranged their evening around it, and when the episode ended they had no choice but to wait a week for the next one. The arrival of on-demand platforms dismantled that structure almost overnight. Entire seasons are now uploaded at once, the next episode begins automatically after a countdown of a few seconds, and the decision to stop watching has been quietly transferred from the broadcaster to the individual. This shift has attracted a great deal of academic attention, and a small but rapidly expanding body of research now examines what continuous viewing does to attention, sleep and social behaviour.",
    "<b>B.</b> One of the most cited explanations comes from Dr Elena Marchetti, a media psychologist based in Milan. Her work centres on <i>narrative transportation</i> - the sensation of being so absorbed in a story that awareness of the surrounding environment fades. In a series of laboratory studies, Marchetti found that participants who reported high levels of immersion consistently underestimated how long they had been watching, sometimes by more than an hour. She argues that binge-watching is therefore not primarily a failure of willpower but a predictable consequence of well-constructed storytelling: the more skilfully a plot withholds resolution, the harder it becomes for a viewer to disengage. Cliffhangers, in her phrase, are not a marketing trick added to a drama but part of its architecture.",

function canon(s){
  s = String(s||"").toLowerCase();
  s = s.replace(/[\u2018\u2019\u02BC\u00B4`]/g,"'").replace(/[\u201C\u201D]/g,'"');
  CONTR.forEach(function(p){
    s = s.replace(new RegExp("\\b"+p[0].replace("'","'")+"\\b","g"), p[1]);
  });
  s = s.replace(/[.,;:!?"()\[\]{}\u2013\u2014\-\/\\'*]/g," ");
  s = s.replace(/\s+/g," ").trim();
  s = s.replace(/\bwhether\b/g,"if");
  s = s.replace(/^that\s+/,"");
  s = s.replace(/^(a|an|the)\s+/,"");
  s = s.replace(/\s+(a|an|the)\s+/g," ");
  return s;
}

function acceptedList(q){
  var base = String(q.ans);
  var out = [];
  // "(the) central puzzle" -> "the central puzzle" + "central puzzle"
  if(base.indexOf("(")>-1){
    out.push(base.replace(/[()]/g,""));
    out.push(base.replace(/\([^)]*\)/g,""));
  } else {
    out.push(base);
  }
  (q.alt||[]).forEach(function(a){out.push(a);});
  return out.map(canon).filter(function(v,i,arr){return v && arr.indexOf(v)===i;});
}

function getVal(q){
  if(q.type==="choice"){
    var el = document.querySelector("input[name='"+q.key+"']:checked");
    return el ? el.value : "";
  }
  var node = document.querySelector("[name='"+q.key+"']");
  return node ? node.value.trim() : "";
}

function isCorrect(q){
  var v = getVal(q);
  if(!v) return false;
  if(q.type==="text"){
    var c = canon(v);
    return acceptedList(q).indexOf(c) > -1;
  }
  return v === q.ans;
}

var submitted = false;

function updateProgress(){
  var done = 0;
  ALL.forEach(function(q){ if(getVal(q)) done++; });
  document.getElementById("progText").textContent = "Đã làm "+done+"/"+TOTAL+" câu";
  var ready = (done === TOTAL) && !submitted;
  document.getElementById("submitTop").disabled = !ready;
  document.getElementById("submitBottom").disabled = !ready;
  var hint = document.getElementById("progHint");
  if(submitted){
    hint.textContent = "Học sinh đã nộp bài. Bấm Làm lại để làm lại từ đầu.";
  } else if(done === TOTAL){
    hint.textContent = "Học sinh đã làm đủ tất cả các câu, có thể nộp bài.";
  } else {
    hint.textContent = "Học sinh cần làm hết tất cả các câu thì mới nộp bài được. Còn "+(TOTAL-done)+" câu.";
  }
}

function onEdit(e){
  if(submitted) return;
  if(e.target && e.target.type === "radio"){
    var box = e.target.closest(".opts");
    if(box){ box.querySelectorAll(".opt").forEach(function(l){ l.classList.remove("sel"); }); }
    var opt = e.target.closest(".opt");
    if(opt) opt.classList.add("sel");
  }
  updateProgress();
}
document.getElementById("quiz").addEventListener("input", onEdit);
document.getElementById("quiz").addEventListener("change", onEdit);

function displayAnswer(q){
  if(q.type==="choice" || q.type==="select"){
    if(q.opts && typeof q.opts[0] !== "string"){
      for(var i=0;i<q.opts.length;i++){ if(q.opts[i][0]===q.ans) return q.opts[i][1]; }
    }
    return q.ans;
  }
  return q.ans;
}

function grade(){
  if(submitted) return;
  submitted = true;
  var correct = 0;

  ALL.forEach(function(q){
    var ok = isCorrect(q);
    if(ok) correct++;
    var wrap = document.getElementById("q_"+q.key);
    wrap.querySelectorAll("input, select").forEach(function(el){ el.disabled = true; });
    var fb = wrap.querySelector(".fb");
    var h = "<span class='verdict'>"+(ok?"✓ Đúng":"✗ Sai")+"</span>";
    h += "<div><b>Đáp án:</b> "+esc(displayAnswer(q))+"</div>";
    if(q.type==="text"){
      var acc = acceptedList(q);
      h += "<div><b>Các cách viết được chấp nhận:</b> "+esc(acc.join(" / "))+"</div>";
    }
    if(q.exp){ h += "<div><b>Giải thích:</b> "+q.exp+"</div>"; }
    fb.className = "fb " + (ok?"ok":"no");
    fb.innerHTML = h;
    fb.style.display = "block";
  });

  var score = Math.round((correct/TOTAL)*10*10)/10;
  document.getElementById("scoreLine").textContent = score.toFixed(1) + " / 10";
  document.getElementById("detailLine").textContent = "Học sinh làm đúng " + correct + "/" + TOTAL + " câu.";
  document.getElementById("result").style.display = "block";
  updateProgress();
  document.getElementById("result").scrollIntoView({behavior:"smooth", block:"center"});
}

function reset(){
  submitted = false;
  ALL.forEach(function(q){
    var wrap = document.getElementById("q_"+q.key);
    wrap.querySelectorAll("input, select").forEach(function(el){
      el.disabled = false;
      if(el.type==="radio") el.checked = false;
      else el.value = "";
    });
    wrap.querySelectorAll(".opt").forEach(function(l){l.classList.remove("sel");});
    var fb = wrap.querySelector(".fb");
    fb.style.display = "none"; fb.innerHTML = ""; fb.className = "fb";
  });
  document.getElementById("result").style.display = "none";
  updateProgress();
  window.scrollTo({top:0, behavior:"smooth"});
}

document.getElementById("submitTop").addEventListener("click", grade);
document.getElementById("submitBottom").addEventListener("click", grade);
document.getElementById("resetBtn").addEventListener("click", reset);

updateProgress();
</script>
</body>
</html>
