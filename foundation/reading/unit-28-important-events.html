  h1{font-size:1.35rem; margin:.2em 0 .1em}

  .instr{background:var(--soft); border-left:3px solid var(--line); padding:8px 12px; margin:.5em 0 1em; font-size:.95rem}
  details{border:1px solid var(--line); border-radius:6px; margin:.6em 0; background:#fff}
  details>summary{cursor:pointer; padding:10px 12px; font-weight:600; font-size:.98rem}
  details[open]>summary{border-bottom:1px solid var(--line)}
  .details-body{padding:4px 12px 12px}
  table{border-collapse:collapse; width:100%; font-size:.92rem; margin:.4em 0}
  th,td{border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top}
  th{background:var(--soft)}
  .q{border:1px solid var(--line); border-radius:6px; padding:12px; margin:10px 0}
  .q-head{display:flex; gap:8px; align-items:baseline}
  .q-num{font-weight:700; min-width:2.2em}
  .q-text{flex:1}
  .opts{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
  .opt{
    font:inherit; font-size:.95rem; padding:10px 14px; min-height:44px;
    border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); cursor:pointer;
  }
  .opt:hover:not(:disabled){background:var(--soft)}
  .opt[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
  .opt:disabled{cursor:default; opacity:1}
  select,input[type="text"]{
    font:inherit; font-size:1rem; padding:10px; min-height:44px; width:100%;
    border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); margin-top:10px;
  }
  select:disabled,input:disabled{background:var(--soft); color:var(--ink); -webkit-text-fill-color:var(--ink); opacity:1}
  .fb{margin-top:10px; padding:10px; border-radius:6px; font-size:.94rem; display:none}
  .fb.show{display:block}
  .fb.ok{background:var(--okbg); border:1px solid #bcdcc6}
  .fb.no{background:var(--nobg); border:1px solid #f0c4c0}
  .fb .tag{font-weight:700}
  .fb.ok .tag{color:var(--ok)}
  .fb.no .tag{color:var(--no)}
  .fb .line{margin-top:4px}
  .summary-text{background:var(--soft); padding:12px; border-radius:6px; margin:.6em 0}
  .bar{
    position:sticky; bottom:0; background:#fff; border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom)); margin-top:24px;
  }
  .bar-inner{max-width:820px; margin:0 auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .progress{flex:1; min-width:180px; font-size:.95rem}
  button.main{
    font:inherit; font-weight:700; font-size:1rem; padding:12px 20px; min-height:48px;
    border-radius:6px; border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer;
  }
  button.main:disabled{background:#bdbdbd; border-color:#bdbdbd; color:#fff; cursor:not-allowed}
  button.ghost{
    font:inherit; font-size:1rem; padding:12px 20px; min-height:48px;
    border-radius:6px; border:1px solid var(--ink); background:#fff; color:var(--ink); cursor:pointer;
  }
  .result{border:2px solid var(--ink); border-radius:6px; padding:14px; margin:16px 0; display:none}
  .result.show{display:block}
  .score{font-size:1.5rem; font-weight:700}
  body.kb-open .bar{display:none}
  @media (max-width:600px){
    body{font-size:16px}
    .wrap{padding:12px 12px 24px}
    .opts{flex-direction:column}
    .opt{width:100%; text-align:left}
    .bar-inner{gap:8px}
    button.main,button.ghost{flex:1}
    table{font-size:.85rem}
  }

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function render(){
  let html = "";
  DATA.forEach(sec => {
    html += '<h2>' + sec.title + '</h2>';
    html += '<details><summary>\u{1F4D6} Reading Passage - ' + sec.passageTitle + '</summary><div class="details-body">';
    sec.paras.forEach(p => { html += '<p>' + p + '</p>'; });
    html += '</div></details>';

    sec.vocab.forEach(g => {
      html += '<h4>' + g.title + '</h4><table><tr><th>Word</th><th>IPA</th><th>Type</th><th>Vietnamese</th></tr>';
      g.rows.forEach(r => {
        html += '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td><td>' + r[3] + '</td></tr>';
      });
      html += '</table>';
    });
    html += '</div></details>';

    sec.exercises.forEach(ex => {
      html += '<h3>\u270F\uFE0F ' + ex.title + '</h3>';
      html += '<div class="instr">' + ex.instr + '</div>';
      ex.questions.forEach(q => {
        html += '<div class="q" id="box_' + q._id + '">';
        html += '<div class="q-head"><div class="q-num">' + q.n + '.</div><div class="q-text">' + q.text + '</div></div>';
        if (ex.type === "choice") {
          html += '<div class="opts" data-q="' + q._id + '">';
          ex.options.forEach(o => {
            html += '<button type="button" class="opt" aria-pressed="false" data-q="' + q._id + '" data-v="' + esc(o) + '">' + esc(o) + '</button>';
          });
          html += '</div>';
        } else if (ex.type === "select") {
          html += '<select data-q="' + q._id + '"><option value="">-- H\u1ecdc sinh ch\u1ecdn \u0111\u00e1p \u00e1n --</option>';
          ex.options.forEach(o => {
            html += '<option value="' + esc(o.v) + '">' + esc(o.label) + '</option>';
          });
          html += '</select>';
        } else {
          html += '<input type="text" data-q="' + q._id + '" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="H\u1ecdc sinh vi\u1ebft c\u00e2u tr\u1ea3 l\u1eddi">';
        }
        html += '<div class="fb" id="fb_' + q._id + '"></div>';
        html += '</div>';
      });
    });
  });
  document.getElementById("content").innerHTML = html;
}
render();

const answers = {};
let submitted = false;
const progressEl = document.getElementById("progress");
const submitBtn = document.getElementById("submitBtn");
const resetBtn = document.getElementById("resetBtn");
const resultEl = document.getElementById("result");

function countDone(){
  return ALL.filter(q => (answers[q._id] || "").trim() !== "").length;
}
function updateProgress(){
  const done = countDone();
  progressEl.textContent = "\u0110\u00e3 l\u00e0m " + done + "/" + TOTAL + " c\u00e2u";
  submitBtn.disabled = submitted || done < TOTAL;
}

document.getElementById("content").addEventListener("click", e => {
  const btn = e.target.closest("button.opt");
  if (!btn || submitted) return;
  const id = btn.dataset.q;
  answers[id] = btn.dataset.v;
  document.querySelectorAll('button.opt[data-q="' + id + '"]').forEach(b => {
    b.setAttribute("aria-pressed", b === btn ? "true" : "false");
  });
  updateProgress();
});
document.getElementById("content").addEventListener("change", e => {
  if (e.target.tagName === "SELECT" && !submitted) {
    answers[e.target.dataset.q] = e.target.value;
    updateProgress();
  }
});
document.getElementById("content").addEventListener("input", e => {
  if (e.target.tagName === "INPUT" && !submitted) {
    answers[e.target.dataset.q] = e.target.value;
    updateProgress();
  }
});

/* --- Chuẩn hoá câu trả lời tự do --- */
function normalize(s){
  let t = " " + String(s).toLowerCase().trim() + " ";
  t = t.replace(/[\u2018\u2019\u02bc]/g, "'").replace(/[\u201c\u201d]/g, '"');
  // dạng viết tắt -> dạng đầy đủ
  const contr = [
    [/\bit's\b/g,"it is"], [/\bthat's\b/g,"that is"], [/\bthere's\b/g,"there is"],
    [/\bhe's\b/g,"he is"], [/\bshe's\b/g,"she is"], [/\bwhat's\b/g,"what is"],
    [/\bthey're\b/g,"they are"], [/\bwe're\b/g,"we are"], [/\byou're\b/g,"you are"],
    [/\bi'm\b/g,"i am"], [/\bdon't\b/g,"do not"], [/\bdoesn't\b/g,"does not"],
    [/\bdidn't\b/g,"did not"], [/\bisn't\b/g,"is not"], [/\baren't\b/g,"are not"],
    [/\bwasn't\b/g,"was not"], [/\bweren't\b/g,"were not"], [/\bcan't\b/g,"cannot"],
    [/\bwon't\b/g,"will not"], [/\bhasn't\b/g,"has not"], [/\bhaven't\b/g,"have not"],
    [/\bi've\b/g,"i have"], [/\bi'll\b/g,"i will"], [/\bhe'd\b/g,"he had"], [/\bshe'd\b/g,"she would"]
  ];
  contr.forEach(c => { t = t.replace(c[0], c[1]); });
  // bỏ dấu câu
  t = t.replace(/[.,;:!?"'()\[\]\u2013\u2014\u2026\/]/g, " ");
  // gộp khoảng trắng
  t = t.replace(/\s+/g, " ").trim();
  return t;
}
function stripLead(t){
  return t.replace(/^(the|a|an|with|those|students|people|viewers)\s+/,"").trim();
}
function isCorrect(q){
  const given = answers[q._id] || "";
  if (q._type !== "text") return given === q.answer;
  const g = normalize(given);
  if (!g) return false;
  const list = q.accept && q.accept.length ? q.accept : [q.answer];
  for (const v of list) {
    const a = normalize(v);
    if (g === a) return true;
    if (stripLead(g) === stripLead(a)) return true;
  }
  return false;
}

/* --- Nộp bài --- */
function submit(){
  if (submitted) return;
  submitted = true;
  let correct = 0;
  ALL.forEach(q => {
    const ok = isCorrect(q);
    if (ok) correct++;
    const fb = document.getElementById("fb_" + q._id);
    let html = '<span class="tag">' + (ok ? "\u2714 \u0110\u00fang" : "\u2716 Sai") + "</span>";
    if (!ok) {
      const given = (answers[q._id] || "").trim();
      html += '<div class="line"><strong>H\u1ecdc sinh tr\u1ea3 l\u1eddi:</strong> ' + esc(given || "(b\u1ecf tr\u1ed1ng)") + "</div>";
    }
    html += '<div class="line"><strong>\u0110\u00e1p \u00e1n:</strong> ' + esc(q.answer) + "</div>";
    if (q.explain) html += '<div class="line"><strong>Gi\u1ea3i th\u00edch:</strong> ' + q.explain + "</div>";
    fb.innerHTML = html;
    fb.className = "fb show " + (ok ? "ok" : "no");
  });
  document.querySelectorAll("#content select, #content input, #content button.opt").forEach(el => el.disabled = true);
  const score = Math.round((correct / TOTAL) * 10 * 10) / 10;
  resultEl.innerHTML = '<div class="score">\u0110i\u1ec3m: ' + score.toFixed(1) + "/10</div>" +
    "<div>Tr\u1ea3 l\u1eddi \u0111\u00fang <strong>" + correct + "/" + TOTAL + "</strong> c\u00e2u.</div>" +
    "<div>H\u1ecdc sinh k\u00e9o xu\u1ed1ng \u0111\u1ec3 xem \u0111\u00e1p \u00e1n v\u00e0 gi\u1ea3i th\u00edch t\u1eebng c\u00e2u.</div>";
  resultEl.classList.add("show");
  submitBtn.disabled = true;
  resultEl.scrollIntoView({behavior:"smooth", block:"center"});
}
submitBtn.addEventListener("click", submit);

/* --- Làm lại --- */
resetBtn.addEventListener("click", () => {
  if (!submitted && countDone() > 0) {
    if (!confirm("L\u00e0m l\u1ea1i t\u1eeb \u0111\u1ea7u? To\u00e0n b\u1ed9 c\u00e2u tr\u1ea3 l\u1eddi hi\u1ec7n t\u1ea1i s\u1ebd b\u1ecb x\u00f3a.")) return;
  }
  submitted = false;
  for (const k in answers) delete answers[k];
  document.querySelectorAll("#content select").forEach(el => { el.disabled = false; el.value = ""; });
  document.querySelectorAll("#content input").forEach(el => { el.disabled = false; el.value = ""; });
  document.querySelectorAll("#content button.opt").forEach(el => { el.disabled = false; el.setAttribute("aria-pressed","false"); });
  document.querySelectorAll(".fb").forEach(el => { el.className = "fb"; el.innerHTML = ""; });
  resultEl.classList.remove("show");
  resultEl.innerHTML = "";
  updateProgress();
  window.scrollTo({top:0, behavior:"smooth"});
});

/* --- Bàn phím ảo trên điện thoại: ẩn thanh dưới khi đang gõ --- */
document.addEventListener("focusin", e => {
  if (e.target.matches("#content input[type=text]") && window.innerWidth < 700) {
    document.body.classList.add("kb-open");
  }
});
document.addEventListener("focusout", e => {
  if (e.target.matches("#content input[type=text]")) {
    setTimeout(() => document.body.classList.remove("kb-open"), 120);
  }
});

updateProgress();
console.log("T\u1ed5ng s\u1ed1 c\u00e2u:", TOTAL);
</script>
</body>
</html>
