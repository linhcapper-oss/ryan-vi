<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 22 – Bài tập Đọc hiểu</title>
<style>
  :root{
    --fg:#1b1b1b; --muted:#5a5a5a; --line:#d9d9d9; --bg:#ffffff;
    --card:#fafafa; --accent:#1c6b3c; --accent-w:#e6f2ea;
    --right:#137a2e; --right-bg:#e7f6ec; --wrong:#b3261e; --wrong-bg:#fbeceb;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
    color:var(--fg); background:var(--bg); line-height:1.55;
    font-size:17px; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:820px; margin:0 auto; padding:16px 16px 48px;}
  header h1{font-size:1.35rem; margin:.2em 0 .1em;}
  header p{color:var(--muted); margin:.2em 0; font-size:.95rem;}

  /* Thanh tiến độ dính trên cùng, gọn để không che nội dung khi gõ */
  .progress{
    position:sticky; top:0; z-index:50; background:var(--bg);
    border-bottom:1px solid var(--line); padding:10px 0; margin-bottom:8px;
  }
  .progress .bar-track{height:8px; background:#ececec; border-radius:6px; overflow:hidden;}
  .progress .bar-fill{height:100%; width:0; background:var(--accent); transition:width .2s;}
  .progress .ptext{font-size:.95rem; color:var(--muted); margin-top:6px;}

  section.reading{margin-top:26px;}
  .reading > h2{
    font-size:1.15rem; border-bottom:2px solid var(--accent);
    padding-bottom:6px; margin-bottom:10px;
  }
  details.passage{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:6px 14px; margin-bottom:16px;
  }
  details.passage summary{cursor:pointer; font-weight:600; padding:6px 0; outline:none;}
  details.passage p{margin:.6em 0;}

  details.vocab{
    background:var(--accent-w); border:1px solid #cfe3d6; border-radius:10px;
    padding:6px 14px; margin:0 0 16px;
  }
  details.vocab summary{cursor:pointer; font-weight:600; padding:6px 0; outline:none; color:var(--accent);}
  .vgroup{font-weight:700; margin:10px 0 6px; color:#0f4d2a; font-size:.98rem;}
  .vitem{
    display:grid; grid-template-columns:1fr auto; gap:2px 10px;
    padding:8px 0; border-bottom:1px solid #d3e6d9;
  }
  .vitem:last-child{border-bottom:none;}
  .vhead{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px;}
  .vword{font-weight:700;}
  .vipa{color:#4a6a58; font-size:.92rem;}
  .vtype{color:#6a6a6a; font-size:.85rem; font-style:italic;}
  .vvi{grid-column:1 / -1; color:#333; font-size:.96rem;}

  .exercise{margin:18px 0 6px;}
  .exercise h3{font-size:1.03rem; margin:.2em 0;}
  .exercise .instruction{color:var(--muted); font-size:.93rem; margin:.2em 0 12px;}
  .wordbank{
    background:var(--accent-w); border:1px solid #cfe3d6; border-radius:8px;
    padding:8px 12px; font-size:.95rem; margin-bottom:12px;
  }
  .wordbank b{color:var(--accent);}

  .q{
    border:1px solid var(--line); border-radius:10px; padding:12px 14px;
    margin:10px 0; background:#fff;
  }
  .q .qtext{margin:0 0 10px; display:flex; gap:8px;}
  .q .qnum{font-weight:700; color:var(--accent); flex:0 0 auto;}
  .q .qbody{flex:1 1 auto;}
  .q .qbody .blank{
    display:inline-block; min-width:64px; border-bottom:2px solid var(--muted);
    text-align:center; padding:0 6px; font-weight:600;
  }

  /* Nút chọn (T/F/NG, Multiple choice ...) */
  .opts{display:flex; flex-wrap:wrap; gap:8px;}
  .opts.stack{flex-direction:column;}
  .opt{
    appearance:none; border:1.5px solid var(--line); background:#fff; color:var(--fg);
    border-radius:9px; padding:11px 14px; font-size:1rem; cursor:pointer;
    text-align:left; min-height:46px; line-height:1.35;
  }
  .opts:not(.stack) .opt{flex:1 1 auto;}
  .opt:hover{border-color:var(--accent);}
  .opt.sel{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
  .opt:disabled{cursor:default; opacity:1;}

  /* Dropdown */
  select.dd{
    width:100%; max-width:100%; font-size:1rem; padding:11px 12px;
    border:1.5px solid var(--line); border-radius:9px; background:#fff; color:var(--fg);
    min-height:46px;
  }
  select.dd:focus{border-color:var(--accent); outline:none;}

  /* Ô viết tự do */
  input.freetext{
    width:100%; font-size:1rem; padding:11px 12px; border:1.5px solid var(--line);
    border-radius:9px; background:#fff; color:var(--fg); min-height:46px;
  }
  input.freetext:focus{border-color:var(--accent); outline:none;}
  input.freetext:disabled{background:#f3f3f3;}

  /* Kết quả sau khi nộp */
  .q.correct{border-color:var(--right); background:var(--right-bg);}
  .q.incorrect{border-color:var(--wrong); background:var(--wrong-bg);}
  .verdict{font-weight:700; margin:10px 0 4px; display:flex; align-items:center; gap:6px;}
  .verdict.ok{color:var(--right);} .verdict.no{color:var(--wrong);}
  .ansline{margin:4px 0; font-size:.96rem;}
  .ansline .lbl{font-weight:600;}
  .explain{margin:4px 0 0; font-size:.95rem; color:#333;}

  .q.correct .opt.sel{background:var(--right); border-color:var(--right); color:#fff;}
  .q.incorrect .opt.sel{background:var(--wrong); border-color:var(--wrong); color:#fff;}
  .opt.showans{border-color:var(--right); background:var(--right-bg); color:var(--right); font-weight:600;}

  /* Khu nộp bài — đặt tĩnh ở cuối trang, không che nội dung khi bàn phím ảo bật */
  .actions{margin-top:26px; display:flex; flex-direction:column; gap:12px;}
  .btn{
    font-size:1.06rem; font-weight:600; padding:15px 18px; border-radius:11px;
    border:none; cursor:pointer; min-height:52px;
  }
  .btn-submit{background:var(--accent); color:#fff;}
  .btn-submit:disabled{background:#bcbcbc; cursor:not-allowed;}
  .btn-reset{background:#fff; color:var(--fg); border:1.5px solid var(--line);}

  .scorebox{
    display:none; border:2px solid var(--accent); background:var(--accent-w);
    border-radius:12px; padding:16px; text-align:center; margin-top:8px;
  }
  .scorebox .score{font-size:2rem; font-weight:800; color:var(--accent);}
  .scorebox .sub{color:#333; margin-top:4px;}

  .hint{font-size:.9rem; color:var(--muted); text-align:center;}

  @media (max-width:480px){
    body{font-size:16px;}
    .wrap{padding:12px 12px 40px;}
  }
</style>
</head>

<div class="wrap">
  <header>
    <h1>Unit 22 – Bài tập Đọc hiểu</h1>
    <p>Học sinh làm đủ tất cả các câu, sau đó bấm <b>Nộp bài</b> để xem điểm và giải thích.</p>

  <div class="progress">
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>

  </div>

  <main id="quiz"></main>

      <div class="score" id="scoreNum">–</div>
      <div class="sub" id="scoreSub"></div>

    <button class="btn btn-submit" id="submitBtn" disabled>Nộp bài</button>

      "<b>A.</b> For most of the last century, conservation meant drawing a line around a fragile landscape and keeping people out. In recent years, however, a bolder and more controversial idea has gained ground: <b>rewilding</b>. Rather than simply freezing an ecosystem in its current state, rewilding attempts to restore the natural processes that once shaped it – the grazing, the flooding, the predators and their prey – and then, as far as possible, to step back and let nature take charge. The approach has provoked both excitement and unease among scientists, farmers, and rural communities alike.",
      "<b>B.</b> The most celebrated example comes from Yellowstone National Park in the United States. When grey wolves were reintroduced in 1995 after an absence of seventy years, the consequences rippled far beyond the animals themselves. With <b>predators</b> once again hunting the deer, the deer avoided open valleys, allowing young trees to recover. Birds returned to the new woodland, beavers built dams, and the behaviour of the rivers themselves reportedly changed. This chain reaction, in which a single species influences an entire <b>food chain</b>, is known as a <b>trophic cascade</b>, and it captured the public imagination worldwide.",
      "<b>C.</b> Advocates argue that rewilding offers a rare form of hope. A degraded habitat, they claim, can regain its lost <b>biodiversity</b> at relatively low cost, because nature does much of the work for free. Wetlands restored in this way can store carbon and reduce the risk of flooding downstream; forests that regenerate on abandoned farmland can shelter <b>endangered</b> wildlife. For supporters, the philosophy represents a shift from managing nature towards <b>trusting</b> it – a humbler relationship between humans and the living world.",

      "<b>E.</b> These tensions are especially sharp in densely populated regions where truly wild land is scarce. In much of Europe and Asia, there are few areas large enough to support free-roaming predators without conflict. As a result, many projects adopt a compromise. Fences remain, some species are managed rather than left entirely alone, and the goal is a <b>semi-wild</b> landscape that balances ecological ambition with human needs. Purists complain that this is not real rewilding at all, but its defenders reply that a workable solution is better than an ideal one that never happens.",

/* ====================== DỰNG GIAO DIỆN ====================== */
const quizEl = document.getElementById("quiz");
let ALL = [];          // danh sách phẳng mọi câu hỏi
let submitted = false;

function esc(s){return s;} // đề đã là chuỗi an toàn do mình tự nhập

DATA.forEach((rd, ri)=>{
  const sec = document.createElement("section");
  sec.className = "reading";

  const h2 = document.createElement("h2");
  h2.textContent = rd.reading;
  sec.appendChild(h2);

  // Passage (có thể thu gọn)
  const det = document.createElement("details");
  det.className = "passage";
  det.open = true;
  const sum = document.createElement("summary");
  sum.textContent = "📖 Bài đọc (bấm để mở/đóng)";
  det.appendChild(sum);
  rd.passage.forEach(par=>{
    const p = document.createElement("p");
    p.innerHTML = par;
    det.appendChild(p);
  });
  sec.appendChild(det);

  // Key Vocabulary (ngay dưới bài đọc, có thể mở/đóng)
  if(rd.vocab && rd.vocab.length){
    const vd = document.createElement("details");
    vd.className = "vocab";
    const vsum = document.createElement("summary");
    vsum.textContent = "📚 Key Vocabulary (bấm để mở/đóng)";
    vd.appendChild(vsum);
    rd.vocab.forEach(g=>{
      const gh = document.createElement("div");
      gh.className = "vgroup";
      gh.innerHTML = g.group;
      vd.appendChild(gh);
      g.words.forEach(item=>{
        const it = document.createElement("div");
        it.className = "vitem";
        it.innerHTML =
          "<div class='vhead'><span class='vword'>"+item.w+"</span>"+
          "<span class='vipa'>"+item.ipa+"</span>"+
          "<span class='vtype'>"+item.t+"</span></div>"+
          "<div class='vvi'>"+item.vi+"</div>";
        vd.appendChild(it);
      });
    });
    sec.appendChild(vd);
  }

  rd.exercises.forEach((ex, ei)=>{
    const exDiv = document.createElement("div");
    exDiv.className = "exercise";

    const h3 = document.createElement("h3");
    h3.textContent = "✏️ " + ex.title;
    exDiv.appendChild(h3);

    const ins = document.createElement("div");
    ins.className = "instruction";
    ins.textContent = ex.instruction;
    exDiv.appendChild(ins);

    if(ex.wordbank){
      const wbDiv = document.createElement("div");
      wbDiv.className = "wordbank";
      wbDiv.innerHTML = "<b>Word bank:</b> " + ex.wordbank.join(" · ");
      exDiv.appendChild(wbDiv);
    }
    if(ex.listHeadings){
      const box = document.createElement("div");
      box.className = "wordbank";
      box.innerHTML = "<b>List of Headings:</b><br>" + HEADINGS.map(h=>h[1]).join("<br>");
      exDiv.appendChild(box);
    }
    if(ex.listEndings){
      const box = document.createElement("div");
      box.className = "wordbank";
      box.innerHTML = "<b>Sentence endings:</b><br>" + ENDINGS.map(h=>h[1]).join("<br>");
      exDiv.appendChild(box);
    }

    ex.questions.forEach((q, qi)=>{
      const qid = "r"+ri+"e"+ei+"q"+qi;
      const rec = {
        id:qid, type:ex.type, answer:q.a,
        accepted:q.accepted||null, explain:q.e||null,
        value:null, el:null
      };

      const qDiv = document.createElement("div");
      qDiv.className = "q";
      qDiv.id = qid;

      const qtext = document.createElement("div");
      qtext.className = "qtext";
      qtext.innerHTML = "<span class='qnum'>"+(qi+1)+".</span><span class='qbody'>"+q.p+"</span>";
      qDiv.appendChild(qtext);

      if(ex.type === "buttons"){
        const opts = q.options ? q.options : ex.options.map(o=>[o,o]);
        const wrap = document.createElement("div");
        wrap.className = "opts" + (ex.stack||q.options ? " stack" : "");
        opts.forEach(o=>{
          const val = Array.isArray(o)?o[0]:o;
          const lab = Array.isArray(o)?o[1]:o;
          const b = document.createElement("button");
          b.className = "opt"; b.type="button";
          b.textContent = lab; b.dataset.val = val;
          b.addEventListener("click", ()=>{
            if(submitted) return;
            wrap.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));
            b.classList.add("sel");
            rec.value = val;
            updateProgress();
          });
          wrap.appendChild(b);
        });
        qDiv.appendChild(wrap);
        rec.optWrap = wrap;
      }
      else if(ex.type === "select"){
        const sel = document.createElement("select");
        sel.className = "dd";
        const ph = document.createElement("option");
        ph.value=""; ph.textContent="— chọn —"; ph.disabled=false; ph.selected=true;
        sel.appendChild(ph);
        ex.options.forEach(o=>{
          const op = document.createElement("option");
          op.value=o[0]; op.textContent=o[1];
          sel.appendChild(op);
        });
        sel.addEventListener("change", ()=>{
          if(submitted) return;
          rec.value = sel.value || null;
          updateProgress();
        });
        qDiv.appendChild(sel);
        rec.selEl = sel;
      }
      else if(ex.type === "text"){
        const inp = document.createElement("input");
        inp.className="freetext"; inp.type="text";
        inp.setAttribute("autocomplete","off");
        inp.setAttribute("autocapitalize","off");
        inp.setAttribute("autocorrect","off");
        inp.placeholder="Nhập câu trả lời...";
        inp.addEventListener("input", ()=>{
          if(submitted) return;
          rec.value = inp.value.trim()!=="" ? inp.value : null;
          updateProgress();
        });
        qDiv.appendChild(inp);
        rec.inpEl = inp;
      }

      rec.el = qDiv;
      ALL.push(rec);
      exDiv.appendChild(qDiv);
    });

    sec.appendChild(exDiv);
  });

  quizEl.appendChild(sec);
});

const TOTAL = ALL.length;

/* ====================== TIẾN ĐỘ ====================== */
const barFill = document.getElementById("barFill");
const progressText = document.getElementById("progressText");
const submitBtn = document.getElementById("submitBtn");
const resetBtn = document.getElementById("resetBtn");
const hint = document.getElementById("hint");

function countDone(){
  return ALL.filter(r=>r.value!==null && r.value!=="").length;
}
function updateProgress(){
  const done = countDone();
  progressText.textContent = "Đã làm " + done + "/" + TOTAL + " câu";
  barFill.style.width = (done/TOTAL*100) + "%";
  if(!submitted){
    submitBtn.disabled = (done < TOTAL);
    hint.style.display = (done < TOTAL) ? "block" : "none";
  }
}

/* ====================== CHẤM BÀI ====================== */
function normalize(s){
  return (s||"")
    .toLowerCase()
    .replace(/[.,!?;:'"“”‘’\-–—()\/]/g," ")
    .replace(/\s+/g," ")
    .trim();
}
function isTextCorrect(rec){
  const given = normalize(rec.value);
  const list = (rec.accepted && rec.accepted.length) ? rec.accepted : [rec.answer];
  return list.some(a=>normalize(a)===given);
}

const scorebox = document.getElementById("scorebox");
const scoreNum = document.getElementById("scoreNum");
const scoreSub = document.getElementById("scoreSub");

function submit(){
  if(submitted) return;
  submitted = true;
  let correct = 0;

  ALL.forEach(rec=>{
    let ok;
    if(rec.type==="text") ok = isTextCorrect(rec);
    else ok = (rec.value === rec.answer);
    if(ok) correct++;

    rec.el.classList.add(ok ? "correct" : "incorrect");

    // Khoá ô nhập
    if(rec.optWrap){
      rec.optWrap.querySelectorAll(".opt").forEach(b=>{
        b.disabled = true;
        if(b.dataset.val === rec.answer) b.classList.add("showans");
      });
    }
    if(rec.selEl) rec.selEl.disabled = true;
    if(rec.inpEl) rec.inpEl.disabled = true;

    // Dòng kết quả
    const v = document.createElement("div");
    v.className = "verdict " + (ok?"ok":"no");
    v.innerHTML = ok ? "✓ Đúng" : "✗ Sai";
    rec.el.appendChild(v);

    if(!ok){
      const ans = document.createElement("div");
      ans.className = "ansline";
      ans.innerHTML = "<span class='lbl'>Đáp án đúng:</span> " + rec.answer;
      rec.el.appendChild(ans);
    }
    if(rec.explain){
      const ex = document.createElement("div");
      ex.className = "explain";
      ex.innerHTML = "<span class='lbl'>Giải thích:</span> " + rec.explain;
      rec.el.appendChild(ex);
    }
  });

  const score10 = Math.round((correct/TOTAL)*10*10)/10;
  scoreNum.textContent = score10.toFixed(1).replace(".",",") + " / 10";
  scoreSub.textContent = "Học sinh trả lời đúng " + correct + "/" + TOTAL + " câu.";
  scorebox.style.display = "block";

  submitBtn.style.display = "none";
  resetBtn.style.display = "block";
  hint.style.display = "none";

  scorebox.scrollIntoView({behavior:"smooth", block:"center"});
}

function reset(){
  submitted = false;
  ALL.forEach(rec=>{
    rec.value = null;
    rec.el.classList.remove("correct","incorrect");
    // xoá dòng kết quả đã thêm
    rec.el.querySelectorAll(".verdict, .ansline, .explain").forEach(n=>n.remove());
    if(rec.optWrap){
      rec.optWrap.querySelectorAll(".opt").forEach(b=>{
        b.disabled=false; b.classList.remove("sel","showans");
      });
    }
    if(rec.selEl){ rec.selEl.disabled=false; rec.selEl.value=""; }
    if(rec.inpEl){ rec.inpEl.disabled=false; rec.inpEl.value=""; }
  });
  scorebox.style.display="none";
  submitBtn.style.display="block";
  resetBtn.style.display="none";
  updateProgress();
  window.scrollTo({top:0, behavior:"smooth"});
}

submitBtn.addEventListener("click", submit);
resetBtn.addEventListener("click", reset);
updateProgress();
</script>
