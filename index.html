<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unit 20 - Vocabulary &amp; Reading Practice</title>
<style>
  :root{
    --line:#d9d9d9; --ink:#1a1a1a; --muted:#5c5c5c;
    --ok:#1b6b2f; --okbg:#eaf5ec; --no:#a32020; --nobg:#fbecec;
    --sel:#1a1a1a;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:#fff; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","Liberation Sans",sans-serif;
    font-size:16px; line-height:1.6;
  }
  .wrap{max-width:820px; margin:0 auto; padding:0 14px 60px}
  h1{font-size:1.35rem; margin:18px 0 4px}
  h2{font-size:1.15rem; margin:32px 0 8px; padding-top:14px; border-top:2px solid var(--ink)}
  h3{font-size:1rem; margin:22px 0 6px}
  p{margin:0 0 10px}
  .sub{color:var(--muted); font-size:.9rem; margin-bottom:14px}

  /* thanh trên cùng: sticky, gọn 1 dòng, không che nội dung khi bàn phím ảo bật lên */
  .bar{
    position:sticky; top:0; z-index:20; background:#fff;
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:8px 14px; margin:0 -14px 4px;
  }
  .bar .prog{font-size:.95rem; font-weight:600; margin-right:auto}
  button{
    font:inherit; font-weight:600; cursor:pointer;
    border:1px solid var(--ink); background:#fff; color:var(--ink);
    border-radius:6px; padding:10px 16px; min-height:44px;
  }
  button.primary{background:var(--ink); color:#fff}
  button[disabled]{opacity:.4; cursor:not-allowed}

  details{border:1px solid var(--line); border-radius:6px; padding:6px 12px; margin:10px 0}
  details summary{cursor:pointer; font-weight:600; padding:6px 0}
  details[open] summary{border-bottom:1px solid var(--line); margin-bottom:8px}

  table{border-collapse:collapse; width:100%; font-size:.92rem; margin:8px 0}
  th,td{border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top}
  th{background:#f4f4f4}

  .instr{font-size:.95rem; background:#f7f7f7; border-left:3px solid var(--line); padding:8px 12px; margin:8px 0 14px}
  .extra{border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin:10px 0}
  .bank{font-size:.95rem}

  .q{border-top:1px solid var(--line); padding:12px 0; scroll-margin-top:96px}
  .q .num{font-weight:700; margin-right:6px}
  .qtext{margin-bottom:8px}
  .opts{display:flex; flex-wrap:wrap; gap:8px}
  .opts.block{flex-direction:column; gap:6px}
  .opt{display:block}
  .opt input{position:absolute; opacity:0; width:0; height:0}
  .opt span{
    display:block; border:1px solid var(--line); border-radius:6px;
    padding:9px 14px; min-height:44px; line-height:1.5; user-select:none;
  }
  .opts.block .opt span{padding:9px 12px}
  .opt input:checked + span{border-color:var(--sel); background:var(--sel); color:#fff}
  .opt input:focus-visible + span{outline:2px solid #666; outline-offset:2px}
  .locked .opt span{cursor:default; opacity:.85}

  input[type=text]{
    font:inherit; width:100%; max-width:340px; padding:10px 12px; min-height:44px;
    border:1px solid #999; border-radius:6px; background:#fff; color:var(--ink);
  }
  input[type=text]:disabled{background:#f4f4f4; color:#333}

  .fb{display:none; margin-top:10px; padding:8px 12px; border-radius:6px; font-size:.95rem}
  .q.correct .fb{display:block; background:var(--okbg); border-left:3px solid var(--ok)}
  .q.wrong .fb{display:block; background:var(--nobg); border-left:3px solid var(--no)}
  .fb .mark{font-weight:700}
  .q.correct .fb .mark{color:var(--ok)}
  .q.wrong .fb .mark{color:var(--no)}
  .fb .row{margin-top:4px}

  #score{display:none; border:2px solid var(--ink); border-radius:8px; padding:14px; margin:14px 0; scroll-margin-top:96px}
  #score.show{display:block}
  #score .big{font-size:1.6rem; font-weight:700}

  .foot{margin-top:26px; padding-top:14px; border-top:1px solid var(--line); display:flex; gap:10px; flex-wrap:wrap}
  @media (max-width:480px){
    body{font-size:15px}
    .bar .prog{width:100%; margin-bottom:2px}
    .bar button{flex:1}
    input[type=text]{max-width:100%}
  }
</style>
</head>

  passage: `
<p>Vietnam has a long coast of more than 3,000 kilometres. This is beautiful, but it also brings danger. Every year, many storms come from the East Sea and hit the country. The storm <b>season</b> usually starts in June and ends in November. Central Vietnam gets the most storms.</p>
<p>Before a storm arrives, the weather changes quickly. The air becomes hot and <b>humid</b>. The sky turns grey. Then the wind gets stronger and heavy rain falls for many hours. The <b>temperature</b> often drops fast.</p>
<p>Today, people can get a weather <b>forecast</b> on television, on the radio, or on their phones. Scientists watch the <b>storm</b> and tell people where it will go. They also <b>warn</b> people about the wind speed. This information is very useful. Fifty years ago, many fishermen did not know about a storm until it was too late.</p>
<p>When a big storm comes, the water level rises and rivers cannot hold all the rain. Then a <b>flood</b> covers roads, fields and houses. In the mountains, heavy rain can also cause a <b>landslide</b>. Soil and rocks fall down the hill and block the road. Both floods and landslides can <b>damage</b> homes, schools and crops. In some years, the damage costs the country billions of dong.</p>
<p>People do many things to <b>prepare</b>. Farmers harvest their rice early. Families buy rice, instant noodles, water, candles and batteries. Fishermen bring their boats back to the <b>harbour</b>. Some families put sandbags around the door, and others move their furniture to a higher floor. If the storm is very strong, local officers ask people to leave their homes and go to a <b>shelter</b>. A shelter is usually a school or a big public building on high ground.</p>
<p>During the storm, the safest place is inside the house. People should stay away from windows, and they should not go outside to look at the water. Many accidents happen when people try to cross a flooded road. The water can be deeper and faster than it looks.</p>
<p>After a storm, a <b>rescue</b> team comes with boats. Soldiers, doctors and <b>volunteers</b> help people who cannot <b>escape</b> from their houses. They bring food, clean water and medicine. Volunteers from other cities often send money and warm clothes, too.</p>
<p>Vietnam cannot stop storms, but it can reduce the damage. Better forecasts, stronger houses and good plans save many lives every year. Teachers also talk about natural <b>disasters</b> in class, so children know what to do. Local officers often repeat one simple message: a family that prepares early is a family that stays safe.</p>`,

  title: "READING 2 - The River That Turned Salty",
  passage: `
<p><b>A.</b> The Mekong Delta covers about 40,000 square kilometres in southern Vietnam and produces more than half of the country's rice. For centuries the river has supported farmers here by carrying fresh water and rich <b>sediment</b> from <b>upstream</b>, spreading it across the fields during the flood season. The delta also supplies a large share of Vietnam's fruit and seafood exports. When something goes wrong in this small corner of the map, the effect is felt in markets across the whole country.</p>
<p><b>B.</b> In recent years, however, the <b>dry season</b> has become longer and harder. Scientists point to two main reasons. The first is <b>climate change</b>: <b>rainfall</b> patterns have become less predictable, and periods of very hot weather now last longer. The second is human activity. Dozens of dams have been built <b>upstream</b> on the Mekong and its branches, and they hold back water in order to produce electricity. When less water flows down to the delta, the river becomes weak, and <b>severe</b> <b>drought</b> follows.</p>
<p><b>C.</b> A weak river cannot push back the sea. This is when <b>saltwater intrusion</b> begins. Seawater moves slowly up the river channels, sometimes travelling sixty or seventy kilometres inland. In the worst years, salt has been measured almost ninety kilometres from the coast. Farmers cannot always see the problem at first, because salty water looks exactly like fresh water. Many of them discover it only when their plants begin to turn yellow.</p>
<p><b>D.</b> The results for farming families are serious. Salt stays in the <b>soil</b> and damages young rice plants, so an entire <b>crop</b> can be lost within a few weeks. Fruit trees such as durian and mango, which take years to grow, may die completely. At the same time, households face a <b>shortage</b> of clean water for cooking and drinking, and some must buy it from trucks at high prices. Every year, a number of families give up farming and <b>migrate</b> to Ho Chi Minh City to look for factory work.</p>
<p><b>E.</b> Yet the delta is learning to <b>adapt</b>. Agricultural institutes have developed rice varieties that are <b>tolerant</b> of salt and can survive in mildly salty fields. In coastal districts, many farmers have changed from growing rice to raising shrimp, which actually need brackish water. Local governments have built <b>sluice gates</b> to keep the sea out of the canals, together with small <b>reservoirs</b> that store fresh water for the dry months. Farmers now receive salinity warnings by text message, so they know when it is safe to open their gates.</p>
<p><b>F.</b> Experts agree, though, that no single measure is enough. The Mekong flows through six countries before it reaches Vietnam, so decisions made far away change daily life in the delta. Regional cooperation on how much water each country takes is therefore essential. Researchers also stress the value of education: when young people understand why the water around them is changing, they are better prepared to protect the place where they live.</p>`,

<p><b>A.</b> When floodwater rises through the streets of a modern Asian city, the immediate explanation is usually meteorological: an unusually heavy downpour, a slow-moving storm, an exceptional tide. Yet researchers who study urban flooding increasingly argue that the weather is only half the story. Over the past three decades, rapid <b>urbanisation</b> has transformed the ground on which these cities stand, and in doing so has made them far more <b>vulnerable</b> to water that earlier generations would have <b>absorbed</b> without difficulty. The flood, in other words, is partly manufactured.</p>
<p><b>B.</b> The basic mechanism is straightforward. Natural ground - soil, grass, forest - behaves like a sponge, allowing rain to soak slowly downwards. Concrete and asphalt do not: they are <b>impermeable</b>, so almost every drop that falls becomes surface <b>runoff</b>, arriving in the drains within minutes rather than hours. A city that doubles its built-up area can therefore face a sharp rise in peak water volume even when total rainfall has not changed at all. Making matters worse, much of the <b>drainage</b> <b>infrastructure</b> in South-East Asian cities was designed in the 1970s and 1980s, using rainfall records that no longer describe the present climate. Pipes sized for a storm expected once a decade may now be tested several times a year.</p>
<p><b>C.</b> A second, quieter process is at work beneath the pavement. As populations grow, households, factories and hotels pump <b>groundwater</b> from below the city faster than nature can replace it. The layers of clay and sand underneath then compact, and the land itself begins to sink - a phenomenon known as <b>subsidence</b>. Dr Lan Vo of the Coastal Systems Research Centre estimates that parts of Ho Chi Minh City have dropped by as much as four centimetres a year, several times faster than the sea is rising. Sea-level rise, she observes, attracts most of the headlines, yet in many delta cities the ground is falling more quickly than the ocean is climbing. Because the two processes combine, subsidence can <b>exacerbate</b> even a moderate high tide.</p>
<p><b>D.</b> Not everyone accepts that the solution lies in nature. Hendrik Bosch, a flood-defence engineer with thirty years' experience in delta cities, argues that dykes, pumps and storm barriers remain indispensable, and that the real weakness of most systems is neglect rather than design. Canals silt up, pumping stations are not serviced, and maintenance budgets are almost always the first item to be cut when money is short. In his view, cities should <b>retrofit</b> and properly maintain the defences they already possess before investing in fashionable alternatives.</p>
<p><b>E.</b> Those alternatives have nevertheless gained ground. Professor Adrian Kessler of the Institute for Urban Water Studies promotes the so-called &quot;sponge city&quot; approach, in which parks, porous pavements and rooftop gardens are used to slow water down and allow the soil to absorb it. Restoring <b>wetlands</b> at the upper edge of a <b>catchment</b>, he argues, is frequently cheaper than enlarging underground drains, and delivers additional benefits - cooler streets, cleaner air, open space for recreation - that concrete can never provide. His team calculates that a single hectare of restored marsh can hold back as much water as several kilometres of new pipe.</p>
<p><b>F.</b> Yet engineering of any kind addresses only part of the problem. Dr Miriam Osei of the Global Disaster Risk Network points out that the households worst affected by urban floods are rarely those standing in the deepest water; they are those with the fewest resources - informal settlements built on low ground, families without savings, workers who cannot afford to lose a day's wages by leaving early during an <b>evacuation</b>. Warning systems, she insists, should be judged not by their technical accuracy but by whether the most vulnerable residents are actually able to act on them. Building genuine <b>resilience</b>, therefore, means combining sharper forecasts with insurance, housing policy and secure incomes. Cities cannot <b>mitigate</b> every flood, but they can determine who suffers most when the water arrives - and that outcome, far more than the weather itself, lies within human control.</p>`,

var ALL = [];   // danh sách phẳng tất cả câu hỏi
var locked = false;

(function build(){

  var html = '';
  var n = 0;
  for (var s=0; s<DATA.length; s++){
    var sec = DATA[s];
    html += '<h2>' + sec.title + '</h2>';
    html += '<details><summary>📖 Reading Passage</summary>' + sec.passage + '</details>';
    html += '<details><summary>📚 Key Vocabulary</summary>' + sec.vocab + '</details>';
    for (var e=0; e<sec.exercises.length; e++){
      var ex = sec.exercises[e];
      html += '<h3>✏️ ' + ex.title + '</h3>';
      html += '<div class="instr">' + ex.instr + '</div>';
      if (ex.extra) html += '<div class="extra">' + ex.extra + '</div>';
      for (var i=0; i<ex.questions.length; i++){
        var q = ex.questions[i];
        n++;
        var id = 'q' + n;
        ALL.push({id:id, kind:ex.kind, ans:q.a, disp:q.disp, exp:q.e});
        html += '<div class="q" id="box_' + id + '">';
        html += '<div class="qtext"><span class="num">' + n + '.</span>' + q.q + '</div>';
        if (ex.kind === 'text'){
          html += '<input type="text" id="' + id + '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Nhập câu trả lời">';
        } else if (ex.kind === 'block'){
          html += '<div class="opts block">';
          for (var o=0; o<q.opts.length; o++){
            var val = q.opts[o].charAt(0);
            html += '<label class="opt"><input type="radio" name="' + id + '" value="' + val + '"><span>' + q.opts[o] + '</span></label>';
          }
          html += '</div>';
        } else {
          html += '<div class="opts">';
          for (var p=0; p<ex.options.length; p++){
            html += '<label class="opt"><input type="radio" name="' + id + '" value="' + ex.options[p] + '"><span>' + ex.options[p] + '</span></label>';
          }
          html += '</div>';
        }
        html += '<div class="fb" id="fb_' + id + '"></div>';
        html += '</div>';
      }
    }
  }
  root.innerHTML = html;

/* ============================================================
   CHUẨN HOÁ & CHẤM
   ============================================================ */
function norm(s){
  s = (s || '').toLowerCase();
  s = s.replace(/[’‘`´]/g, "'").replace(/[“”]/g, '"');
  s = s.replace(/&/g, ' and ');
  s = s.replace(/(\d)[,.](\d)/g, '$1$2');           // 40,000 -> 40000
  s = s.replace(/[.,;:!?"'()\[\]\/\\\-–—_]/g, ' '); // bỏ dấu câu
  s = s.replace(/\s+/g, ' ').trim();
  s = s.replace(/^(about|approximately|around|nearly|almost)\s+/, '');
  s = s.replace(/^(the|a|an)\s+/, '');
  s = s.replace(/^(it is|it s|its)\s+/, '');
  s = s.replace(/^(that)\s+/, '');
  return s;
}
function getVal(item){
  if (item.kind === 'text') return document.getElementById(item.id).value;
  var el = document.querySelector('input[name="' + item.id + '"]:checked');
  return el ? el.value : '';
}
function answered(item){ return getVal(item).trim() !== ''; }
function isCorrect(item){
  var v = getVal(item);
  if (item.kind === 'text'){
    var nv = norm(v);
    for (var i=0; i<item.ans.length; i++){ if (norm(item.ans[i]) === nv) return true; }
    return false;
  }
  return v === item.ans;
}
function shownAnswer(item){
  if (item.kind === 'text') return item.disp || item.ans[0];
  return item.ans;
}

function updateProgress(){
  if (locked) return;
  var done = 0;
  for (var i=0; i<ALL.length; i++){ if (answered(ALL[i])) done++; }
  document.getElementById('prog').textContent = 'Đã làm ' + done + '/' + ALL.length + ' câu';
  var ready = (done === ALL.length);
  document.getElementById('submit').disabled = !ready;
  document.getElementById('submit2').disabled = !ready;
}

function submit(){
  if (locked) return;
  var correct = 0;
  for (var i=0; i<ALL.length; i++){
    var item = ALL[i];
    var ok = isCorrect(item);
    if (ok) correct++;
    var box = document.getElementById('box_' + item.id);
    box.className = 'q locked ' + (ok ? 'correct' : 'wrong');
    var fb = document.getElementById('fb_' + item.id);
    var h = '<div><span class="mark">' + (ok ? '✔ Đúng' : '✘ Sai') + '</span></div>';
    h += '<div class="row"><b>Đáp án:</b> ' + shownAnswer(item) + '</div>';
    if (item.exp) h += '<div class="row"><b>Giải thích:</b> ' + item.exp + '</div>';
    fb.innerHTML = h;
  }
  // khoá toàn bộ ô nhập
  var inputs = document.querySelectorAll('#content input');
  for (var k=0; k<inputs.length; k++) inputs[k].disabled = true;
  locked = true;
  document.getElementById('submit').disabled = true;
  document.getElementById('submit2').disabled = true;

  var mark = Math.round(correct / ALL.length * 100) / 10;
  var box = document.getElementById('score');
  box.className = 'show';
  box.innerHTML = '<div class="big">Điểm: ' + mark.toFixed(1) + ' / 10</div>' +
    '<div>Số câu đúng: <b>' + correct + '/' + ALL.length + '</b> · Số câu sai: <b>' + (ALL.length - correct) + '</b></div>' +
    '<div style="margin-top:6px">Học sinh kéo xuống dưới để xem đáp án và giải thích từng câu.</div>';
  document.getElementById('prog').textContent = 'Đã nộp bài · ' + correct + '/' + ALL.length + ' câu đúng';
  box.scrollIntoView({block:'start'});
}

function reset(){
  var inputs = document.querySelectorAll('#content input');
  for (var k=0; k<inputs.length; k++){
    inputs[k].disabled = false;
    if (inputs[k].type === 'radio') inputs[k].checked = false; else inputs[k].value = '';
  }
  for (var i=0; i<ALL.length; i++){
    document.getElementById('box_' + ALL[i].id).className = 'q';
    document.getElementById('fb_' + ALL[i].id).innerHTML = '';
  }
  document.getElementById('score').className = '';
  locked = false;
  updateProgress();
  window.scrollTo(0, 0);
}

document.getElementById('submit').addEventListener('click', submit);
document.getElementById('submit2').addEventListener('click', submit);
document.getElementById('reset').addEventListener('click', reset);
document.getElementById('reset2').addEventListener('click', reset);
updateProgress();
</script>
</body>
</html>
